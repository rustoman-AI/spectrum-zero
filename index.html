// ============================================================
// src/foundry.js — Beam-powered altar economy with overheat
//
// 4 altar zones on the city ground. Each requires a beam held on it
// for 80% of its rate. 20% accrues passively.
// Overheat: efficiency halves after 6s continuous, recovers over 10s.
// No beam can reach an altar AND a ship (opposite directions).
// ============================================================





let resources = { brass: 0, bronze: 0, silver: 0, gold: 0 };
let faith = 0;
let priestCount = 0;
const altars = [];

function getResources() { return resources; }
function getFaith() { return faith; }
function getPriestCount() { return priestCount; }
function addPriest() { priestCount++; }

function canAfford(cost) {
  if (!cost) return false;
  for (const key in cost) {
    if ((resources[key] || 0) < cost[key]) return false;
  }
  return true;
}

function spend(cost) {
  for (const key in cost) { resources[key] -= cost[key]; }
}

function addKillReward(reward) {
  if (!reward) return;
  for (const key in reward) { resources[key] = (resources[key] || 0) + reward[key]; }
}

function resetFoundries() {
  resources = { brass: 0, bronze: 0, silver: 0, gold: 0 };
  faith = 0;
  priestCount = 0;
  for (const a of altars) { a.litTime = 0; a.overheated = false; a.cooldown = 0; a.everLit = false; }
}

function spendFaith(amount) { faith -= amount; }

function initFoundries() {
  const scene = getScene();
  resetFoundries();
  altars.length = 0;

  for (let i = 0; i < ALTAR_POSITIONS.length; i++) {
    const def = ALTAR_POSITIONS[i];

    // --- Glow ring (attention-grabbing pulse when unlit) ---
    const glowGeo = new THREE.RingGeometry(
      Math.max(ALTAR_HW, ALTAR_HH) * 1.3,
      Math.max(ALTAR_HW, ALTAR_HH) * 1.6,
      32
    );
    const glowMat = new THREE.MeshBasicMaterial({
      color: def.colour, transparent: true, opacity: 0.0, side: THREE.DoubleSide
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    glowMesh.position.set(def.x, def.y, -0.2);
    scene.add(glowMesh);

    // --- Altar body mesh ---
    const geo = new THREE.PlaneGeometry(ALTAR_HW * 2, ALTAR_HH * 2);
    const mat = new THREE.MeshBasicMaterial({
      color: def.colour, transparent: true, opacity: 0.25
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(def.x, def.y, -0.1);
    scene.add(mesh);

    // --- Label ---
    const lCanvas = document.createElement('canvas');
    lCanvas.width = 64; lCanvas.height = 20;
    const lCtx = lCanvas.getContext('2d');
    lCtx.fillStyle = '#ffffff';
    lCtx.font = 'bold 10px monospace';
    lCtx.textAlign = 'center';
    lCtx.fillText(def.type.toUpperCase(), 32, 14);
    const lTex = new THREE.CanvasTexture(lCanvas);
    lTex.minFilter = THREE.LinearFilter;
    const lGeo = new THREE.PlaneGeometry(6, 2);
    const lMat = new THREE.MeshBasicMaterial({ map: lTex, transparent: true, depthWrite: false });
    const labelMesh = new THREE.Mesh(lGeo, lMat);
    labelMesh.position.set(def.x, def.y + ALTAR_HH + 1.5, 0.2);
    scene.add(labelMesh);

    // --- Overheat arc (RingGeometry with partial theta) ---
    const arcRadius = Math.max(ALTAR_HW, ALTAR_HH) * 1.1;
    const arcGeo = new THREE.RingGeometry(arcRadius - 0.3, arcRadius, 32, 1, 0, 0.01);
    const arcMat = new THREE.MeshBasicMaterial({
      color: 0x44cc44, transparent: true, opacity: 0.9, side: THREE.DoubleSide
    });
    const arcMesh = new THREE.Mesh(arcGeo, arcMat);
    arcMesh.position.set(def.x, def.y, 0.3);
    arcMesh.visible = false;
    scene.add(arcMesh);

    altars.push({
      type: def.type, colour: def.colour,
      x: def.x, y: def.y,
      mesh, glowMesh, arcMesh, arcRadius,
      lit: false, everLit: false,
      litTime: 0, overheated: false, cooldown: 0
    });
  }
}

function updateFoundries(dt) {
  const segments = getSegments();
  const time = performance.now() * 0.001; // seconds for animation

  for (const altar of altars) {
    // Check if any beam segment hits this altar (segment-vs-AABB)
    // Pre-split beam (raw sun column) does not power altars
    altar.lit = false;
    for (let s = 0; s < segments.length; s++) {
      if (segments[s].preSplit) continue;
      if (segHitsBox(segments[s], altar.x, altar.y, ALTAR_HW, ALTAR_HH)) {
        altar.lit = true;
        break;
      }
    }
    if (altar.lit) altar.everLit = true;

    // Overheat logic
    if (altar.lit) {
      altar.litTime += dt;
      altar.cooldown = 0;
    } else {
      altar.litTime = 0;
      if (altar.overheated) {
        altar.cooldown += dt;
        if (altar.cooldown >= ALTAR_RECOVER_TIME) {
          altar.overheated = false;
          altar.cooldown = 0;
        }
      }
    }
    if (altar.litTime >= ALTAR_OVERHEAT_TIME && !altar.overheated) {
      altar.overheated = true;
    }

    // Compute efficiency
    let efficiency = 1.0;
    if (altar.overheated) efficiency = 0.5;

    // Resource accumulation
    const rates = ALTAR_RATES[altar.type];
    const passiveRate = rates.passive;
    const litRate = altar.lit ? rates.lit : 0;
    const totalRate = (passiveRate + litRate) * efficiency;
    resources[altar.type] += totalRate * dt;

    // --- VISUAL FEEDBACK ---

    // 1. Body mesh opacity
    if (altar.lit) {
      altar.mesh.material.opacity = altar.overheated ? 0.55 : 0.8;
    } else {
      // Unlit: gentle pulse if never lit (attract attention)
      if (!altar.everLit) {
        const pulse = 0.2 + 0.15 * Math.sin(time * 2.5 + altar.x * 0.5);
        altar.mesh.material.opacity = pulse;
      } else {
        altar.mesh.material.opacity = 0.25;
      }
    }

    // 2. Glow ring
    if (altar.lit) {
      // Steady bright glow matching metal colour
      altar.glowMesh.material.opacity = altar.overheated ? 0.2 : 0.5;
    } else if (!altar.everLit) {
      // Attention pulse — gentle breathing glow
      const gPulse = 0.1 + 0.2 * Math.abs(Math.sin(time * 1.8 + altar.x * 0.3));
      altar.glowMesh.material.opacity = gPulse;
    } else {
      altar.glowMesh.material.opacity = 0.0;
    }

    // 3. Overheat arc
    const heatFrac = Math.min(1, altar.litTime / ALTAR_OVERHEAT_TIME);
    const coolFrac = altar.overheated ? (1 - altar.cooldown / ALTAR_RECOVER_TIME) : 0;
    const arcFrac = altar.lit ? heatFrac : coolFrac;

    if (arcFrac > 0.01) {
      altar.arcMesh.visible = true;
      // Rebuild arc geometry with new theta length
      const theta = arcFrac * Math.PI * 2;
      altar.arcMesh.geometry.dispose();
      altar.arcMesh.geometry = new THREE.RingGeometry(
        altar.arcRadius - 0.3, altar.arcRadius, 32, 1,
        Math.PI * 0.5, // start at top
        theta
      );
      // Color: green → yellow → red
      if (arcFrac < 0.5) altar.arcMesh.material.color.setHex(0x44cc44);
      else if (arcFrac < 0.8) altar.arcMesh.material.color.setHex(0xcccc44);
      else altar.arcMesh.material.color.setHex(0xcc4444);
      if (altar.overheated) altar.arcMesh.material.color.setHex(0xcc4444);
    } else {
      altar.arcMesh.visible = false;
    }
  }

  // Priests generate faith
  faith += priestCount * dt;
}

// Segment-vs-AABB intersection test
function segHitsBox(seg, cx, cy, hw, hh) {
  const sx = seg.start.x, sy = seg.start.y;
  const ex = seg.end.x, ey = seg.end.y;
  const dx = ex - sx, dy = ey - sy;
  const xmin = cx - hw, xmax = cx + hw;
  const ymin = cy - hh, ymax = cy + hh;
  let tmin = 0, tmax = 1;
  if (Math.abs(dx) < 1e-8) {
    if (sx < xmin || sx > xmax) return false;
  } else {
    let t1 = (xmin - sx) / dx, t2 = (xmax - sx) / dx;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }
  if (Math.abs(dy) < 1e-8) {
    if (sy < ymin || sy > ymax) return false;
  } else {
    let t1 = (ymin - sy) / dy, t2 = (ymax - sy) / dy;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }
  return true;
}

// Legacy compatibility
function getSlag() { return resources.brass; }
function getInsight() { return resources.bronze; }
function getRecombination() { return 0; }
function getInsightLog() { return []; }
function spendSlag() {}
function spendInsight() {}
function addSlagDirect(amount) { resources.brass += amount; }
function getFoundryColliders() { return []; }
function getAltarAudioState() {
  let litCount = 0;
  let anyOverheated = false;
  for (const a of altars) {
    if (a.lit) litCount++;
    if (a.overheated) anyOverheated = true;
  }
  return { litCount, anyOverheated };
}

// ============================================================
// src/crafting.js — Shop UI: mirrors, prisms, priests, god abilities
// Rendered as in-scene canvas texture at bottom of playfield.
// ============================================================









let trayMesh = null;
let trayCanvas = null;
let trayCtx = null;
let trayTexture = null;
let trayY = 0;
let trayWidth = 0;
const trayHeight = 5;
let mirrorsBought = 0;
let focusCount = 0;
const prevAffordable = [];  // track per-button affordability for pulse
const pulseTimes = [];      // countdown for 300ms pulse animation

// Shop items displayed in the tray
const SHOP_ITEMS = [
  { id: 'mirror', label: 'Mirror', getCost: () => ({ brass: SHOP.mirror.brass + mirrorsBought * SHOP.mirror.scaling }) },
  { id: 'prism4', label: '4-Prism', getCost: () => SHOP.prism4 },
  { id: 'prism5', label: '5-Prism', getCost: () => SHOP.prism5 },
  { id: 'prism6', label: '6-Prism', getCost: () => SHOP.prism6 },
  { id: 'priest', label: 'Priest', getCost: () => SHOP.priest },
  { id: 'zeus',   label: 'Zeus', getCost: () => ({ faith: GOD_ABILITIES.zeus.faith, gold: GOD_ABILITIES.zeus.gold }) },
];

function getFocusMultiplier() { return 1 + focusCount * 0.15; }

function initCrafting() {
  const oScene = getOverlayScene();
  const worldWidth = getWorldWidth();
  mirrorsBought = 0;
  activeTier = 3;
  focusCount = 0;

  trayWidth = worldWidth * 0.95;
  trayY = -WORLD_HEIGHT / 2 + 3;

  trayCanvas = document.createElement('canvas');
  trayCanvas.width = 512;
  trayCanvas.height = 40;
  trayCtx = trayCanvas.getContext('2d');

  trayTexture = new THREE.CanvasTexture(trayCanvas);
  trayTexture.minFilter = THREE.LinearFilter;

  const geo = new THREE.PlaneGeometry(trayWidth, trayHeight);
  const mat = new THREE.MeshBasicMaterial({ map: trayTexture, transparent: true, depthWrite: false });
  trayMesh = new THREE.Mesh(geo, mat);
  trayMesh.position.set(0, trayY, 0);
  oScene.add(trayMesh);
}

function updateCraftingTray() {
  if (!trayCtx) return;
  const res = getResources();
  const faith = getFaith();

  trayCtx.clearRect(0, 0, 512, 40);
  trayCtx.fillStyle = 'rgba(0,0,0,0.7)';
  trayCtx.fillRect(0, 0, 512, 40);

  const btnW = 512 / SHOP_ITEMS.length;
  for (let i = 0; i < SHOP_ITEMS.length; i++) {
    const item = SHOP_ITEMS[i];
    const cost = item.getCost();
    const affordable = canAffordCombined(cost, res, faith);
    const x = i * btnW;

    // Detect affordability crossing → trigger 300ms pulse
    if (prevAffordable[i] === false && affordable) {
      pulseTimes[i] = 0.3;
    }
    prevAffordable[i] = affordable;
    if (pulseTimes[i] > 0) pulseTimes[i] -= 0.016; // approx 1 frame

    const pulsing = pulseTimes[i] > 0;

    // Zeus button: extra-loud pulsing when ready
    const isZeusBtn = item.id === 'zeus';
    const zeusGlow = isZeusBtn && isZeusReady();
    const zeusPhase = zeusGlow ? (Math.sin(Date.now() * 0.008) * 0.5 + 0.5) : 0;

    let bgColour, borderCol;
    if (zeusGlow) {
      // Zeus ready: bright gold pulsing
      const glow = 0.6 + zeusPhase * 0.4;
      bgColour = `rgba(${Math.floor(180*glow)},${Math.floor(140*glow)},${Math.floor(40*glow)},1)`;
      borderCol = '#FFDD44';
    } else {
      bgColour = affordable ? (pulsing ? 'rgba(130,130,200,1)' : 'rgba(70,70,120,0.9)') : 'rgba(40,40,50,0.6)';
      borderCol = affordable ? (pulsing ? '#ffffff' : '#9999cc') : 'rgba(60,60,80,0.4)';
    }

    trayCtx.fillStyle = bgColour;
    trayCtx.fillRect(x + 1, 1, btnW - 2, 38);
    // Border
    trayCtx.strokeStyle = borderCol;
    trayCtx.lineWidth = zeusGlow ? 3 : (pulsing ? 2.5 : (affordable ? 1.5 : 0.5));
    trayCtx.strokeRect(x + 1, 1, btnW - 2, 38);

    trayCtx.fillStyle = (affordable || zeusGlow) ? '#ffffff' : '#777777';
    trayCtx.font = 'bold 9px monospace';
    trayCtx.textAlign = 'center';
    trayCtx.fillText(item.label, x + btnW / 2, 14);

    trayCtx.font = '7px monospace';
    trayCtx.fillStyle = (affordable || zeusGlow) ? '#cccccc' : '#555555';
    trayCtx.fillText(costStr(cost), x + btnW / 2, 28);
  }
  trayTexture.needsUpdate = true;
}

function handleCraftTap(worldX, worldY) {
  const halfW = trayWidth / 2;
  const halfH = trayHeight / 2;
  if (worldY < trayY - halfH || worldY > trayY + halfH) return false;
  if (worldX < -halfW || worldX > halfW) return false;

  const normX = (worldX + halfW) / trayWidth;
  const btnIndex = Math.floor(normX * SHOP_ITEMS.length);
  if (btnIndex < 0 || btnIndex >= SHOP_ITEMS.length) return false;

  return attemptPurchase(SHOP_ITEMS[btnIndex]);
}

function resetCrafting() {
  mirrorsBought = 0;
  focusCount = 0;
  if (typeof resetTier === 'function') resetTier();
}

function attemptPurchase(item) {
  const res = getResources();
  const faith = getFaith();
  const cost = item.getCost();
  if (!canAffordCombined(cost, res, faith)) return false;

  // Spend resources
  const resCost = {};
  for (const k in cost) {
    if (k === 'faith') { spendFaith(cost[k]); }
    else { resCost[k] = cost[k]; }
  }
  if (Object.keys(resCost).length > 0) spend(resCost);

  switch (item.id) {
    case 'mirror': mirrorsBought++; addMirror(); break;
    case 'prism4': setTier(4); markDirty(); break;
    case 'prism5': setTier(5); markDirty(); break;
    case 'prism6': setTier(6); markDirty(); break;
    case 'priest': addPriest(); break;
    case 'zeus': triggerGodAbility('zeus'); break;
  }
  return true;
}

function triggerGodAbility(god) {
  if (god === 'zeus') {
    triggerZeusStrike();
  }
}

function canAffordCombined(cost, res, faith) {
  for (const k in cost) {
    if (k === 'faith') { if (faith < cost[k]) return false; }
    else { if ((res[k] || 0) < cost[k]) return false; }
  }
  return true;
}

function costStr(cost) {
  const parts = [];
  for (const k in cost) {
    parts.push(cost[k] + k[0].toUpperCase());
  }
  return parts.join(' ');
}

// ============================================================
// src/effects.js — Contact glow, sparks, destruction sequence, audio
// Pooled sprites, no per-frame allocation.
// ============================================================



// --- Contact glow pool (beam hitting enemy) ---
const GLOW_POOL_SIZE = 8;
const glowPool = [];

// --- Spark pool (short-lived particles on damage) ---
const SPARK_POOL_SIZE = 24;
const sparkPool = [];

// --- Debris pool (destruction particles) ---
const DEBRIS_POOL_SIZE = 16;
const debrisPool = [];

// --- WebAudio context (created on first user interaction) ---
let audioCtx = null;

function initEffects() {
  const scene = getScene();
  // Contact glows
  for (let i = 0; i < GLOW_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(3, 3);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.4;
    scene.add(mesh);
    glowPool.push({ mesh, life: 0, colour: 0xffffff, scale: 1 });
  }
  // Sparks
  for (let i = 0; i < SPARK_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(0.6, 0.6);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffcc00, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.5;
    scene.add(mesh);
    sparkPool.push({ mesh, life: 0, vx: 0, vy: 0 });
  }
  // Debris
  for (let i = 0; i < DEBRIS_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(1.2, 1.2);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x886644, transparent: true, opacity: 0, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.3;
    scene.add(mesh);
    debrisPool.push({ mesh, life: 0, vx: 0, vy: 0, gravity: 0 });
  }
}

function updateEffects(dt) {
  // Glows: fade out
  for (const g of glowPool) {
    if (g.life > 0) {
      g.life -= dt;
      g.mesh.material.opacity = Math.max(0, g.life * 2);
      g.mesh.scale.set(g.scale * (1 + (1 - g.life) * 0.5), g.scale * (1 + (1 - g.life) * 0.5), 1);
      if (g.life <= 0) g.mesh.visible = false;
    }
  }
  // Sparks: move + fade
  for (const s of sparkPool) {
    if (s.life > 0) {
      s.life -= dt;
      s.mesh.position.x += s.vx * dt;
      s.mesh.position.y += s.vy * dt;
      s.vy -= 30 * dt; // gravity
      s.mesh.material.opacity = Math.max(0, s.life * 3);
      if (s.life <= 0) s.mesh.visible = false;
    }
  }
  // Debris: move + gravity + fade
  for (const d of debrisPool) {
    if (d.life > 0) {
      d.life -= dt;
      d.mesh.position.x += d.vx * dt;
      d.mesh.position.y += d.vy * dt;
      d.vy -= d.gravity * dt;
      d.mesh.material.opacity = Math.max(0, d.life / 1.5);
      d.mesh.rotation.z += 3 * dt;
      if (d.life <= 0) d.mesh.visible = false;
    }
  }
}

// Spawn a contact glow at position, scaled by DPS
function spawnContactGlow(x, y, colour, dps) {
  for (const g of glowPool) {
    if (g.life <= 0) {
      g.mesh.position.x = x;
      g.mesh.position.y = y;
      g.mesh.material.color.setHex(colour);
      g.mesh.material.opacity = 0.6;
      g.mesh.visible = true;
      g.life = 0.15;
      g.scale = 0.5 + Math.min(dps / 50, 2);
      g.colour = colour;
      return;
    }
  }
}

// Spawn sparks at position
function spawnSparks(x, y, colour, count) {
  for (let n = 0; n < count; n++) {
    for (const s of sparkPool) {
      if (s.life <= 0) {
        s.mesh.position.x = x;
        s.mesh.position.y = y;
        s.mesh.material.color.setHex(colour);
        s.mesh.material.opacity = 1;
        s.mesh.visible = true;
        s.life = 0.2 + Math.random() * 0.2;
        s.vx = (Math.random() - 0.5) * 30;
        s.vy = Math.random() * 20;
        break;
      }
    }
  }
}

// Destruction sequence: flash + debris + audio
function spawnDestruction(x, y) {
  // Flash (large bright glow)
  spawnContactGlow(x, y, 0xffffff, 100);
  // Debris particles
  for (let i = 0; i < 8; i++) {
    for (const d of debrisPool) {
      if (d.life <= 0) {
        d.mesh.position.x = x;
        d.mesh.position.y = y;
        d.mesh.material.opacity = 1;
        d.mesh.visible = true;
        d.life = 0.8 + Math.random() * 0.7; // 0.8-1.5s
        d.vx = (Math.random() - 0.5) * 25;
        d.vy = Math.random() * 15 + 5;
        d.gravity = 20 + Math.random() * 10;
        d.mesh.rotation.z = Math.random() * 6.28;
        break;
      }
    }
  }
  // Audio: wood crack + thump
  playDestructionSound();
}

// --- WebAudio synthesis ---
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return audioCtx;
}

function playDestructionSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  // Wood crack: short noise burst
  const noiseLen = 0.08;
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * noiseLen, ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, now + noiseLen);
  noise.connect(noiseGain).connect(ctx.destination);
  noise.start(now);
  // Low thump: sine at 60Hz
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(60, now);
  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.4, now);
  oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(oscGain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

function resetEffects() {
  for (const g of glowPool) { g.life = 0; g.mesh.visible = false; }
  for (const s of sparkPool) { s.life = 0; s.mesh.visible = false; }
  for (const d of debrisPool) { d.life = 0; d.mesh.visible = false; }
}


// === src/audio.js ===
// ============================================================
// src/audio.js — WebAudio synthesis, no audio files
//
// Beam hum, prism chime, burn hiss, destruction, wall damage,
// altar tone. Pooled oscillators, master gain, mute toggle.
// ============================================================

let ctx = null;
let masterGain = null;
let muted = false;
let muteBtn = null;

// Pools
let hum = null;
let humGain = null;
let burnNoise = null;
let burnGain = null;
let altarOsc = null;
let altarGain = null;

const MAX_VOICES = 6;
let activeVoices = 0;

function initAudio() {
  // Create mute button (DOM, top-right corner)
  muteBtn = document.createElement('div');
  muteBtn.textContent = '🔊';
  muteBtn.style.cssText = 'position:fixed;top:8px;right:8px;font-size:20px;cursor:pointer;z-index:99999;user-select:none;';
  muteBtn.addEventListener('pointerdown', toggleMute);
  document.body.appendChild(muteBtn);
}

function ensureCtx() {
  if (ctx) return ctx;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(ctx.destination);
    setupHum();
    setupBurnNoise();
    setupAltarTone();
  } catch (e) { return null; }
  return ctx;
}

function toggleMute(e) {
  if (e) e.preventDefault();
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
  if (muteBtn) muteBtn.textContent = muted ? '🔇' : '🔊';
}

// --- Beam hum: continuous drone, pitch/volume scales with throughput ---
function setupHum() {
  hum = ctx.createOscillator();
  hum.type = 'sawtooth';
  hum.frequency.value = 55;
  humGain = ctx.createGain();
  humGain.gain.value = 0;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 200;
  hum.connect(filter).connect(humGain).connect(masterGain);
  hum.start();
}

function updateHum(throughput) {
  if (!humGain) return;
  // throughput: 0 to ~50 (total DPS across all beams hitting targets)
  const vol = Math.min(0.15, throughput * 0.003);
  const pitch = 55 + throughput * 0.5;
  humGain.gain.value = vol;
  if (hum) hum.frequency.value = pitch;
}

// --- Burn hiss: filtered noise while beam contacts hull ---
function setupBurnNoise() {
  const bufSize = ctx.sampleRate * 0.5;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  burnNoise = ctx.createBufferSource();
  burnNoise.buffer = buf;
  burnNoise.loop = true;
  burnGain = ctx.createGain();
  burnGain.gain.value = 0;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 3000;
  burnNoise.connect(filter).connect(burnGain).connect(masterGain);
  burnNoise.start();
}

function updateBurnHiss(intensity) {
  if (!burnGain) return;
  // intensity: 0 to 1 (fraction of enemies being burned)
  burnGain.gain.value = Math.min(0.08, intensity * 0.1);
}

// --- Prism chime: short bell ---
function playPrismChime() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 880;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.2, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
  osc.connect(g).connect(masterGain);
  osc.start();
  osc.stop(ctx.currentTime + 0.4);
  osc.onended = () => activeVoices--;
}

// --- Destruction: thump + noise burst ---
function playDestruction() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;
  // Duck hum briefly
  if (humGain) { humGain.gain.value *= 0.3; setTimeout(() => { if(humGain) humGain.gain.value /= 0.3; }, 200); }
  // Thump
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.15);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.3, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
  osc.connect(g).connect(masterGain);
  osc.start(); osc.stop(ctx.currentTime + 0.25);
  // Noise burst
  const bufLen = ctx.sampleRate * 0.08;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = (Math.random()*2-1) * (1 - i/bufLen);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.2, ctx.currentTime);
  ng.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
  src.connect(ng).connect(masterGain);
  src.start(); src.onended = () => activeVoices--;
  osc.onended = () => {};
}

// --- Wall damage: dull impact ---
function playWallHit() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(120, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.25, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
  osc.connect(g).connect(masterGain);
  osc.start(); osc.stop(ctx.currentTime + 0.4);
  osc.onended = () => activeVoices--;
}

// --- Altar tone: soft rising note while lit ---
function setupAltarTone() {
  altarOsc = ctx.createOscillator();
  altarOsc.type = 'sine';
  altarOsc.frequency.value = 220;
  altarGain = ctx.createGain();
  altarGain.gain.value = 0;
  altarOsc.connect(altarGain).connect(masterGain);
  altarOsc.start();
}

function updateAltarTone(litCount, anyOverheated) {
  if (!altarGain) return;
  altarGain.gain.value = litCount > 0 ? Math.min(0.06, litCount * 0.02) : 0;
  if (altarOsc) altarOsc.frequency.value = anyOverheated ? 150 : 220 + litCount * 30;
}

function resetAudio() {
  if (humGain) humGain.gain.value = 0;
  if (burnGain) burnGain.gain.value = 0;
  if (altarGain) altarGain.gain.value = 0;
  // Stop all crackle voices
  for (const cv of crackleVoices) { stopCrackleVoice(cv); }
  crackleVoices.length = 0;
}

// ============================================================
// WOOD CRACKLE — per-ship looping: flame hiss + random pops
// Max 4 simultaneous voices (highest heat ships).
// ============================================================
const MAX_CRACKLE_VOICES = 4;
const crackleVoices = []; // { enemyId, hissGain, hissSrc, popInterval, nextPop, filterNode, gain }

// Called each frame from damage.js or main — pass array of {id, heat} for all burning ships
function updateCrackle(burningShips) {
  if (!ensureCtx()) return;

  // Sort by heat descending, take top MAX_CRACKLE_VOICES
  burningShips.sort((a, b) => b.heat - a.heat);
  const topShips = burningShips.slice(0, MAX_CRACKLE_VOICES);
  const topIds = topShips.map(s => s.id);

  // Remove voices for ships no longer in top burning
  for (let i = crackleVoices.length - 1; i >= 0; i--) {
    if (!topIds.includes(crackleVoices[i].enemyId)) {
      stopCrackleVoice(crackleVoices[i]);
      crackleVoices.splice(i, 1);
    }
  }

  // Add/update voices for top burning ships
  for (const ship of topShips) {
    let voice = crackleVoices.find(v => v.enemyId === ship.id);
    if (!voice) {
      voice = startCrackleVoice(ship.id);
      if (voice) crackleVoices.push(voice);
    }
    if (voice) {
      // Scale volume and pop rate by heat (0 to 1)
      const heat = Math.min(1, ship.heat);
      voice.gain.gain.value = 0.03 + heat * 0.07; // hiss volume
      voice.popRate = 2 + heat * 4; // 2 to 6 pops/sec
    }
  }

  // Fire pops on schedule
  const now = ctx.currentTime;
  for (const voice of crackleVoices) {
    if (now >= voice.nextPop) {
      fireCracklePop(voice);
      voice.nextPop = now + (1 / voice.popRate) * (0.5 + Math.random());
    }
  }
}

function startCrackleVoice(enemyId) {
  if (!ctx) return null;
  // Hiss: looping noise through a highpass
  const bufLen = ctx.sampleRate * 0.3;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2500;
  const gain = ctx.createGain();
  gain.gain.value = 0.03;
  src.connect(filter).connect(gain).connect(masterGain);
  src.start();
  return {
    enemyId,
    hissSrc: src,
    gain,
    filterNode: filter,
    popRate: 3,
    nextPop: ctx.currentTime + Math.random() * 0.3,
  };
}

function fireCracklePop(voice) {
  if (!ctx || activeVoices >= MAX_VOICES) return;
  // Short noise burst 15-40ms through bandpass 800-2000Hz
  const duration = 0.015 + Math.random() * 0.025;
  const bufLen = Math.ceil(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen); // decay envelope baked in
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 800 + Math.random() * 1200; // 800-2000 Hz
  bp.Q.value = 2 + Math.random() * 3;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.08 + Math.random() * 0.12, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  src.connect(bp).connect(g).connect(masterGain);
  src.start();
  src.stop(ctx.currentTime + duration + 0.01);
}

function stopCrackleVoice(voice) {
  try { voice.hissSrc.stop(); } catch (_) {}
  try { voice.gain.disconnect(); } catch (_) {}
}

// ============================================================
// SINKING GLUG — descending sine + filtered noise swell
// Plays after destruction (call with slight delay).
// ============================================================
function playSinkGlug() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;

  const now = ctx.currentTime;
  const duration = 0.45;

  // Descending sine: 400Hz → 80Hz over 400ms
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);

  // Lowpass filter closing with the pitch
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2000, now);
  lp.frequency.exponentialRampToValueAtTime(100, now + 0.4);

  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.2, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(lp).connect(oscGain).connect(masterGain);
  osc.start(now);
  osc.stop(now + duration);

  // Water noise swell underneath
  const noiseDur = 0.3;
  const nBufLen = Math.ceil(ctx.sampleRate * noiseDur);
  const nBuf = ctx.createBuffer(1, nBufLen, ctx.sampleRate);
  const nData = nBuf.getChannelData(0);
  for (let i = 0; i < nBufLen; i++) nData[i] = Math.random() * 2 - 1;
  const nSrc = ctx.createBufferSource();
  nSrc.buffer = nBuf;
  const nLp = ctx.createBiquadFilter();
  nLp.type = 'lowpass';
  nLp.frequency.setValueAtTime(600, now);
  nLp.frequency.linearRampToValueAtTime(200, now + noiseDur);
  const nGain = ctx.createGain();
  nGain.gain.setValueAtTime(0, now);
  nGain.gain.linearRampToValueAtTime(0.12, now + 0.05); // quick swell
  nGain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);
  nSrc.connect(nLp).connect(nGain).connect(masterGain);
  nSrc.start(now);
  nSrc.stop(now + noiseDur + 0.01);

  osc.onended = () => activeVoices--;
}


// === src/damage.js ===
// ============================================================
// src/damage.js — DPS formula, armour, kill handling
//
// Per frame: for each active enemy, count beam segments that
// intersect its hitbox. Apply the DPS formula from the GDD:
//
//   DPS = N * D_BASE * (1 + SYNERGY_BONUS * (N - 1))
//   final = max(0, DPS - armour * N)
//   enemy.hp -= final * dt
//
// Gold band also applies slow via enemy.js.
// On kill: deactivate enemy, award Slag.
// ============================================================











const ENEMY_HIT_HALF_W = 3;
const ENEMY_HIT_HALF_H = 3;
let totalKills = 0;

function getKillCount() { return totalKills; }
function resetDamage() { totalKills = 0; }

function updateDamage(dt) {
  const segments = getSegments();
  const pool = getEnemyPool();
  const worldWidth = getWorldWidth();
  const laneWidth = worldWidth / ENEMY_LANE_COUNT;

  for (let i = 0; i < pool.length; i++) {
    const enemy = pool[i];
    if (!enemy.active) continue;
    enemy.shieldBlocking = false;

    // Enemy world position
    const ex = -worldWidth / 2 + laneWidth * (enemy.lane + 0.5);
    const ey = enemy.y;

    // Count full bands (intensity=1) and sub-rays (intensity<1) hitting this enemy
    let fullBands = 0;
    let subRays = 0;
    let subRayIntensity = 0;
    let goldHitting = false;
    let hitColour = 0;
    let totalBeamsHitting = 0;

    for (let s = 0; s < segments.length; s++) {
      const seg = segments[s];
      // Pre-split beam (raw sun column) does no damage
      if (seg.preSplit) continue;
      if (segmentIntersectsBox(seg, ex, ey, ENEMY_HIT_HALF_W, ENEMY_HIT_HALF_H)) {
        // Shield-bearer check: block beams within shieldAngle degrees of vertical
        if (enemy.shieldAngle > 0) {
          const dx = seg.end.x - seg.start.x;
          const dy = seg.end.y - seg.start.y;
          const len = Math.sqrt(dx * dx + dy * dy);
          if (len > 0.01) {
            // Angle from vertical: atan2(|horizontal|, |vertical|)
            const angleFromVert = Math.atan2(Math.abs(dx / len), Math.abs(dy / len)) * (180 / Math.PI);
            if (angleFromVert <= enemy.shieldAngle) {
              // Blocked — spawn deflection spark
              if (Math.random() < dt * 8) {
                spawnContactGlow(ex, ey + ENEMY_HIT_HALF_H, 0xccaa44, 5);
                spawnSparks(ex, ey + ENEMY_HIT_HALF_H, 0xffcc66, 1);
              }
              enemy.shieldBlocking = true;
              continue; // this segment does no damage
            }
          }
        }
        totalBeamsHitting++;
        hitColour = seg.colour;
        if (seg.colour === COLOUR_GOLD) goldHitting = true;
        if (seg.intensity >= 1.0) {
          fullBands++;
        } else {
          subRays++;
          subRayIntensity = seg.intensity;
        }
      }
    }

    // Update visual state for burn feedback
    enemy.bandsHitting = totalBeamsHitting;
    if (hitColour) enemy.lastHitColour = hitColour;

    // Apply gold slow
    if (goldHitting) {
      applyGoldSlow(enemy);
    }

    // Apply damage
    if (totalBeamsHitting > 0) {
      // -------------------------------------------------------
      // Damage formula (tier-aware, sub-rays excluded from synergy):
      //   tier = active prism tier → dBase, synergy from PRISM_TIERS
      //   synergyDPS = fullBands * dBase * (1 + synergy * (fullBands-1))
      //   flatDPS = subRays * dBase * subRayIntensity
      //   totalRaw = (synergyDPS + flatDPS) * focusMult * resonanceMult
      //   final = max(0, totalRaw - armour * totalBeams)
      // -------------------------------------------------------
      const tier = getActiveTier();
      const tierData = PRISM_TIERS[tier] || PRISM_TIERS[3];
      const dBase = tierData.dBase;
      const synBonus = tierData.synergy;
      const focusMult = getFocusMultiplier();
      const resMult = getResonanceActive() ? RESONANCE_MULTIPLIER : 1.0;
      const synergyDPS = fullBands > 0 ? fullBands * dBase * (1 + synBonus * (fullBands - 1)) : 0;
      const flatDPS = subRays * dBase * (subRayIntensity || 0.5);
      const raw = (synergyDPS + flatDPS) * focusMult * resMult;
      const dmg = Math.max(0, raw - enemy.armour * totalBeamsHitting);
      // Heat accumulator: damage adds heat, enemy dies when heat >= effectiveHP
      enemy.heat += dmg * dt;
      enemy.burn = enemy.heat / enemy.maxHp;

      // Contact glow + sparks (throttled: every ~0.1s)
      if (Math.random() < dt * 10) {
        const ex = -worldWidth / 2 + laneWidth * (enemy.lane + 0.5);
        spawnContactGlow(ex, enemy.y, hitColour || 0xffaa00, raw);
        spawnSparks(ex, enemy.y, hitColour || 0xffaa00, 2);
      }

      if (enemy.heat >= enemy.maxHp) {
        const rewards = { mote: 5, husk: 10, carapace: 20, devourer: 0 };
        const reward = rewards[enemy.type] || 0;
        addSlagDirect(reward);
        totalKills++;
        const ex = -worldWidth / 2 + laneWidth * (enemy.lane + 0.5);
        spawnDestruction(ex, enemy.y);
        // Sinking glug plays after the explosion (200ms delay)
        setTimeout(playSinkGlug, 200);
        triggerKillEffect(enemy, reward);
        deactivateEnemy(enemy);
      }
    } else {
      enemy.bandsHitting = 0;
      // Heat decay: accumulated heat cools when beam is not on target
      if (enemy.heat > 0) {
        enemy.heat = Math.max(0, enemy.heat - enemy.maxHp * HEAT_DECAY_RATE * dt);
        enemy.burn = enemy.heat / enemy.maxHp;
      }
    }
  }
}

// Test if a line segment (beam) intersects an axis-aligned box (enemy hitbox)
function segmentIntersectsBox(seg, cx, cy, hw, hh) {
  // Use parametric line-vs-AABB test
  const sx = seg.start.x;
  const sy = seg.start.y;
  const ex = seg.end.x;
  const ey = seg.end.y;
  const dx = ex - sx;
  const dy = ey - sy;

  // Box bounds
  const xmin = cx - hw;
  const xmax = cx + hw;
  const ymin = cy - hh;
  const ymax = cy + hh;

  let tmin = 0;
  let tmax = 1;

  // X slab
  if (Math.abs(dx) < 1e-8) {
    if (sx < xmin || sx > xmax) return false;
  } else {
    let t1 = (xmin - sx) / dx;
    let t2 = (xmax - sx) / dx;

    if (recombo >= 100 || devourerKilled) {

  if (DEV.INVINCIBLE) return;

  const res = getResources();

  hudCtx.clearRect(0, 0, 512, 64);
  // Timer (top-left)

  hudCtx.fillStyle = wallIntegrity > 30 ? '#ffffff' : '#ff4444';
  hudCtx.font = '18px monospace';
  hudCtx.fillText('Wall:' + Math.ceil(wallIntegrity) + '%', 504, 20);

  hudCtx.font = '13px monospace';
  hudCtx.textAlign = 'left';
  hudCtx.fillStyle = '#ccaa44';

  resetSpawner();
  resetDamage();
  resetFoundries();

  resetMirrors();

  if (typeof window !== 'undefined' && window.playWinCinematic) {
    window.playWinCinematic(function() { showOverlay(MSG_WIN); });

function showOverlay(text) {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  overlayCtx.fillStyle = gameWon ? '#00ff88' : '#ff4444';
  overlayCtx.font = 'bold 22px monospace';

    `  ${i}: ${colourName(s.colour)} (${s.start.x.toFixed(0)},${s.start.y.toFixed(0)})->(${s.end.x.toFixed(0)},${s.end.y.toFixed(0)})`
  ).join('\n');
  debugEl.textContent =
    `ptr: ${lastPointerEvent}\n` +
    `world: (${lastWorldCoord.x.toFixed(1)}, ${lastWorldCoord.y.toFixed(1)})\n` +
    `state: ${['IDLE','SEL','DRAG','ROTATE'][state]}\n` +
    `hit: ${lastHitCount} objects\n` +
    `selected: ${selectedType || 'none'}\n` +
    `segments: ${totalSegs} | bands: ${bandCount}\n` +
    `max bounces: ${diag.maxBouncesUsed} | cap hit: ${diag.hitBounceCap}\n` +
    `mote spd: ${ENEMY_TYPES.mote.speed.toFixed(1)} | travel: ${MOTE_TRAVEL_TIME_S}s (${ENEMY_TRAVEL_DIST.toFixed(0)}u)\n` +
    `spawns: ${getSpawnCount()} | kills: ${getKillCount()} | t: ${getElapsed().toFixed(0)}s\n` +
    segList;
  const _t = Math.max(getElapsed(), 1), _m = _t / 60;
  debugEl.textContent += `\nrate: ${(getSpawnCount()/_m).toFixed(1)}sp/m ${(getKillCount()/_m).toFixed(1)}k/m ${(getBreaches()/_m).toFixed(1)}br/m intv:${getCurrentInterval().toFixed(1)}s`;
  const iLog = getInsightLog();
  if (iLog.length > 0) debugEl.textContent += '\n--- Insight ---\n' + iLog.slice(-5).map(e => `${e.t} ${e.delta} =${e.total} [${e.reason}]`).join('\n');
}
// Called from main loop each frame so overlay stays current when visible
function tickDebug(dt) {
  updateRotationSmoothing(dt);
  updateDebug();
}

// --- Distance-aware rotation helpers ---

// Get the length of the reflected beam leaving this mirror (longest segment originating from it)
function getReflectedBeamLength(mirror) {
  const segments = getSegments();
  const mx = FREE_PLACEMENT ? mirror.freeX : SOCKET_POSITIONS[mirror.socketIndex][0];
  const my = FREE_PLACEMENT ? mirror.freeY : SOCKET_POSITIONS[mirror.socketIndex][1];
  const SNAP_DIST = 5; // how close a segment start must be to count as "from this mirror"
  let maxLen = 0;
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    const sdx = seg.start.x - mx;
    const sdy = seg.start.y - my;
    if (sdx * sdx + sdy * sdy < SNAP_DIST * SNAP_DIST) {
      const edx = seg.end.x - seg.start.x;
      const edy = seg.end.y - seg.start.y;
      const len = Math.sqrt(edx * edx + edy * edy);
      if (len > maxLen) maxLen = len;
    }
  }
  return maxLen > 0 ? maxLen : 50; // fallback: mid-range if no segment found
}

// Lerp mirror angle toward targetAngle each frame, clamped by max angular speed
function updateRotationSmoothing(dt) {
  if (!dt || dt <= 0) dt = 1 / 60;

  // Primary pointer smoothing
  if (state === STATE_ROTATE && selectedObject && selectedType === 'mirror') {
    let diff = targetAngle - selectedObject.angle;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    const lerpFactor = 1 - Math.pow(1 - ROT_LERP_RATE, dt * 60);
    let step = diff * lerpFactor;
    const maxStep = ROT_MAX_SPEED * dt;
    if (Math.abs(step) > maxStep) step = Math.sign(step) * maxStep;
    if (Math.abs(diff) > 0.001) {
      rotateMirror(selectedObject, selectedObject.angle + step);
    }
  }

  // Secondary pointer smoothing
  if (secondPointer.active && secondPointer.mirror) {
    const mirror = secondPointer.mirror;
    let diff = secondPointer.targetAngle - mirror.angle;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    const lerpFactor = 1 - Math.pow(1 - ROT_LERP_RATE, dt * 60);
    let step = diff * lerpFactor;
    const maxStep = ROT_MAX_SPEED * dt;
    if (Math.abs(step) > maxStep) step = Math.sign(step) * maxStep;
    if (Math.abs(diff) > 0.001) {
      rotateMirror(mirror, mirror.angle + step);
    }
  }
}

// --- Source state ---
let sourceX = 0;
let sourceY = SUN_Y;

// --- Clock ---
let lastTime = 0;
const MAX_DT = 1 / 30;

function init() {
  console.log('[Solar Siege] init starting');
  initRenderer();
  initBackground();
  initFortress();
  initZeus();
  initSockets();
  initMirrors();
  updateAllMirrorGeometries();
  initPrisms();
  initBeamRenderer();
  initEnemies();
  initFoundries();
  initCrafting();
  initEffects();
  initAudio();
  initSession();
  resetSpawner();

  const canvas = getRenderer().domElement;
  initInput(canvas);

  markDirty();

  lastTime = performance.now();
  requestAnimationFrame(loop);
  console.log('[Solar Siege] init complete, loop running');

  // DEV marker: visible red label if any dev flag is on
  if (Object.values(DEV).some(v => v)) {
    const devLabel = document.createElement('div');
    devLabel.textContent = 'DEV';
    devLabel.style.cssText = 'position:fixed;top:4px;left:50%;transform:translateX(-50%);color:#ff0000;font:bold 14px monospace;z-index:99999;pointer-events:none;background:rgba(0,0,0,0.7);padding:2px 8px;border-radius:3px;';
    document.body.appendChild(devLabel);
  }
}

function loop(now) {
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > MAX_DT) dt = MAX_DT;

  if (isGameOver()) {
    updateHud(); // keep HUD visible on end screen
    render();
    return;
  }

  // --- Update ---
  updateSession(dt);
  const sessionTime = getElapsed();

  updateBackground(dt);
  updateBeamPulse(dt);
  updateMirrorTweens(dt);

  // Beam solve (only on dirty)
  if (isDirty()) {
    const mirrors = getMirrors().filter(m => !m.shattered);
    const prisms = getPrisms();
    const worldWidth = getWorldWidth();
    const fndColliders = getFoundryColliders();
    solve(sourceX, sourceY, mirrors, prisms, worldWidth, fndColliders);
    rebuildBeams(getSegments());
  } else {
    rebuildBeams(getSegments());
  }
  updatePrismGlow(getSegments());

  // Spawner + enemies
  updateSpawner(dt, sessionTime);
  applySlowStates();
  const newBreaches = updateEnemies(dt);
  if (newBreaches > 0) {
    addBreaches(newBreaches);
    triggerBreachShake(newBreaches);
    playWallHit();
  }

  // Damage
  updateDamage(dt);

  // Effects (glows, sparks, debris)
  updateEffects(dt);
  decayWallFlash(dt);

  // Fortress visual update (damage stages, shake, dust)
  updateFortress(dt);

  // Audio updates
  const activeEnemyCount = getEnemyPool().filter(e => e.active && e.bandsHitting > 0).length;
  updateBurnHiss(activeEnemyCount / 10);
  updateHum(getSegments().length * 3);

  // Wood crackle: pass burning ships with heat > 0
  const burningShips = getEnemyPool()
    .filter(e => e.active && e.heat > 0)
    .map(e => ({ id: e.mesh.id, heat: e.heat / e.maxHp }));
  updateCrackle(burningShips);

  // Foundries (resource accumulation)
  updateFoundries(dt);

  // Altar audio (tone + overheat pitch drop)
  const altarAudio = getAltarAudioState();
  updateAltarTone(altarAudio.litCount, altarAudio.anyOverheated);

  // Zeus ultimate (ready state + strike animation)
  updateZeus(dt, getFaith(), GOD_ABILITIES.zeus.faith);

  // HUD + crafting tray
  updateHud();
  updateCraftingTray();
  tickDebug(dt);

  // --- Render ---
  render();
}
