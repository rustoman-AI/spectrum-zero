<div id="intro-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;">
  <video id="intro-video" src="./assets/fixed_intro.mp4?v=4" poster="./assets/intro_poster.jpg?v=4"
         playsinline webkit-playsinline preload="auto"
         style="max-width:100%;max-height:100%;object-fit:contain;"></video>
  <div id="intro-tap" style="position:absolute;bottom:15%;color:#fff;font:bold 16px monospace;opacity:0.8;pointer-events:none;">Tap to begin</div>
</div>
<div id="defeat-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:99998;background:#000;display:none;align-items:center;justify-content:center;">

<script>
// THREE is available as a global from the vendor script above

// --- Intro video layer ---
(function() {
  var layer = document.getElementById('intro-layer');
  var video = document.getElementById('intro-video');
  var tapMsg = document.getElementById('intro-tap');
  var started = false;
  var gameStarted = false;
  var debugMode = window.location.search.indexOf('debug=1') > -1;
  var debugEl = null;

  if (debugMode) {
    debugEl = document.createElement('div');
    debugEl.style.cssText = 'position:fixed;bottom:10px;left:10px;color:lime;font:11px monospace;z-index:999999;background:rgba(0,0,0,0.8);padding:6px;white-space:pre;';
    document.body.appendChild(debugEl);
  }
  updateDebugInfo('loading video');

  // Force layout so video has real dimensions (iOS refuses zero-size play)
  void video.offsetHeight;

  // On iOS, video won't load until a user gesture, so we allow tap immediately.
  // play() in the gesture handler will trigger load+play in one step.

  // --- TAP HANDLER ---
  layer.addEventListener('pointerdown', function() {
    if (started) return;
    started = true;
    // Strategy: start muted (always succeeds from gesture), then unmute immediately.
    // Chrome rejects unmuted play() on low-engagement sites, but allows unmuting
    // a playing video within the same user activation.
    video.muted = true;
    var playPromise = video.play();
    tapMsg.style.display = 'none';
    if (playPromise && playPromise.then) {
      playPromise.then(function() {
        // Unmute now — still within the user activation microtask chain
        video.muted = false;
        updateDebugInfo('video playing, unmuted');
      }).catch(function(err) {
        updateDebugInfo('play() failed entirely: ' + err.name);
        startGame();
      });
    } else {
      // Older browser, no promise — just unmute
      video.muted = false;
    }
    // 14-second failsafe (intro is 10.6s — this is emergency only)
    setTimeout(function() {
      if (!gameStarted) {
        updateDebugInfo('FAILSAFE 14s');
        startGame();
      }
    }, 14000);
  });

  video.addEventListener('ended', startGame);
  // Narration runs to ~10.5s (file is 10.6s). Let video play to end naturally.
  // No early timeupdate transition — the 'ended' event above handles handoff.
  video.addEventListener('error', function() {
    updateDebugInfo('video error');
    startGame();
  });

  // Skip by tapping during playback
  video.addEventListener('pointerdown', function(e) {
    if (started && !video.ended && !gameStarted) {
      e.stopPropagation();
      video.pause();
      startGame();
    }
  });

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    layer.style.display = 'none';
    try {
      if (typeof init === 'function') init();
      updateDebugInfo('startGame OK');
    } catch(e) {
      updateDebugInfo('init ERROR: ' + e.message);
    }
  }

  function updateDebugInfo(msg) {
    if (!debugEl) return;
    debugEl.textContent = 'DEBUG ' + msg + ' | vidReady=' + (video ? video.readyState : '?') + ' | game=' + gameStarted;
  }
})();

// --- Defeat video layer ---
// Plays once per browsing session on first loss. Skippable. Falls back to defeat screen on any failure.
(function() {
  var defeatLayer = document.getElementById('defeat-layer');
  var defeatVideo = document.getElementById('defeat-video');
  var defeatPlayed = false;
  var defeatActive = false;
  var defeatDone = false;
  var FADE_START = 8.5;
  var FADE_CUT   = 9.0;

  // Check sessionStorage — only play once per browsing session
  try { defeatPlayed = sessionStorage.getItem('defeatPlayed') === '1'; } catch(e) {}

  // Preload: start fetching a few seconds into gameplay
  var preloadTimer = setTimeout(function() {
    if (!defeatPlayed) {
      defeatVideo.src = './assets/archimed_fail.mp4?v=3';
      defeatVideo.load();
    }
  }, 5000);

  // Exposed globally so session.js triggerLose can call it
  window.playDefeatCinematic = function(onDone) {
    // onDone: callback to show the defeat overlay
    if (defeatPlayed || defeatActive) { onDone(); return; }
    defeatActive = true;
    defeatDone = false;

    var finish = function() {
      if (defeatDone) return;
      defeatDone = true;
      defeatPlayed = true;
      try { sessionStorage.setItem('defeatPlayed', '1'); } catch(e) {}
      defeatVideo.pause();
      defeatLayer.style.display = 'none';
      onDone();
    };

    // If video not ready, skip straight to defeat screen
    if (!defeatVideo.src || defeatVideo.readyState < 2) {
      finish();
      return;
    }

    // Show layer and play
    defeatLayer.style.display = 'flex';
    defeatLayer.style.background = '#000';
    var playPromise = defeatVideo.play();
    if (playPromise && playPromise.then) {
      playPromise.catch(function() { finish(); });
    }

    // Fade-to-black transition
    defeatVideo.addEventListener('timeupdate', function onTime() {
      if (defeatDone) { defeatVideo.removeEventListener('timeupdate', onTime); return; }
      var t = defeatVideo.currentTime;
      if (t >= FADE_START) {
        defeatLayer.style.transition = 'background 0.5s';
        defeatLayer.style.background = '#000';
      }
      if (t >= FADE_CUT) {
        defeatVideo.removeEventListener('timeupdate', onTime);
        finish();
      }
    });

    // Fallbacks
    defeatVideo.addEventListener('ended', finish);
    defeatVideo.addEventListener('error', finish);

    // Skip on tap
    defeatLayer.addEventListener('pointerdown', function skipTap() {
      defeatLayer.removeEventListener('pointerdown', skipTap);
      finish();
    });

    // Failsafe: 12s max
    setTimeout(function() { if (!defeatDone) finish(); }, 12000);
  };
})();

// --- Win video layer ---
// Plays on every win. Skippable. Falls back to victory screen on any failure.
(function() {
  var winLayer = document.getElementById('win-layer');
  var winVideo = document.getElementById('win-video');
  var winActive = false;
  var winDone = false;

  // Preload: start fetching a few seconds into gameplay
  setTimeout(function() {
    winVideo.src = './assets/archimed_win.mp4?v=4';
    winVideo.load();
  }, 8000);

  // Exposed globally so session.js triggerWin can call it
  window.playWinCinematic = function(onDone) {
    if (winActive) { onDone(); return; }
    winActive = true;
    winDone = false;

    var finish = function() {
      if (winDone) return;
      winDone = true;
      winVideo.pause();
      winLayer.style.display = 'none';
      winActive = false;
      onDone();
    };

    // If video not ready, skip straight to victory screen
    if (!winVideo.src || winVideo.readyState < 2) {
      finish();
      return;
    }

    // Show layer and play
    winLayer.style.display = 'flex';
    winLayer.style.background = '#000';
    winVideo.muted = true;
    var playPromise = winVideo.play();
    if (playPromise && playPromise.then) {
      playPromise.then(function() { winVideo.muted = false; })
        .catch(function() { finish(); });
    } else {
      winVideo.muted = false;
    }

    // Narration runs to ~8.0s (file is 8.3s). Let video play to end.
    // 'ended' event below handles handoff.

    // Fallbacks
    winVideo.addEventListener('ended', finish);
    winVideo.addEventListener('error', finish);

    // Skip on tap
    winLayer.addEventListener('pointerdown', function skipTap() {
      winLayer.removeEventListener('pointerdown', skipTap);
      finish();
    });

    // Failsafe: 12s max
    setTimeout(function() { if (!winDone) finish(); }, 12000);
  };
})();

// === src/renderer.js ===
// ============================================================
// src/renderer.js — Three.js scene, orthographic camera, resize
// Fixed 9:16 portrait render target with letterboxing.
// Two-pass rendering: main scene + overlay scene (always on top).
// ============================================================



const TARGET_ASPECT = 9 / 16;

let scene, camera, renderer, worldWidth;
// Overlay scene renders on top of main scene (second pass, no depth issues)
let overlayScene, overlayCamera;

function initRenderer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080808);

  worldWidth = WORLD_HEIGHT * TARGET_ASPECT;
  const hw = worldWidth / 2;
  const hh = WORLD_HEIGHT / 2;

  camera = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 100);
  camera.position.z = 50;

  // Overlay scene (no background, renders on top)
  overlayScene = new THREE.Scene();
  overlayCamera = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 100);
  overlayCamera.position.z = 50;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.autoClear = false; // we manage clearing manually for two-pass
  document.body.appendChild(renderer.domElement);

  applyLetterbox();
  window.addEventListener('resize', applyLetterbox);
}

function applyLetterbox() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const winAspect = winW / winH;

  let canvasW, canvasH;
  if (winAspect > TARGET_ASPECT) {
    canvasH = winH;
    canvasW = Math.floor(winH * TARGET_ASPECT);
  } else {
    canvasW = winW;
    canvasH = Math.floor(winW / TARGET_ASPECT);
  }

  renderer.setSize(canvasW, canvasH);

  const el = renderer.domElement;
  el.style.position = 'absolute';
  el.style.left = Math.floor((winW - canvasW) / 2) + 'px';
  el.style.top = Math.floor((winH - canvasH) / 2) + 'px';
}

function getScene() { return scene; }
function getOverlayScene() { return overlayScene; }
function getCamera() { return camera; }
function getRenderer() { return renderer; }
function getWorldWidth() { return worldWidth; }

function render() {
  renderer.clear();
  renderer.render(scene, camera);
  // Second pass: overlay scene renders on top without clearing
  renderer.clearDepth();
  renderer.render(overlayScene, overlayCamera);
}

function screenToWorld(sx, sy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((sx - rect.left) / rect.width) * 2 - 1;
  const ny = -((sy - rect.top) / rect.height) * 2 + 1;
  const hw = worldWidth / 2;
  const hh = WORLD_HEIGHT / 2;
  return { x: nx * hw, y: ny * hh };
}


// === src/background.js ===
// ============================================================
// src/background.js — Environment bands for reversed layout
//
// Sky strip at top, sea with vertical gradient from spawn to wall,
// foam shoreline at wall edge, warm stone city ground at bottom.
// All boundaries derived from gameplay constants.
// Scrolling wave crests via canvas texture offset.
// ============================================================




// Colours (all below 22% luminance — beams must remain brightest)
const COL_SKY = 0x0a1520;       // near-black blue
const COL_GROUND = 0x2E2419;    // warm dark stone
const COL_WALL = 0x554433;      // wall line

let seaMesh = null;
let seaTexture = null;
let seaCanvas = null;
let seaCtx = null;
let seaW = 64;
let seaH = 512;
let reduceMotion = false;
let waveOffset = 0;

function initBackground() {
  const scene = getScene();
  const ww = getWorldWidth();
  const hh = WORLD_HEIGHT / 2;

  if (typeof window.matchMedia === 'function') {
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // Band boundaries derived from layout constants
  const skyTop = hh;
  const skyBot = SHIP_SPAWN_Y + 2;
  const seaTop = skyBot;
  const seaBot = WALL_Y;
  const groundTop = WALL_Y;
  const groundBot = -hh;

  // --- 1. Sky strip ---
  const skyH = skyTop - skyBot;
  if (skyH > 0) {
    const skyGeo = new THREE.PlaneGeometry(ww + 4, skyH);
    const skyMat = new THREE.MeshBasicMaterial({ color: COL_SKY, depthWrite: false });
    const skyMeshObj = new THREE.Mesh(skyGeo, skyMat);
    skyMeshObj.position.set(0, skyBot + skyH / 2, -10);
    scene.add(skyMeshObj);
  }

  // --- 2. Sea band (gradient + animated wave texture) ---
  const seaH_world = seaTop - seaBot;

  // Sea canvas: vertical gradient + wave crests drawn procedurally
  seaCanvas = document.createElement('canvas');
  seaCanvas.width = seaW;
  seaCanvas.height = seaH;
  seaCtx = seaCanvas.getContext('2d');
  drawSeaBase(seaCtx, seaW, seaH);

  seaTexture = new THREE.CanvasTexture(seaCanvas);
  seaTexture.minFilter = THREE.LinearFilter;
  seaTexture.magFilter = THREE.LinearFilter;

  const seaGeo = new THREE.PlaneGeometry(ww + 4, seaH_world);
  const seaMat = new THREE.MeshBasicMaterial({ map: seaTexture, depthWrite: false });
  seaMesh = new THREE.Mesh(seaGeo, seaMat);
  seaMesh.position.set(0, seaBot + seaH_world / 2, -10);
  scene.add(seaMesh);

  // --- 3. Shoreline foam (thin band at sea/ground boundary) ---
  const foamH = 1.2;
  const foamGeo = new THREE.PlaneGeometry(ww + 4, foamH);
  const foamMat = new THREE.MeshBasicMaterial({ color: 0x1a3a48, transparent: true, opacity: 0.7, depthWrite: false });
  const foamMesh = new THREE.Mesh(foamGeo, foamMat);
  foamMesh.position.set(0, WALL_Y + foamH / 2, -9.8);
  scene.add(foamMesh);

  // Thin foam edge
  const edgeH = 0.3;
  const edgeGeo = new THREE.PlaneGeometry(ww + 4, edgeH);
  const edgeMat = new THREE.MeshBasicMaterial({ color: 0x234858, transparent: true, opacity: 0.4, depthWrite: false });
  const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
  edgeMesh.position.set(0, WALL_Y + edgeH / 2, -9.7);
  scene.add(edgeMesh);

  // --- 4. City ground ---
  const groundH = groundTop - groundBot;
  const groundGeo = new THREE.PlaneGeometry(ww + 4, groundH);
  const groundMat = new THREE.MeshBasicMaterial({ color: COL_GROUND, depthWrite: false });
  const groundMeshObj = new THREE.Mesh(groundGeo, groundMat);
  groundMeshObj.position.set(0, groundBot + groundH / 2, -10);
  scene.add(groundMeshObj);

  // Wall line (breach boundary — subtle stone wall, not a red danger line)
  const wallGeo = new THREE.PlaneGeometry(ww + 4, 1.2);
  const wallMat = new THREE.MeshBasicMaterial({ color: COL_WALL, depthWrite: false });
  const wallMeshObj = new THREE.Mesh(wallGeo, wallMat);
  wallMeshObj.position.set(0, WALL_Y, -9.5);
  scene.add(wallMeshObj);
}

function updateBackground(dt) {
  if (!seaTexture || reduceMotion) return;

  // Scroll wave crests by redrawing with offset
  waveOffset += dt * 12; // pixels per second scroll speed
  if (waveOffset > seaH) waveOffset -= seaH;

  drawSeaBase(seaCtx, seaW, seaH);
  drawWaveCrests(seaCtx, seaW, seaH, waveOffset);
  seaTexture.needsUpdate = true;
}

// --- Sea drawing ---

function drawSeaBase(ctx, w, h) {
  // Vertical gradient: dark at top (#12303F), lighter toward shore (#1A4257)
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0c1e2a');  // darkest at top (deep sea, horizon)
  grad.addColorStop(0.4, '#12303F');
  grad.addColorStop(0.85, '#1A4257');
  grad.addColorStop(1.0, '#1a4257'); // stays at limit, no brighter
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function drawWaveCrests(ctx, w, h, offset) {
  // 6 thin wave crest lines scrolling downward
  const NUM_CRESTS = 6;
  const spacing = h / NUM_CRESTS;

  ctx.save();
  for (let i = 0; i < NUM_CRESTS; i++) {
    const baseY = ((i * spacing + offset) % h);
    // Varying opacity per crest (some subtle, some slightly brighter)
    const alpha = 0.06 + 0.03 * Math.sin(i * 1.7);
    ctx.strokeStyle = `rgba(50, 100, 130, ${alpha})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
      const y = baseY + Math.sin(x * 0.3 + i * 2.1) * 1.5;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}


// === src/fortress.js ===
// ============================================================
// src/fortress.js — Fortress silhouette with damage stages
//
// Drawn to canvas, positioned along city ground behind mirrors.
// Reacts to wall integrity with 4 visual stages.
// Breach triggers shake + dust particles.
// ============================================================





const FORT_W = 512;
const FORT_H = 256;
const COL_STONE = '#2E2419';
const COL_STONE_LIGHT = '#3D3020';
const COL_STONE_HIGHLIGHT = '#4A3B26';
const COL_RUBBLE = '#1F1A10';
const COL_FIRE = '#CC4400';
const COL_SMOKE = 'rgba(40,35,30,0.6)';

let fortMesh = null;
let fortCanvas = null;
let fortCtx = null;
let fortTexture = null;
let lastStage = -1;

// Shake state
let shakeTimer = 0;
let shakeIntensity = 0;
const SHAKE_DURATION = 0.3;

// Dust particles
const dustParticles = [];
const MAX_DUST = 20;

// Smoke plumes (persistent for stages 3-4)
const smokePlumes = [];

function initFortress() {
  const scene = getScene();
  const ww = getWorldWidth();

  fortCanvas = document.createElement('canvas');
  fortCanvas.width = FORT_W;
  fortCanvas.height = FORT_H;
  fortCtx = fortCanvas.getContext('2d');

  fortTexture = new THREE.CanvasTexture(fortCanvas);
  fortTexture.minFilter = THREE.LinearFilter;
  fortTexture.magFilter = THREE.LinearFilter;

  // Fortress spans the full width, positioned at the wall line
  // Height: from WALL_Y downward ~12 world units, towers rise ~4 above WALL_Y
  const fortWorldH = 16;
  const fortWorldW = ww + 4;
  const geo = new THREE.PlaneGeometry(fortWorldW, fortWorldH);
  const mat = new THREE.MeshBasicMaterial({ map: fortTexture, transparent: true, depthWrite: false });
  fortMesh = new THREE.Mesh(geo, mat);
  // Centre at WALL_Y - 4 (mostly below wall, towers above)
  fortMesh.position.set(0, WALL_Y - 4, -8);
  scene.add(fortMesh);

  // Initial draw
  drawFortress(1.0);
  lastStage = 4;
}

function updateFortress(dt) {
  const integrity = getWallIntegrity() / 100; // 0 to 1
  const stage = integrity > 0.75 ? 4 : integrity > 0.50 ? 3 : integrity > 0.25 ? 2 : 1;

  // Redraw only when stage changes
  if (stage !== lastStage) {
    lastStage = stage;
    drawFortress(integrity);
    fortTexture.needsUpdate = true;
  }

  // Shake decay
  if (shakeTimer > 0) {
    shakeTimer -= dt;
    const t = shakeTimer / SHAKE_DURATION;
    const ox = (Math.random() - 0.5) * shakeIntensity * t;
    const oy = (Math.random() - 0.5) * shakeIntensity * 0.5 * t;
    fortMesh.position.x = ox;
    fortMesh.position.y = WALL_Y - 4 + oy;
  } else {
    fortMesh.position.x = 0;
    fortMesh.position.y = WALL_Y - 4;
  }

  // Update dust particles
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const p = dustParticles[i];
    p.life -= dt;
    if (p.life <= 0) {
      if (p.mesh) { p.mesh.visible = false; }
      dustParticles.splice(i, 1);
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy -= 15 * dt; // gravity
      if (p.mesh) {
        p.mesh.position.set(p.x, p.y, -7);
        p.mesh.material.opacity = p.life / p.maxLife * 0.6;
      }
    }
  }
}

// Called from session.js when a breach happens
function triggerBreachShake(damage) {
  shakeTimer = SHAKE_DURATION;
  shakeIntensity = Math.min(damage / 10, 2.5);
  // Spawn dust
  spawnDust(6);
}

function spawnDust(count) {
  const scene = getScene();
  const ww = getWorldWidth();
  for (let i = 0; i < count && dustParticles.length < MAX_DUST; i++) {
    const x = (Math.random() - 0.5) * ww * 0.6;
    const y = WALL_Y + Math.random() * 2;
    const geo = new THREE.PlaneGeometry(1.2, 1.2);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x4A3B26, transparent: true, opacity: 0.5, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, -7);
    scene.add(mesh);
    dustParticles.push({
      mesh, x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: Math.random() * 12 + 5,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 1.0,
    });
  }
}

// --- Fortress drawing ---

function drawFortress(integrity) {
  const ctx = fortCtx;
  const w = FORT_W;
  const h = FORT_H;
  ctx.clearRect(0, 0, w, h);

  const stage = integrity > 0.75 ? 4 : integrity > 0.50 ? 3 : integrity > 0.25 ? 2 : 1;

  // Ground level is at h * 0.35 (from top of canvas)
  // Rampart sits on top of ground, towers rise higher
  const groundY = h * 0.35;
  const rampartH = h * 0.25;
  const rampartTop = groundY - rampartH;
  const crenH = h * 0.06;
  const crenW = w * 0.03;
  const crenGap = w * 0.02;

  // --- Rooftops (behind rampart, suggestion of buildings) ---
  ctx.fillStyle = COL_RUBBLE;
  // Several peaked roofs behind the wall
  for (let i = 0; i < 8; i++) {
    const rx = w * 0.08 + i * w * 0.12;
    const rw = w * 0.08 + Math.random() * w * 0.03;
    const rh = h * 0.08 + Math.random() * h * 0.06;
    ctx.beginPath();
    ctx.moveTo(rx, groundY + rampartH * 0.1);
    ctx.lineTo(rx + rw / 2, groundY + rampartH * 0.1 - rh);
    ctx.lineTo(rx + rw, groundY + rampartH * 0.1);
    ctx.closePath();
    ctx.fill();
  }

  // --- Main rampart wall ---
  ctx.fillStyle = COL_STONE;
  ctx.fillRect(0, rampartTop, w, rampartH);

  // Stone block lines (horizontal courses)
  ctx.strokeStyle = COL_STONE_LIGHT;
  ctx.lineWidth = 1;
  for (let row = 0; row < 5; row++) {
    const y = rampartTop + row * (rampartH / 5);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  // Vertical joints (offset per row)
  ctx.strokeStyle = 'rgba(25,20,12,0.4)';
  for (let row = 0; row < 5; row++) {
    const y = rampartTop + row * (rampartH / 5);
    const offset = (row % 2) * (w * 0.04);
    for (let j = 0; j < 14; j++) {
      const jx = offset + j * (w / 13);
      ctx.beginPath();
      ctx.moveTo(jx, y);
      ctx.lineTo(jx, y + rampartH / 5);
      ctx.stroke();
    }
  }

  // --- Crenellations (merlons along top) ---
  const merlonCount = 16;
  const merlonW = w / merlonCount * 0.55;
  const merlonSpacing = w / merlonCount;
  ctx.fillStyle = COL_STONE;
  for (let i = 0; i < merlonCount; i++) {
    // Skip some in damaged stages
    if (stage <= 3 && (i === 5 || i === 11)) continue; // one missing at stage 3
    if (stage <= 2 && (i === 3 || i === 8 || i === 13)) continue; // more missing
    if (stage <= 1 && (i === 1 || i === 6 || i === 9 || i === 14)) continue;

    const mx = i * merlonSpacing + merlonSpacing * 0.22;
    ctx.fillRect(mx, rampartTop - crenH, merlonW, crenH);
  }

  // --- Towers (two main, one smaller) ---
  drawTower(ctx, w * 0.18, rampartTop, w * 0.08, h * 0.18, stage);
  drawTower(ctx, w * 0.78, rampartTop, w * 0.09, h * 0.20, stage);
  // Smaller centre tower
  drawTower(ctx, w * 0.48, rampartTop, w * 0.06, h * 0.12, stage);

  // --- Damage effects ---
  if (stage <= 3) {
    // Cracks
    ctx.strokeStyle = '#1A1408';
    ctx.lineWidth = 2;
    drawCrack(ctx, w * 0.35, rampartTop + rampartH * 0.3, 20, 4);
    if (stage <= 2) {
      drawCrack(ctx, w * 0.65, rampartTop + rampartH * 0.5, 25, 5);
    }
  }

  if (stage <= 2) {
    // Breach: a gap in the wall with rubble
    const bx = w * 0.55;
    const bw = w * 0.08;
    ctx.fillStyle = '#0c0a06'; // dark hole
    ctx.fillRect(bx, rampartTop + rampartH * 0.3, bw, rampartH * 0.7);
    // Rubble at base
    ctx.fillStyle = COL_RUBBLE;
    for (let r = 0; r < 5; r++) {
      const rx = bx - 5 + Math.random() * (bw + 10);
      const ry = rampartTop + rampartH - 5 + Math.random() * 10;
      ctx.beginPath();
      ctx.arc(rx, ry, 3 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Thin smoke
    ctx.fillStyle = COL_SMOKE;
    for (let s = 0; s < 3; s++) {
      const sx = bx + bw * 0.5 + (Math.random() - 0.5) * 10;
      const sy = rampartTop + rampartH * 0.2 - s * 12;
      ctx.beginPath();
      ctx.arc(sx, sy, 6 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (stage <= 1) {
    // Multiple breaches + fire
    const bx2 = w * 0.25;
    const bw2 = w * 0.07;
    ctx.fillStyle = '#0c0a06';
    ctx.fillRect(bx2, rampartTop + rampartH * 0.2, bw2, rampartH * 0.8);
    // More rubble
    ctx.fillStyle = COL_RUBBLE;
    for (let r = 0; r < 4; r++) {
      ctx.beginPath();
      ctx.arc(bx2 + Math.random() * bw2, rampartTop + rampartH + Math.random() * 8, 3 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Fires
    drawFire(ctx, w * 0.56, rampartTop + rampartH * 0.1);
    drawFire(ctx, w * 0.26, rampartTop + rampartH * 0.05);
    // Heavy smoke
    ctx.fillStyle = 'rgba(30,25,20,0.5)';
    for (let s = 0; s < 6; s++) {
      const sx = w * 0.2 + Math.random() * w * 0.6;
      const sy = rampartTop - 10 - s * 8 - Math.random() * 10;
      ctx.beginPath();
      ctx.arc(sx, sy, 8 + Math.random() * 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Ground below rampart ---
  ctx.fillStyle = COL_STONE;
  ctx.fillRect(0, rampartTop + rampartH, w, h - (rampartTop + rampartH));
}

function drawTower(ctx, x, wallTop, tw, th, stage) {
  const towerTop = wallTop - th;
  ctx.fillStyle = COL_STONE_LIGHT;
  ctx.fillRect(x - tw / 2, towerTop, tw, th);

  // Tower cap (pointed)
  ctx.fillStyle = '#1F1A10';
  ctx.beginPath();
  ctx.moveTo(x - tw / 2 - 2, towerTop);
  ctx.lineTo(x, towerTop - th * 0.2);
  ctx.lineTo(x + tw / 2 + 2, towerTop);
  ctx.closePath();
  ctx.fill();

  // Window slit
  ctx.fillStyle = '#0a0806';
  ctx.fillRect(x - 2, towerTop + th * 0.3, 4, th * 0.15);

  // Damage to tower
  if (stage <= 2) {
    ctx.fillStyle = '#0c0a06';
    ctx.fillRect(x - tw * 0.3, towerTop + th * 0.5, tw * 0.3, th * 0.3);
  }
}

function drawCrack(ctx, x, y, length, segments) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 0; i < segments; i++) {
    x += (Math.random() - 0.3) * (length / segments);
    y += Math.random() * (length / segments) * 0.8;
    ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawFire(ctx, x, y) {
  // Simple flame shapes
  const flames = [
    { dx: 0, dy: 0, r: 6, col: COL_FIRE },
    { dx: -3, dy: -4, r: 4, col: '#FF6600' },
    { dx: 2, dy: -7, r: 3, col: '#FFAA00' },
    { dx: -1, dy: -10, r: 2, col: '#FFCC44' },
  ];
  for (const f of flames) {
    ctx.fillStyle = f.col;
    ctx.beginPath();
    ctx.arc(x + f.dx, y + f.dy, f.r, 0, Math.PI * 2);
    ctx.fill();
  }
}


// === src/zeus.js ===
// ============================================================
// src/zeus.js — Zeus ultimate: lightning strike
//
// Ready state: "ZEUS IS LISTENING" text + chime when faith threshold met.
// Strike: white flash, staggered lightning bolts to all ships,
// massive damage, 3s stun, screen shake, thunder crack + rumble.
// ============================================================





// --- State ---
let zeusReady = false;
let readyNotified = false;
let readyTextMesh = null;
let readyTextTimer = 0;

let strikeActive = false;
let strikeTimer = 0;
let strikeBolts = [];
let flashAlpha = 0;
let zeusShakeTimer = 0;
let zeusShakeIntensity = 0;

// Audio context (lazy, shared with game audio via global AudioContext)
let aCtx = null;

function isZeusReady() { return zeusReady; }
function getZeusFlash() { return flashAlpha; }
function getZeusShake() {
  if (zeusShakeTimer <= 0) return { x: 0, y: 0 };
  const t = zeusShakeTimer / 0.5;
  return {
    x: (Math.random() - 0.5) * zeusShakeIntensity * t,
    y: (Math.random() - 0.5) * zeusShakeIntensity * 0.5 * t
  };
}

function initZeus() {
  const scene = getScene();
  // "ZEUS IS LISTENING" text sprite
  const c = document.createElement('canvas');
  c.width = 320; c.height = 40;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFDD44';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ZEUS IS LISTENING', 160, 20);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const geo = new THREE.PlaneGeometry(24, 3);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false });
  readyTextMesh = new THREE.Mesh(geo, mat);
  readyTextMesh.position.set(0, SHIP_SPAWN_Y - 6, 6);
  scene.add(readyTextMesh);
}

// Called each frame from main loop
function updateZeus(dt, faith, faithThreshold) {
  const wasReady = zeusReady;
  zeusReady = faith >= faithThreshold;

  // Notify on crossing threshold
  if (zeusReady && !readyNotified) {
    readyNotified = true;
    readyTextTimer = 2.5;
    playReadyChime();
  }
  if (!zeusReady) {
    readyNotified = false;
  }

  // Fade text
  if (readyTextTimer > 0) {
    readyTextTimer -= dt;
    const alpha = Math.min(1, readyTextTimer * 2); // fade in fast, out slow
    readyTextMesh.material.opacity = alpha;
  } else {
    readyTextMesh.material.opacity = 0;
  }

  // Strike animation
  if (strikeActive) {
    updateStrike(dt);
  }
}

// Called from crafting.js when Zeus button is pressed
function triggerZeusStrike() {
  if (strikeActive) return;
  strikeActive = true;
  strikeTimer = 1.8;
  flashAlpha = 1.0;
  zeusShakeTimer = 0.5;
  zeusShakeIntensity = 4;
  readyNotified = false;

  const pool = getEnemyPool();
  const ww = getWorldWidth();
  const laneWidth = ww / ENEMY_LANE_COUNT;
  const scene = getScene();

  // Hit all active enemies
  const targets = pool.filter(e => e.active);
  strikeBolts = [];

  for (let i = 0; i < targets.length; i++) {
    const enemy = targets[i];
    const ex = -ww / 2 + laneWidth * (enemy.lane + 0.5);
    const ey = enemy.y;

    // Massive damage (kills skiffs/triremes outright, heavily damages quadriremes)
    enemy.hp -= 300;
    enemy.heat = Math.min(enemy.maxHp, enemy.heat + 200);
    // Stun: stop for 3 seconds
    enemy.stunTimer = 3.0;

    // Create bolt mesh (staggered reveal)
    const bolt = createBoltMesh(ex + (Math.random() - 0.5) * 3, SHIP_SPAWN_Y + 8, ex, ey);
    bolt.revealAt = 1.8 - i * 0.06; // stagger 60ms apart
    bolt.revealed = false;
    bolt.life = 0.4;
    bolt.mesh.visible = false;
    scene.add(bolt.mesh);
    strikeBolts.push(bolt);
  }

  // Thunder audio
  playThunderCrack();
}

function updateStrike(dt) {
  strikeTimer -= dt;
  flashAlpha = Math.max(0, flashAlpha - dt * 2.5);

  // Reveal bolts staggered
  for (const bolt of strikeBolts) {
    if (!bolt.revealed && strikeTimer < bolt.revealAt) {
      bolt.revealed = true;
      bolt.mesh.visible = true;
    }
    if (bolt.revealed) {
      bolt.life -= dt;
      if (bolt.life <= 0) {
        bolt.mesh.visible = false;
      } else {
        bolt.mesh.material.opacity = Math.min(1, bolt.life * 5);
      }
    }
  }

  // Shake decay
  if (zeusShakeTimer > 0) zeusShakeTimer -= dt;

  // End
  if (strikeTimer <= 0) {
    strikeActive = false;
    const scene = getScene();
    for (const bolt of strikeBolts) {
      scene.remove(bolt.mesh);
      bolt.mesh.geometry.dispose();
      bolt.mesh.material.dispose();
    }
    strikeBolts = [];
  }
}

// --- Lightning bolt: jagged quad strip ---
function createBoltMesh(x1, y1, x2, y2) {
  const segments = 10 + Math.floor(Math.random() * 5);
  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const jitterX = (i > 0 && i < segments) ? (Math.random() - 0.5) * 8 : 0;
    const jitterY = (i > 0 && i < segments) ? (Math.random() - 0.5) * 2 : 0;
    points.push(x1 + (x2 - x1) * t + jitterX, y1 + (y2 - y1) * t + jitterY);
  }

  const verts = [];
  const thickness = 0.7;
  for (let i = 0; i < points.length - 2; i += 2) {
    const ax = points[i], ay = points[i + 1];
    const bx = points[i + 2], by = points[i + 3];
    const dx = bx - ax, dy = by - ay;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len * thickness, ny = dx / len * thickness;
    verts.push(ax + nx, ay + ny, 0, ax - nx, ay - ny, 0, bx + nx, by + ny, 0);
    verts.push(ax - nx, ay - ny, 0, bx - nx, by - ny, 0, bx + nx, by + ny, 0);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const mat = new THREE.MeshBasicMaterial({
    color: 0xFFFFDD, transparent: true, opacity: 1.0,
    side: THREE.DoubleSide, depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.z = 9;
  return { mesh, revealAt: 0, revealed: false, life: 0.4 };
}

// --- Audio ---
function getACtx() {
  if (aCtx) return aCtx;
  try { aCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  return aCtx;
}

function playReadyChime() {
  const ctx = getACtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  // Rising two-note chime: C5 → E5
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.2, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
  g.connect(ctx.destination);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 523;
  o1.connect(g); o1.start(now); o1.stop(now + 0.15);
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 659;
  o2.connect(g); o2.start(now + 0.13); o2.stop(now + 0.6);
}

function playThunderCrack() {
  const ctx = getACtx();
  if (!ctx) return;
  const now = ctx.currentTime;

  // Sharp crack: noise burst
  const crackLen = Math.ceil(ctx.sampleRate * 0.1);
  const buf = ctx.createBuffer(1, crackLen, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < crackLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / crackLen, 2);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const cg = ctx.createGain();
  cg.gain.setValueAtTime(0.5, now);
  cg.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  src.connect(cg).connect(ctx.destination);
  src.start(now);

  // Low rumble tail
  const rumLen = Math.ceil(ctx.sampleRate * 1.5);
  const rBuf = ctx.createBuffer(1, rumLen, ctx.sampleRate);
  const rd = rBuf.getChannelData(0);
  for (let i = 0; i < rumLen; i++) rd[i] = Math.random() * 2 - 1;
  const rSrc = ctx.createBufferSource(); rSrc.buffer = rBuf;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(180, now);
  lp.frequency.exponentialRampToValueAtTime(30, now + 1.3);
  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0.3, now + 0.05);
  rg.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
  rSrc.connect(lp).connect(rg).connect(ctx.destination);
  rSrc.start(now + 0.04);
}

// ============================================================
// src/beam.js — Iterative raycast beam solver with resonance detection
// ============================================================


// Segment: { start, end, colour, intensity, bounces, preSplit }
let segments = [];
let dirty = true;
// Diagnostics — read by debug overlay
let maxBouncesUsed = 0;
let hitBounceCap = false;
function markDirty() { dirty = true; }
function isDirty() { return dirty; }
function getSegments() { return segments; }
function getBeamDiag() { return { maxBouncesUsed, hitBounceCap }; }
// Resonance: detected when 3+ bounces occur between the same mirror pair
let resonanceActive = false;
let resonanceMirrors = null; // [mirrorA, mirrorB] if resonance detected
function getResonanceActive() { return resonanceActive; }
function getResonanceMirrors() { return resonanceMirrors; }
// Called by main loop when dirty
function solve(sourceX, sourceY, mirrors, prisms, worldWidth, foundryColliders) {
  segments = [];
  maxBouncesUsed = 0;
  hitBounceCap = false;
  resonanceActive = false;
  resonanceMirrors = null;
  mirrorHitSequence = [];
  const dir = { x: 0, y: -1 };

// ============================================================
// src/beam-render.js — Quad mesh pool for beam segment rendering
//
// Each segment is a textured quad with additive blending.
// A second wider quad behind provides soft glow.
// Pool is pre-allocated; unused meshes are hidden.
//
// Width encodes power: thicker = stronger beam.
// Gold band renders thinner and pulses slowly.
// ============================================================




const meshes = [];      // { core: Mesh, glow: Mesh }
let poolReady = false;
let pulseTime = 0;

// Gold is rendered at 60% width of other bands to be visually distinct
const GOLD_WIDTH_FACTOR = 0.6;

function initBeamRenderer() {
  const scene = getScene();
  for (let i = 0; i < BEAM_SEGMENT_POOL_SIZE; i++) {
    const core = createQuadMesh(1.0);
    const glow = createQuadMesh(0.35);
    core.visible = false;
    glow.visible = false;
    // Beams render behind objects (z < 0)
    glow.position.z = -0.5;
    core.position.z = -0.3;
    scene.add(glow);
    scene.add(core);
    meshes.push({ core, glow });
  }
  poolReady = true;
}

function updateBeamPulse(dt) {
  pulseTime += dt;
}

function rebuildBeams(segments) {
  if (!poolReady) return;

  for (let i = 0; i < BEAM_SEGMENT_POOL_SIZE; i++) {
    const entry = meshes[i];
    if (i < segments.length) {
      const seg = segments[i];

      // Width proportional to intensity: full=1.0, halved sub-ray=0.5
      let widthMult = seg.intensity;
      // Gold is thinner
      if (seg.colour === COLOUR_GOLD) widthMult *= GOLD_WIDTH_FACTOR;
      // Gold pulses: opacity oscillates 0.7–1.0
      let opacityMult = 1.0;
      if (seg.colour === COLOUR_GOLD) {
        opacityMult = 0.7 + 0.3 * Math.sin(pulseTime * 2.5);
      }

      const coreW = BEAM_WIDTH * widthMult;
      const glowW = BEAM_GLOW_WIDTH * widthMult;

      // Edge fade: reduce opacity if segment ends near world boundary
      const hh = WORLD_HEIGHT / 2;
      const edgeMargin = 4; // fade starts this many units from edge
      const endDistFromEdge = Math.min(
        Math.abs(seg.end.x) < 28 ? 99 : 28 - Math.abs(seg.end.x) + edgeMargin,
        hh - Math.abs(seg.end.y) + edgeMargin
      );
      const edgeFade = Math.min(1, Math.max(0.1, endDistFromEdge / edgeMargin));
      const finalOpacity = opacityMult * edgeFade;

      positionQuad(entry.core, seg.start, seg.end, coreW);
      positionQuad(entry.glow, seg.start, seg.end, glowW);
      setQuadColour(entry.core, seg.colour, seg.intensity * finalOpacity);
      setQuadColour(entry.glow, seg.colour, seg.intensity * 0.35 * finalOpacity);
      entry.core.visible = true;
      entry.glow.visible = true;
    } else {
      entry.core.visible = false;
      entry.glow.visible = false;
    }
  }
}

function createQuadMesh(opacity) {
  const geo = new THREE.PlaneGeometry(1, 1);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  return new THREE.Mesh(geo, mat);
}

function positionQuad(mesh, start, end, width) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);

  mesh.position.x = (start.x + end.x) / 2;
  mesh.position.y = (start.y + end.y) / 2;

  mesh.scale.x = length;
  mesh.scale.y = width;

  mesh.rotation.z = angle;
}

function setQuadColour(mesh, colour, intensity) {
  mesh.material.color.setHex(colour);
  mesh.material.opacity = Math.min(1.0, intensity);
}

// Hide/show all beam geometry (for game-over screen)
function setBeamsVisible(visible) {
  for (let i = 0; i < meshes.length; i++) {
    meshes[i].core.visible = visible && meshes[i].core.visible;
    meshes[i].glow.visible = visible && meshes[i].glow.visible;
  }
  if (!visible) {
    for (let i = 0; i < meshes.length; i++) {
      meshes[i].core.visible = false;
      meshes[i].glow.visible = false;
    }
  }
}

// ============================================================
// src/mirror.js — Mirror objects, generic socket system, tweens
// ============================================================





const sockets = [];
const mirrors = [];
let mirrorMeshGroup = null;

const MIRROR_THICKNESS = 1;

// Active tweens: { mirror, fromX, fromY, toX, toY, elapsed, duration }
const tweens = [];

function initSockets() {
  sockets.length = 0;
  for (let i = 0; i < SOCKET_POSITIONS.length; i++) {
    sockets.push({ type: null, objectRef: null });
  }
}

function getSockets() { return sockets; }
function getSocketPositions() { return SOCKET_POSITIONS; }
function getMirrors() { return mirrors; }

function initMirrors() {
  const scene = getScene();
  mirrors.length = 0;
  tweens.length = 0;
  mirrorMeshGroup = new THREE.Group();
  scene.add(mirrorMeshGroup);

  for (let i = 0; i < MIRROR_COUNT_START; i++) {
    const socketIdx = DEFAULT_MIRROR_SOCKETS[i];
    const mirror = createMirror(socketIdx);
    // Default angles: flank mirrors horizontal (aim bands into ship lanes),
    // centre mirror vertical (needs player rotation to be useful)
    if (i === 1) {
      // Centre mirror (socket 4 at x=0): vertical, beam goes sideways
      mirror.angle = Math.PI / 2;
    } else {
      // Flank mirrors (sockets 3,5 at x=±15): horizontal, beam goes up
      mirror.angle = 0;
    }
    updateMirrorGeometry(mirror);
    mirrors.push(mirror);
    sockets[socketIdx].type = 'mirror';
    sockets[socketIdx].objectRef = mirror;
  }

  // Socket indicators: hidden when FREE_PLACEMENT is true
  if (!FREE_PLACEMENT) {
    for (let i = 0; i < SOCKET_POSITIONS.length; i++) {
      const [sx, sy] = SOCKET_POSITIONS[i];
      const indicator = new THREE.Mesh(
        new THREE.RingGeometry(1.5, 1.8, 16),
        new THREE.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.5 })
      );
      indicator.position.set(sx, sy, -1.0);
      mirrorMeshGroup.add(indicator);
    }
  }
}

function createMirror(socketIndex) {
  const [sx, sy] = SOCKET_POSITIONS[socketIndex];
  const angle = 0; // default, overridden in initMirrors per-mirror

  // Draw mirror as bronze shield on wooden cart (canvas texture)
  const texSize = 64;
  const c = document.createElement('canvas');
  c.width = texSize; c.height = texSize;
  const ctx = c.getContext('2d');
  drawMirrorSprite(ctx, texSize);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;

  const spriteSize = MIRROR_LENGTH + 2; // slightly larger for the cart frame
  const geo = new THREE.PlaneGeometry(spriteSize, spriteSize);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(sx, sy, 0);
  mesh.rotation.z = angle;
  mirrorMeshGroup.add(mesh);

  return {
    id: socketIndex,
    socketIndex,
    angle,
    hits: 0,
    shattered: false,
    reinforced: false,
    anchored: false,
    freeX: sx,
    freeY: sy,
    mesh,
    p1: { x: 0, y: 0 },
    p2: { x: 0, y: 0 },
    normal: { x: 0, y: 0 },
    length: MIRROR_LENGTH,
  };
}

// Add a new mirror at purchase — placed in the centre of mirror field, horizontal (angle=0)
function addMirror() {
  const ww = getWorldWidth();
  // Find a free socket, or place freely in the mirror field
  let socketIdx = -1;
  for (let i = 0; i < sockets.length; i++) {
    if (sockets[i].type === null) { socketIdx = i; break; }
  }
  if (socketIdx < 0) socketIdx = 0; // fallback

  const mirror = createMirror(socketIdx);
  mirror.angle = 0; // horizontal — immediately useful (reflects beams upward)

  if (FREE_PLACEMENT) {
    // Place in the middle of the mirror field, slightly offset so it doesn't overlap existing
    const offsetX = (Math.random() - 0.5) * 10;
    mirror.freeX = offsetX;
    mirror.freeY = (MIRROR_FIELD_TOP + MIRROR_FIELD_BOT) / 2;
  }

  updateMirrorGeometry(mirror);
  mirrors.push(mirror);
  sockets[socketIdx].type = 'mirror';
  sockets[socketIdx].objectRef = mirror;
  markDirty();
  return mirror;
}

function drawMirrorSprite(ctx, sz) {
  const cx = sz / 2;
  const cy = sz / 2;
  ctx.clearRect(0, 0, sz, sz);

  // Wooden cart frame (horizontal bar behind the shield)
  ctx.fillStyle = '#3D2010';
  ctx.fillRect(cx - sz * 0.42, cy - 2, sz * 0.84, 4);

  // Wheels (small circles at ends)
  ctx.fillStyle = '#2A1500';
  ctx.beginPath();
  ctx.arc(cx - sz * 0.38, cy + 3, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + sz * 0.38, cy + 3, 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Wheel spokes
  ctx.strokeStyle = '#5C3D2E';
  ctx.lineWidth = 0.8;
  for (let w = -1; w <= 1; w += 2) {
    const wx = cx + w * sz * 0.38;
    const wy = cy + 3;
    ctx.beginPath(); ctx.moveTo(wx - 2, wy); ctx.lineTo(wx + 2, wy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wy - 2); ctx.lineTo(wx, wy + 2); ctx.stroke();
  }

  // Bronze polished shield face (large ellipse — wider than tall since mirror is oriented horizontally)
  const shieldRx = sz * 0.32;
  const shieldRy = sz * 0.28;
  // Metallic gradient
  const grad = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, shieldRx);
  grad.addColorStop(0, '#E8C87A');   // bright highlight
  grad.addColorStop(0.3, '#CC9944'); // polished bronze
  grad.addColorStop(0.7, '#996633'); // darker bronze
  grad.addColorStop(1, '#664422');   // rim shadow
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldRx, shieldRy, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shield rim ring
  ctx.strokeStyle = '#553311';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldRx, shieldRy, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Centre boss (raised bump)
  ctx.fillStyle = '#DDAA55';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#AA7733';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function updateMirrorGeometry(mirror) {
  let sx, sy;
  if (FREE_PLACEMENT && mirror.freeX !== undefined) {
    sx = mirror.freeX;
    sy = mirror.freeY;
  } else {
    [sx, sy] = SOCKET_POSITIONS[mirror.socketIndex];
  }
  const halfLen = mirror.length / 2;
  const cos = Math.cos(mirror.angle);
  const sin = Math.sin(mirror.angle);

  mirror.p1 = { x: sx - halfLen * cos, y: sy - halfLen * sin };
  mirror.p2 = { x: sx + halfLen * cos, y: sy + halfLen * sin };
  mirror.normal = { x: -sin, y: cos };

  mirror.mesh.position.set(sx, sy, 0);
  mirror.mesh.rotation.z = mirror.angle;
}

// Free placement: move mirror to position, clamped to mirror field
function moveMirrorFree(mirror, x, y) {
  const ww = getWorldWidth();
  const hw = ww / 2;
  mirror.freeX = Math.max(-hw + 2, Math.min(hw - 2, x));
  mirror.freeY = Math.max(MIRROR_FIELD_BOT, Math.min(MIRROR_FIELD_TOP, y));
  updateMirrorGeometry(mirror);
  markDirty();
}

// --- Tween system ---

// Ease-out cubic: decelerates to zero
function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

// Start a tween from current visual position to target socket
function startTween(mirror, fromX, fromY) {
  const [toX, toY] = SOCKET_POSITIONS[mirror.socketIndex];
  // Remove any existing tween for this mirror
  for (let i = tweens.length - 1; i >= 0; i--) {
    if (tweens[i].mirror === mirror) tweens.splice(i, 1);
  }
  tweens.push({
    mirror,
    fromX, fromY,
    toX, toY,
    elapsed: 0,
    duration: MIRROR_TWEEN_MS / 1000

}

// Called from main loop each frame. Returns true if any tween is active.
function updateMirrorTweens(dt) {
  let anyActive = false;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt;
    const t = Math.min(tw.elapsed / tw.duration, 1);
    const e = easeOut(t);

    const x = tw.fromX + (tw.toX - tw.fromX) * e;
    const y = tw.fromY + (tw.toY - tw.fromY) * e;
    tw.mirror.mesh.position.x = x;
    tw.mirror.mesh.position.y = y;

    // During tween, update geometry based on interpolated position
    // so beam sweeps smoothly
    const halfLen = tw.mirror.length / 2;
    const cos = Math.cos(tw.mirror.angle);
    const sin = Math.sin(tw.mirror.angle);
    tw.mirror.p1 = { x: x - halfLen * cos, y: y - halfLen * sin };
    tw.mirror.p2 = { x: x + halfLen * cos, y: y + halfLen * sin };
    tw.mirror.normal = { x: -sin, y: cos };

    markDirty(); // re-solve beam every frame during tween
    anyActive = true;

    if (t >= 1) {
      // Tween complete — snap to final position
      updateMirrorGeometry(tw.mirror);
      tweens.splice(i, 1);
    }
  }
  return anyActive;
}

// Move mirror to a new socket with tween
function moveMirrorToSocket(mirror, newSocketIndex) {
  const oldIndex = mirror.socketIndex;
  const targetSocket = sockets[newSocketIndex];

  // Capture current visual position for tween start
  const fromX = mirror.mesh.position.x;
  const fromY = mirror.mesh.position.y;

  if (targetSocket.type !== null && targetSocket.objectRef !== mirror) {
    const other = targetSocket.objectRef;
    sockets[oldIndex].type = targetSocket.type;
    sockets[oldIndex].objectRef = other;
    if (other.socketIndex !== undefined) {
      other.socketIndex = oldIndex;
      const [ox, oy] = SOCKET_POSITIONS[oldIndex];
      if (other.mesh) other.mesh.position.set(ox, oy, 0);
      if (other.p1) updateMirrorGeometry(other);
      if (other.position) {
        other.position.x = ox;
        other.position.y = oy;
      }
    }
  } else {
    sockets[oldIndex].type = null;
    sockets[oldIndex].objectRef = null;
  }

  sockets[newSocketIndex].type = 'mirror';
  sockets[newSocketIndex].objectRef = mirror;
  mirror.socketIndex = newSocketIndex;

  // Start tween from dragged position to target socket
  startTween(mirror, fromX, fromY);
  markDirty();
}

function rotateMirror(mirror, newAngle) {
  mirror.angle = newAngle;
  updateMirrorGeometry(mirror);
  markDirty();
}

function damageMirror(mirror) {
  if (mirror.shattered) return;
  mirror.hits++;
  if (mirror.hits >= MIRROR_MAX_HITS && !mirror.reinforced) {
    mirror.shattered = true;
    mirror.mesh.material.color.setHex(0x330000);
    mirror.mesh.material.opacity = 0.3;
    mirror.mesh.material.transparent = true;
    markDirty();
  } else {
    const darkness = 1 - (mirror.hits / MIRROR_MAX_HITS) * 0.4;
    mirror.mesh.material.color.setRGB(0.53 * darkness, 0.53 * darkness, 0.8 * darkness);
  }
}

function repairMirror(mirror) {
  mirror.hits = 0;
  mirror.shattered = false;
  mirror.mesh.material.color.setHex(0x8888cc);
  mirror.mesh.material.opacity = 1.0;
  mirror.mesh.material.transparent = false;
  markDirty();
}

function updateAllMirrorGeometries() {
  for (const mirror of mirrors) {
    updateMirrorGeometry(mirror);
  }
}

// Reset all mirrors to default positions, angles, and states
function resetMirrors() {
  for (let i = 0; i < mirrors.length; i++) {
    const mirror = mirrors[i];
    const socketIdx = DEFAULT_MIRROR_SOCKETS[i];
    const [sx, sy] = SOCKET_POSITIONS[socketIdx];
    // Reset socket occupancy
    sockets[mirror.socketIndex].type = null;
    sockets[mirror.socketIndex].objectRef = null;
    // Restore to default socket
    mirror.socketIndex = socketIdx;
    mirror.freeX = sx;
    mirror.freeY = sy;
    mirror.angle = (i === 1) ? Math.PI / 2 : 0; // flanks horizontal, centre vertical
    mirror.hits = 0;
    mirror.shattered = false;
    mirror.reinforced = false;
    mirror.anchored = false;
    mirror.mesh.material.color.setHex(0x8888cc);
    mirror.mesh.material.opacity = 1.0;
    mirror.mesh.material.transparent = false;
    mirror.mesh.visible = true;
    sockets[socketIdx].type = 'mirror';
    sockets[socketIdx].objectRef = mirror;
    updateMirrorGeometry(mirror);
  }
}

// ============================================================
// src/prism.js — Prism: fixed infrastructure at (0, PRISM_Y)
// Not draggable. Splits the white sun beam into coloured bands.
// ============================================================





const prisms = [];
const PRISM_RADIUS = 2.5;
let activeTier = DEFAULT_PRISM_TIER;

function getPrisms() { return prisms; }
function getActiveTier() { return activeTier; }
function getActiveTierData() { return PRISM_TIERS[activeTier]; }

function setTier(newTier) {
  activeTier = newTier;
  markDirty();
}

function resetTier() { activeTier = DEFAULT_PRISM_TIER; }

function resetPrisms() {
  // Prism is fixed — just reset tier
  activeTier = DEFAULT_PRISM_TIER;
  markDirty();
}

function initPrisms() {
  if (prisms.length > 0) return; // already placed, don't duplicate
  const scene = getScene();
  const x = 0;
  const y = PRISM_Y;

  const r = PRISM_RADIUS;
  const group = new THREE.Group();
  group.position.set(x, y, 0.2);

  // Diamond shape: 4 facet triangles
  const verts = [
    { x: 0, y: r },
    { x: r, y: 0 },
    { x: 0, y: -r },
    { x: -r, y: 0 },
  ];
  const facetColours = [0xddeeff, 0xbbddee, 0xaaccdd, 0xccddee];
  const bottomTints = [null, null, 0xffe9a0, 0xff8c1a];
  for (let i = 0; i < 4; i++) {
    const a = verts[i];
    const b = verts[(i + 1) % 4];
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(a.x, a.y);
    shape.lineTo(b.x, b.y);
    shape.closePath();
    const geo = new THREE.ShapeGeometry(shape);
    const col = bottomTints[i] || facetColours[i];
    const mat = new THREE.MeshBasicMaterial({
      color: col, transparent: true,
      opacity: i >= 2 ? 0.7 : 0.85,
    });
    const facetMesh = new THREE.Mesh(geo, mat);
    facetMesh.position.z = 0.01 * i;
    group.add(facetMesh);
  }

  // Internal glow
  const glowGeo = new THREE.PlaneGeometry(r * 1.4, r * 1.4);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xddeeff, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const glowMesh = new THREE.Mesh(glowGeo, glowMat);
  glowMesh.position.z = -0.05;
  group.add(glowMesh);

  scene.add(group);

  const prism = {
    id: 0,
    position: { x: x, y: y },
    radius: PRISM_RADIUS,
    mesh: group,
    glowMat,
  };
  prisms.push(prism);
  markDirty();
}

// Update prism glow based on beam activity
function updatePrismGlow(segments) {
  for (const prism of prisms) {
    if (!prism.glowMat) continue;
    let lit = false;
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      const dx = seg.end.x - prism.position.x;
      const dy = seg.end.y - prism.position.y;
      if (dx * dx + dy * dy < prism.radius * prism.radius * 2) {
        lit = true;
        break;
      }
    }
    prism.glowMat.opacity = lit ? 0.5 + 0.2 * Math.sin(performance.now() * 0.005) : 0.15;
  }
}

// ============================================================
// src/enemy.js — Ships spawn at top, descend toward wall at bottom
// ============================================================





const pool = [];
let enemyGroup = null;
const shipTextures = {};

// --- Procedural ship sprite generation (drawn to canvas at load) ---
function generateShipTextures() {
  const types = ['skiff', 'trireme', 'quadrireme', 'shieldbearer', 'flagship'];
  for (const type of types) {
    const sz = 128;
    const c = document.createElement('canvas');
    c.width = sz; c.height = sz;
    const ctx = c.getContext('2d');
    drawShip(ctx, sz, type);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    shipTextures[type] = tex;
  }
}

function drawShip(ctx, sz, type) {
  const cx = sz / 2;
  const cy = sz / 2;
  ctx.clearRect(0, 0, sz, sz);

  // Ship type variations
  const configs = {
    skiff:        { hullW: 0.55, hullH: 0.18, prowLen: 0.12, mastH: 0.40, sailW: 0.35, sailH: 0.30, oars: 0, stripe: '#8B4513', hullCol: '#6B4226', deckCol: '#9E6B3E' },
    trireme:      { hullW: 0.65, hullH: 0.20, prowLen: 0.15, mastH: 0.30, sailW: 0.18, sailH: 0.15, oars: 5, stripe: '#C41E3A', hullCol: '#5C3317', deckCol: '#8B6B4A' },
    quadrireme:   { hullW: 0.72, hullH: 0.22, prowLen: 0.16, mastH: 0.30, sailW: 0.20, sailH: 0.15, oars: 7, stripe: '#1E5631', hullCol: '#4A2B10', deckCol: '#7A5B3A' },
    shieldbearer: { hullW: 0.68, hullH: 0.22, prowLen: 0.14, mastH: 0.28, sailW: 0.16, sailH: 0.12, oars: 5, stripe: '#CC8844', hullCol: '#5C3317', deckCol: '#8B6B4A' },
    flagship:     { hullW: 0.80, hullH: 0.25, prowLen: 0.18, mastH: 0.55, sailW: 0.50, sailH: 0.40, oars: 0, stripe: '#DAA520', hullCol: '#3D1F00', deckCol: '#6B4226' },
  };
  const cfg = configs[type] || configs.skiff;

  const hullW = cfg.hullW * sz;
  const hullH = cfg.hullH * sz;
  const prowLen = cfg.prowLen * sz;
  const mastH = cfg.mastH * sz;
  const sailW = cfg.sailW * sz;
  const sailH = cfg.sailH * sz;

  // Hull (pointed prow at top, flat stern at bottom)
  const hullTop = cy - hullH * 0.3;
  const hullBot = cy + hullH * 0.7;
  const prowTip = hullTop - prowLen;

  ctx.save();

  // Hull body with carved prow
  ctx.beginPath();
  ctx.moveTo(cx, prowTip);                          // prow tip (top centre)
  ctx.quadraticCurveTo(cx + hullW * 0.3, hullTop, cx + hullW / 2, hullTop + hullH * 0.3); // right bow curve
  ctx.lineTo(cx + hullW / 2, hullBot - 4);         // right side
  ctx.quadraticCurveTo(cx + hullW * 0.4, hullBot, cx, hullBot); // stern curve right
  ctx.quadraticCurveTo(cx - hullW * 0.4, hullBot, cx - hullW / 2, hullBot - 4); // stern curve left
  ctx.lineTo(cx - hullW / 2, hullTop + hullH * 0.3); // left side
  ctx.quadraticCurveTo(cx - hullW * 0.3, hullTop, cx, prowTip); // left bow curve
  ctx.closePath();
  ctx.fillStyle = cfg.hullCol;
  ctx.fill();

  // Deck (lighter inner area)
  ctx.beginPath();
  const deckInset = 4;
  ctx.ellipse(cx, cy + 2, hullW / 2 - deckInset, hullH * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = cfg.deckCol;
  ctx.fill();

  // Painted stripe along the hull sides
  ctx.strokeStyle = cfg.stripe;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - hullW / 2 + 3, cy);
  ctx.lineTo(cx - hullW * 0.2, hullTop + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + hullW / 2 - 3, cy);
  ctx.lineTo(cx + hullW * 0.2, hullTop + 6);
  ctx.stroke();

  // Oar strokes along sides
  ctx.strokeStyle = 'rgba(90, 60, 30, 0.7)';
  ctx.lineWidth = 1;
  const oarStartY = cy - hullH * 0.1;
  const oarEndY = cy + hullH * 0.5;
  const oarSpacing = (oarEndY - oarStartY) / (cfg.oars + 1);
  for (let i = 1; i <= cfg.oars; i++) {
    const oy = oarStartY + i * oarSpacing;
    // Left oar
    ctx.beginPath();
    ctx.moveTo(cx - hullW / 2, oy);
    ctx.lineTo(cx - hullW / 2 - 8, oy + 3);
    ctx.stroke();
    // Right oar
    ctx.beginPath();
    ctx.moveTo(cx + hullW / 2, oy);
    ctx.lineTo(cx + hullW / 2 + 8, oy + 3);
    ctx.stroke();
  }

  // Mast
  ctx.fillStyle = '#3D2010';
  ctx.fillRect(cx - 1.5, cy - mastH, 3, mastH * 0.9);

  // Sail (trapezoid/triangle)
  ctx.fillStyle = 'rgba(230, 215, 190, 0.85)';
  ctx.beginPath();
  ctx.moveTo(cx - sailW / 2, cy - mastH * 0.2);
  ctx.lineTo(cx + sailW / 2, cy - mastH * 0.2);
  ctx.lineTo(cx + sailW * 0.3, cy - mastH * 0.85);
  ctx.lineTo(cx - sailW * 0.3, cy - mastH * 0.85);
  ctx.closePath();
  ctx.fill();
  // Sail cross-bar
  ctx.strokeStyle = '#3D2010';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - sailW / 2, cy - mastH * 0.2);
  ctx.lineTo(cx + sailW / 2, cy - mastH * 0.2);
  ctx.stroke();

  // Prow ornament (small ram/beak)
  ctx.fillStyle = '#2A1500';
  ctx.beginPath();
  ctx.moveTo(cx, prowTip - 3);
  ctx.lineTo(cx - 3, prowTip + 4);
  ctx.lineTo(cx + 3, prowTip + 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function initEnemies() {
  const scene = getScene();
  enemyGroup = new THREE.Group();
  scene.add(enemyGroup);

  // Generate ship sprite textures (procedural canvas, no image files)
  generateShipTextures();

  for (let i = 0; i < ENEMY_POOL_SIZE; i++) {
    const mesh = new THREE.Group();
    mesh.position.z = 0.3;

    // Ship sprite (canvas-drawn, swapped per type)
    const spriteGeo = new THREE.PlaneGeometry(6, 6);
    const spriteMat = new THREE.MeshBasicMaterial({
      map: shipTextures.skiff, transparent: true, depthWrite: false
    });
    const spriteMesh = new THREE.Mesh(spriteGeo, spriteMat);
    spriteMesh.position.z = 0.01;
    mesh.add(spriteMesh);

    mesh.visible = false;

    // Burn meter bar
    const barBg = new THREE.Mesh(
      new THREE.PlaneGeometry(5, 0.8),
      new THREE.MeshBasicMaterial({ color: 0x111111 })
    );
    barBg.position.y = -2.5;
    barBg.position.z = 0.1;
    mesh.add(barBg);
    const barFill = new THREE.Mesh(
      new THREE.PlaneGeometry(5, 0.8),
      new THREE.MeshBasicMaterial({ color: 0xff4400 })
    );
    barFill.position.y = -2.5;
    barFill.position.z = 0.15;
    barFill.scale.x = 0;
    mesh.add(barFill);

    // Shield plate (visible only on shield-bearer type)
    const shieldPlate = new THREE.Mesh(
      new THREE.PlaneGeometry(4.5, 1.2),
      new THREE.MeshBasicMaterial({ color: 0xCC8844, transparent: true, opacity: 0.9 })
    );
    shieldPlate.position.y = 2.8;
    shieldPlate.position.z = 0.06;
    shieldPlate.visible = false;
    mesh.add(shieldPlate);

    // Oars (3 per side, animated at runtime for oared ships)
    const oarMeshes = [];
    const OAR_COUNT = 3;
    const oarMat = new THREE.MeshBasicMaterial({ color: 0x5C3D2E });
    for (let side = -1; side <= 1; side += 2) {
      for (let oi = 0; oi < OAR_COUNT; oi++) {
        const oarGeo = new THREE.PlaneGeometry(0.2, 1.6);
        const oar = new THREE.Mesh(oarGeo, oarMat);
        // Position: along hull sides, spread vertically
        oar.position.x = side * 2.2;
        oar.position.y = oi * 0.8 - (OAR_COUNT * 0.8) / 2;
        oar.position.z = -0.02; // BEHIND the hull sprite
        oar.rotation.z = side * 0.3; // angled outward
        oar.visible = false;
        mesh.add(oar);
        oarMeshes.push({ mesh: oar, side, index: oi });
      }
    }

    enemyGroup.add(mesh);
    pool.push({
      active: false, type: 'skiff',
      hp: 0, maxHp: 0, armour: 0, heat: 0,
      lane: 0, y: SHIP_SPAWN_Y,
      speed: 0, baseSpeed: 0,
      burn: 0, slowed: false,
      bandsHitting: 0, lastHitColour: 0,
      mesh, barFill, shieldPlate, oarMeshes, spriteMat, hullMat: spriteMat
    });
  }
}

function getEnemyPool() { return pool; }

function spawnEnemy(type, lane, hpMultiplier, yOffset) {
  const template = ENEMY_TYPES[type];
  if (!template) return null;
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) {
      e.active = true;
      e.type = type;
      e.maxHp = template.hp * hpMultiplier;
      e.hp = e.maxHp;
      e.armour = template.armour;
      e.shieldAngle = template.shieldAngle || 0;
      e.shieldBlocking = false;
      e.stunTimer = 0;
      e.propulsion = template.propulsion || 'oared';
      e.oarPhase = Math.random() * Math.PI * 2; // random start phase
      e.driftX = 0;
      e.lane = lane;
      e.y = SHIP_SPAWN_Y + (yOffset || 0);
      e.speed = template.speed;
      e.baseSpeed = template.speed;
      e.burn = 0;
      e.heat = 0;
      e.slowed = false;
      e.bandsHitting = 0;
      e.lastHitColour = 0;
      e.mesh.visible = true;
      e.barFill.scale.x = 0;
      positionEnemy(e);
      updateEnemyVisual(e);
      return e;
    }
  }
  return null;
}

// Ships move DOWNWARD (negative Y)
function updateEnemies(dt) {
  let wallDamage = 0;
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;
    e.slowed = false;
    // Zeus stun: skip movement while stunned
    if (e.stunTimer && e.stunTimer > 0) {
      e.stunTimer -= dt;
    } else {
      e.y -= e.speed * dt; // descend
    }

    // Propulsion animation
    if (e.propulsion === 'oared') {
      // Oar cycle: slow synchronized stroke (period ~2s)
      e.oarPhase += dt * 3.2; // ~2s full cycle
      // Hull rock: once per two strokes, ±1.5 degrees (slower, less twitchy)
      e.mesh.rotation.z = Math.sin(e.oarPhase * 0.5) * 0.026;
      e.driftX = 0;
    } else {
      // Sailed: gentle lateral drift (slow sinusoid)
      e.oarPhase += dt * 1.2;
      e.driftX = Math.sin(e.oarPhase) * 0.8; // gentle sway
      e.mesh.rotation.z = Math.sin(e.oarPhase * 0.7) * 0.015; // very slight roll
    }

    if (e.y <= WALL_Y) {
      // Breach: ship reached the wall
      const dmg = BREACH_DAMAGE[e.type] || 10;
      const heatFrac = Math.min(1, (e.heat || 0) / e.maxHp);
      wallDamage += dmg * Math.max(0.2, 1 - heatFrac);
      deactivateEnemy(e);
      continue;
    }
    positionEnemy(e);
    updateEnemyVisual(e);
  }
  return wallDamage;
}

function applyGoldSlow(enemy) { enemy.slowed = true; }

// Wind state: affects sailed ships more than oared
let windActive = false;
const WIND_SAIL_SLOW = 0.35;  // sailed ships slowed to 35% speed
const WIND_OAR_SLOW = 0.85;  // oared ships barely affected (85%)

function setWindActive(active) { windActive = active; }
function isWindActive() { return windActive; }

function applySlowStates() {
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;
    let speedMult = 1.0;
    if (e.slowed) speedMult *= 0.5; // gold beam slow
    if (windActive) {
      speedMult *= (e.propulsion === 'sailed') ? WIND_SAIL_SLOW : WIND_OAR_SLOW;
    }
    e.speed = e.baseSpeed * speedMult;
  }
}

function deactivateEnemy(enemy) {
  enemy.active = false;
  enemy.mesh.visible = false;
}

function triggerKillEffect(enemy, reward) {
  addKillReward(reward);
  if (enemy.hullMat) enemy.hullMat.color.setHex(0xffffff);
}

function getActiveEnemies() { return pool.filter(e => e.active); }

function resetEnemies() {
  for (let i = 0; i < pool.length; i++) {
    pool[i].active = false;
    pool[i].mesh.visible = false;
  }
}

function positionEnemy(e) {
  const worldWidth = getWorldWidth();
  const laneWidth = worldWidth / ENEMY_LANE_COUNT;
  const x = -worldWidth / 2 + laneWidth * (e.lane + 0.5);
  e.mesh.position.x = x + (e.driftX || 0);
  e.mesh.position.y = e.y;
}

function updateEnemyVisual(e) {
  e.burn = Math.max(0, (e.heat || 0) / e.maxHp);
  e.barFill.scale.x = e.burn;
  e.barFill.position.x = -2.5 * (1 - e.burn);

  // Swap sprite texture to match type
  const tex = shipTextures[e.type] || shipTextures.skiff;
  if (e.spriteMat.map !== tex) {
    e.spriteMat.map = tex;
    e.spriteMat.needsUpdate = true;
  }

  // Burn tint on sprite
  if (e.bandsHitting > 0 && e.lastHitColour !== 0) {
    const r = ((e.lastHitColour >> 16) & 0xff) / 255;
    const g = ((e.lastHitColour >> 8) & 0xff) / 255;
    const b = (e.lastHitColour & 0xff) / 255;
    const t = Math.min(0.3 + e.burn * 0.7, 1.0);
    e.spriteMat.color.setRGB(1*(1-t)+r*t, 1*(1-t)+g*t, 1*(1-t)+b*t);
  } else if (e.slowed) {
    e.spriteMat.color.setRGB(0.7, 0.9, 0.5);
  } else {
    e.spriteMat.color.setRGB(1, 1, 1); // neutral (texture has its own colours)
  }

  const sizes = { skiff: 2.5, trireme: 3.5, quadrireme: 4.5, shieldbearer: 4.0, flagship: 8 };
  const s = sizes[e.type] || 3;
  e.mesh.scale.set(s/3, s/3, 1);
  // Shield plate visibility
  if (e.shieldPlate) e.shieldPlate.visible = (e.type === 'shieldbearer');

  // Oar animation (oared ships only)
  if (e.oarMeshes) {
    const isOared = e.propulsion === 'oared';
    for (const oarObj of e.oarMeshes) {
      oarObj.mesh.visible = isOared;
      if (isOared) {
        // Synchronized rowing stroke: rotate oars in unison
        const stroke = Math.sin(e.oarPhase + oarObj.index * 0.3);
        oarObj.mesh.rotation.z = oarObj.side * (0.3 + stroke * 0.4);
      }
    }
  }
}

// Phase 2 (60-180s): Mixed, shield-bearer escorts every 20s.

// Phase 4 (540-600s): Flagship.
// ============================================================




const PHASE1_INTERVAL = 2.5;
const PHASE2_INTERVAL = 1.5;
const PHASE3_INTERVAL = 1.2;
const INITIAL_DELAY = 2.0;

// Shield-bearer escort: tight column with 6-unit Y spacing
const ESCORT_SPACING = 6;

let spawnTimer = 0;
let spawnerElapsed = 0;
let totalSpawns = 0;
let flagshipSpawned = false;
let shieldBearerTimer = 0;
let firstShieldSpawned = false;
let shieldBearerLaneIndex = 0; // cycles through lanes

function getSpawnCount() { return totalSpawns; }
function getCurrentInterval() { return getInterval(); }

function updateSpawner(dt, sessionTime) {
  spawnerElapsed = sessionTime;
  spawnTimer -= dt;
  if (spawnTimer <= 0 && spawnerElapsed >= INITIAL_DELAY) {
    doSpawn();
    totalSpawns++;
    spawnTimer = getInterval();
  }

  // Shield-bearer + escort spawning (separate timer)
  if (!firstShieldSpawned && spawnerElapsed >= 30) {
    firstShieldSpawned = true;
    // First one: alone in centre (the lesson — isolated, readable)
    spawnShieldFormation(2, 1.0);
    shieldBearerTimer = 20;
  } else if (firstShieldSpawned && spawnerElapsed >= 60) {
    shieldBearerTimer -= dt;
    if (shieldBearerTimer <= 0) {
      shieldBearerTimer = 20;
      const hpMult = 1 + (spawnerElapsed / SESSION_DURATION) * ESCALATION_HP_FACTOR;
      // Alternate through all 5 lanes
      const lane = getNextShieldLane();
      spawnShieldFormation(lane, hpMult);
    }
  }
}

// Spawn shield-bearer leading 2-3 escorts in tight column
function spawnShieldFormation(lane, hpMult) {
  // Leader
  spawnEnemy('shieldbearer', lane, hpMult, 0);
  // 2 trailing ships (skiffs early, triremes later)
  const escortType = spawnerElapsed < PHASE_2_END ? 'skiff' : 'trireme';
  const escortCount = spawnerElapsed < PHASE_2_END ? 2 : 3;
  for (let i = 1; i <= escortCount; i++) {
    spawnEnemy(escortType, lane, hpMult, ESCORT_SPACING * i);
  }
}

// Cycle shield-bearer through lanes: 2, 0, 4, 1, 3, repeat
function getNextShieldLane() {
  const order = [2, 0, 4, 1, 3];
  const lane = order[shieldBearerLaneIndex % order.length];
  shieldBearerLaneIndex++;
  return lane;
}

function resetSpawner() {
  spawnTimer = INITIAL_DELAY;
  spawnerElapsed = 0;
  totalSpawns = 0;
  flagshipSpawned = false;
  shieldBearerTimer = 0;
  firstShieldSpawned = false;
  shieldBearerLaneIndex = 0;
}

function getInterval() {
  if (spawnerElapsed < PHASE_1_END) return PHASE1_INTERVAL;
  if (spawnerElapsed < PHASE_2_END) return PHASE2_INTERVAL;
  return PHASE3_INTERVAL;
}

function doSpawn() {
  const hpMult = 1 + (spawnerElapsed / SESSION_DURATION) * ESCALATION_HP_FACTOR;

  if (spawnerElapsed >= PHASE_3_END && !flagshipSpawned) {
    // Flagship: random lane, drifts laterally (handled in enemy update if desired)
    const bossLane = Math.floor(Math.random() * ENEMY_LANE_COUNT);
    spawnEnemy('flagship', bossLane, 1.0);
    flagshipSpawned = true;
    return;
  }

  // All phases: use full lane range for all types
  const lane = Math.floor(Math.random() * ENEMY_LANE_COUNT);

  if (spawnerElapsed < PHASE_1_END) {
    // Phase 1: skiffs on random lanes
    spawnEnemy('skiff', lane, hpMult);
  } else if (spawnerElapsed < PHASE_2_END) {
    // Phase 2: mix of types across all lanes
    const roll = Math.random();
    if (roll < 0.25) {
      spawnEnemy('quadrireme', lane, hpMult);
    } else if (roll < 0.55) {
      spawnEnemy('trireme', lane, hpMult);
    } else {
      spawnEnemy('skiff', lane, hpMult);
    }
    // Paired pressure every 5th spawn on random opposite lanes
    if (totalSpawns % 5 === 0) {
      const pairA = Math.floor(Math.random() * 2);       // 0 or 1
      const pairB = ENEMY_LANE_COUNT - 1 - pairA;        // 4 or 3
      spawnEnemy('skiff', pairA, hpMult);
      spawnEnemy('skiff', pairB, hpMult);
    }
  } else {
    // Phase 3: heavy across all lanes
    const roll = Math.random();
    if (roll < 0.35) {
      spawnEnemy('quadrireme', lane, hpMult);
    } else if (roll < 0.65) {
      spawnEnemy('trireme', lane, hpMult);
    } else {
      spawnEnemy('skiff', lane, hpMult);
    }
    // Paired heavy pressure every 4th spawn
    if (totalSpawns % 4 === 0) {
      const pairA = Math.floor(Math.random() * 2);       // 0 or 1
      const pairB = ENEMY_LANE_COUNT - 1 - pairA;        // 4 or 3
      spawnEnemy('trireme', pairA, hpMult);
      spawnEnemy('trireme', pairB, hpMult);
    }
  }
}
