<body>
<div id="intro-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;">
  <video id="intro-video" src="./assets/fixed_intro.mp4?v=4" poster="./assets/intro_poster.jpg?v=4"
         playsinline webkit-playsinline preload="auto"
         style="max-width:100%;max-height:100%;object-fit:contain;"></video>
  <div id="intro-tap" style="position:absolute;bottom:15%;color:#fff;font:bold 16px monospace;opacity:0.8;pointer-events:none;">Tap to begin</div>
</div>
<div id="win-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:99998;background:#000;display:none;pointer-events:none;align-items:center;justify-content:center;">
  <video id="win-video" playsinline webkit-playsinline preload="none"
         style="max-width:100%;max-height:100%;object-fit:contain;"></video>
</div>
<script src="./vendor/three.min.js"></script>
<script>
// THREE is available as a global from the vendor script above

// --- Intro video layer ---
(function() {
  var layer = document.getElementById('intro-layer');
  var video = document.getElementById('intro-video');
  var tapMsg = document.getElementById('intro-tap');
  var started = false;
  var gameStarted = false;
  var debugMode = window.location.search.indexOf('debug=1') > -1;
  var debugEl = null;

  if (debugMode) {
    debugEl = document.createElement('div');
    debugEl.style.cssText = 'position:fixed;bottom:10px;left:10px;color:lime;font:11px monospace;z-index:999999;background:rgba(0,0,0,0.8);padding:6px;white-space:pre;';
    document.body.appendChild(debugEl);
  }
  updateDebugInfo('loading video');

  // Force layout so video has real dimensions (iOS refuses zero-size play)
  void video.offsetHeight;

  // On iOS, video won't load until a user gesture, so we allow tap immediately.
  // play() in the gesture handler will trigger load+play in one step.

  // --- TAP HANDLER ---
  layer.addEventListener('pointerdown', function() {
    if (started) return;
    started = true;
    // Strategy: start muted (always succeeds from gesture), then unmute immediately.
    // Chrome rejects unmuted play() on low-engagement sites, but allows unmuting
    // a playing video within the same user activation.
    video.muted = true;
    var playPromise = video.play();
    tapMsg.style.display = 'none';
    if (playPromise && playPromise.then) {
      playPromise.then(function() {
        // Unmute now — still within the user activation microtask chain
        video.muted = false;
        updateDebugInfo('video playing, unmuted');
      }).catch(function(err) {
        updateDebugInfo('play() failed entirely: ' + err.name);
        startGame();
      });
    } else {
      // Older browser, no promise — just unmute
      video.muted = false;
    }
    // Failsafe — ONLY start the game early if the video genuinely failed to
    // begin playing. We check playback PROGRESS at 4s: if it's still stuck near
    // the start (paused / no advance), the video didn't play, so hand off.
    // If it IS playing we leave it alone so the full narration (~10.5s) is heard
    // to the end — previously this fired unconditionally at 5s and cut the
    // opening line off mid-sentence at "According to...".
    setTimeout(function() {
      if (gameStarted) return;
      var stuck = video.paused || video.currentTime < 0.3 || video.readyState < 2;
      if (stuck) {
        updateDebugInfo('FAILSAFE: video stuck');
        startGame();
      }
    }, 4000);
  });

  video.addEventListener('ended', startGame);
  // Narration runs to ~10.5s (file is 10.6s). Let video play to end naturally.
  // No early timeupdate transition — the 'ended' event above handles handoff.
  video.addEventListener('error', function() {
    updateDebugInfo('video error');
    startGame();
  });
  // If video stalls for too long, start the game
  video.addEventListener('stalled', function() {
    updateDebugInfo('video stalled');
    setTimeout(function() { if (!gameStarted) startGame(); }, 3000);
  });

  // Skip by tapping during playback
  video.addEventListener('pointerdown', function(e) {
    if (started && !video.ended && !gameStarted) {
      e.stopPropagation();
      video.pause();
      startGame();
    }
  });

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    layer.style.display = 'none';
    try {
      if (typeof init === 'function') init();
      updateDebugInfo('startGame OK');
    } catch(e) {
      updateDebugInfo('init ERROR: ' + e.message);
    }
  }

  function updateDebugInfo(msg) {
    if (!debugEl) return;
    debugEl.textContent = 'DEBUG ' + msg + ' | vidReady=' + (video ? video.readyState : '?') + ' | game=' + gameStarted;
  }
})();

// --- Defeat: fully in-engine (no video) ---
// The defeat cinematic was removed. Defeat is handled entirely in-engine by
// session.js (dark-red dim + debris + fade-in stats overlay). This no-op stub
// remains only so any stray caller degrades gracefully to the in-engine screen.
window.playDefeatCinematic = function(onDone) { if (typeof onDone === 'function') onDone(); };

// --- Win video layer ---
// Plays on every win. Skippable. Falls back to victory screen on any failure.
(function() {
  var winLayer = document.getElementById('win-layer');
  var winVideo = document.getElementById('win-video');
  var winActive = false;
  var winDone = false;

  // Preload: start fetching a few seconds into gameplay
  setTimeout(function() {
    winVideo.src = './assets/archimed_win.mp4?v=4';
    winVideo.load();
  }, 8000);

  // Exposed globally so session.js triggerWin can call it
  window.playWinCinematic = function(onDone) {
    if (winActive) { onDone(); return; }
    winActive = true;
    winDone = false;

    var finish = function() {
      if (winDone) return;
      winDone = true;
      winVideo.pause();
      winLayer.style.display = 'none';
      winLayer.style.pointerEvents = 'none'; // stop intercepting taps
      winActive = false;
      onDone();
    };

    // If video not ready, skip straight to victory screen
    if (!winVideo.src || winVideo.readyState < 2) {
      finish();
      return;
    }

    // Show layer and play (enable pointer-events only while playing, for skip tap)
    winLayer.style.display = 'flex';
    winLayer.style.pointerEvents = 'auto';
    winLayer.style.background = '#000';
    winVideo.muted = true;
    var playPromise = winVideo.play();
    if (playPromise && playPromise.then) {
      playPromise.then(function() { winVideo.muted = false; })
        .catch(function() { finish(); });
    } else {
      winVideo.muted = false;
    }

    // Narration runs to ~8.0s (file is 8.3s). Let video play to end.
    // 'ended' event below handles handoff.

    // Fallbacks
    winVideo.addEventListener('ended', finish);
    winVideo.addEventListener('error', finish);

    // Skip on tap
    winLayer.addEventListener('pointerdown', function skipTap() {
      winLayer.removeEventListener('pointerdown', skipTap);
      finish();
    });

    // Failsafe: 12s max
    setTimeout(function() { if (!winDone) finish(); }, 12000);
  };
})();

// === src/renderer.js ===
// ============================================================
// src/renderer.js — Three.js scene, orthographic camera, resize
// Fixed 9:16 portrait render target with letterboxing.
// Two-pass rendering: main scene + overlay scene (always on top).
// ============================================================



const TARGET_ASPECT = 9 / 16;

let scene, camera, renderer, worldWidth;
// Overlay scene renders on top of main scene (second pass, no depth issues)
let overlayScene, overlayCamera;

function initRenderer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080808);

  worldWidth = WORLD_HEIGHT * TARGET_ASPECT;
  const hw = worldWidth / 2;
  const hh = WORLD_HEIGHT / 2;

  camera = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 100);
  camera.position.z = 50;

  // Overlay scene (no background, renders on top)
  overlayScene = new THREE.Scene();
  overlayCamera = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 100);
  overlayCamera.position.z = 50;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.autoClear = false; // we manage clearing manually for two-pass
  document.body.appendChild(renderer.domElement);

  applyLetterbox();
  window.addEventListener('resize', applyLetterbox);
}

function applyLetterbox() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const winAspect = winW / winH;

  let canvasW, canvasH;
  if (winAspect > TARGET_ASPECT) {
    canvasH = winH;
    canvasW = Math.floor(winH * TARGET_ASPECT);
  } else {
    canvasW = winW;
    canvasH = Math.floor(winW / TARGET_ASPECT);
  }

  renderer.setSize(canvasW, canvasH);

  const el = renderer.domElement;
  el.style.position = 'absolute';
  el.style.left = Math.floor((winW - canvasW) / 2) + 'px';
  el.style.top = Math.floor((winH - canvasH) / 2) + 'px';
}

function getScene() { return scene; }
function getOverlayScene() { return overlayScene; }
function getCamera() { return camera; }
function getRenderer() { return renderer; }
function getWorldWidth() { return worldWidth; }

function render(shake) {
  // Optional camera shake (e.g. wall damage): nudge the main camera, render,
  // then restore. The overlay camera is left steady so the HUD doesn't jitter.
  const ox = shake ? shake.x : 0;
  const oy = shake ? shake.y : 0;
  if (ox || oy) { camera.position.x = ox; camera.position.y = oy; }
  renderer.clear();
  renderer.render(scene, camera);
  if (ox || oy) { camera.position.x = 0; camera.position.y = 0; }
  // Second pass: overlay scene renders on top without clearing
  renderer.clearDepth();
  renderer.render(overlayScene, overlayCamera);
}

function screenToWorld(sx, sy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((sx - rect.left) / rect.width) * 2 - 1;
  const ny = -((sy - rect.top) / rect.height) * 2 + 1;
  const hw = worldWidth / 2;
  const hh = WORLD_HEIGHT / 2;
  return { x: nx * hw, y: ny * hh };
}


// === src/background.js ===
// ============================================================
// src/background.js — Environment bands for reversed layout
//
// Sky strip at top, sea with vertical gradient from spawn to wall,
// foam shoreline at wall edge, warm stone city ground at bottom.
// All boundaries derived from gameplay constants.
// Scrolling wave crests via canvas texture offset.
// ============================================================




// Colours (all below 22% luminance — beams must remain brightest)
const COL_SKY = 0x0a1520;       // near-black blue
const COL_GROUND = 0x2E2419;    // warm dark stone
const COL_WALL = 0x554433;      // wall line

let seaMesh = null;
let seaTexture = null;
let seaCanvas = null;
let seaCtx = null;
let seaW = 64;
let seaH = 512;
let reduceMotion = false;
let waveOffset = 0;
let foamLine = null;
let foamPhase = 0;

function initBackground() {
  const scene = getScene();
  const ww = getWorldWidth();
  const hh = WORLD_HEIGHT / 2;

  if (typeof window.matchMedia === 'function') {
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // Band boundaries derived from layout constants
  const skyTop = hh;
  const skyBot = SHIP_SPAWN_Y + 2;
  const seaTop = skyBot;
  const seaBot = WALL_Y;
  const groundTop = WALL_Y;
  const groundBot = -hh;

  // --- 1. Sky strip ---
  const skyH = skyTop - skyBot;
  if (skyH > 0) {
    const skyGeo = new THREE.PlaneGeometry(ww + 4, skyH);
    const skyMat = new THREE.MeshBasicMaterial({ color: COL_SKY, depthWrite: false });
    const skyMeshObj = new THREE.Mesh(skyGeo, skyMat);
    skyMeshObj.position.set(0, skyBot + skyH / 2, -10);
    scene.add(skyMeshObj);
  }

  // --- 2. Sea band (gradient + animated wave texture) ---
  const seaH_world = seaTop - seaBot;

  // Sea canvas: vertical gradient + wave crests drawn procedurally
  seaCanvas = document.createElement('canvas');
  seaCanvas.width = seaW;
  seaCanvas.height = seaH;
  seaCtx = seaCanvas.getContext('2d');
  drawSeaBase(seaCtx, seaW, seaH);

  // Bake the wave crests into the texture ONCE, then animate via cheap UV
  // scrolling (texture.offset) instead of redrawing the canvas every frame.
  drawWaveCrests(seaCtx, seaW, seaH, 0);
  seaTexture = new THREE.CanvasTexture(seaCanvas);
  seaTexture.minFilter = THREE.LinearFilter;
  seaTexture.magFilter = THREE.LinearFilter;
  seaTexture.wrapS = THREE.RepeatWrapping;
  seaTexture.wrapT = THREE.RepeatWrapping;
  // Repeat vertically a bit so scrolling reveals continuous ripples.
  seaTexture.repeat.set(1, 1.5);

  const seaGeo = new THREE.PlaneGeometry(ww + 4, seaH_world);
  const seaMat = new THREE.MeshBasicMaterial({ map: seaTexture, depthWrite: false });
  seaMesh = new THREE.Mesh(seaGeo, seaMat);
  seaMesh.position.set(0, seaBot + seaH_world / 2, -10);
  scene.add(seaMesh);

  // --- 3. Shoreline foam (thin band at sea/ground boundary) ---
  const foamH = 1.2;
  const foamGeo = new THREE.PlaneGeometry(ww + 4, foamH);
  const foamMat = new THREE.MeshBasicMaterial({ color: 0x1a3a48, transparent: true, opacity: 0.7, depthWrite: false });
  const foamMesh = new THREE.Mesh(foamGeo, foamMat);
  foamMesh.position.set(0, WALL_Y + foamH / 2, -9.8);
  scene.add(foamMesh);

  // Bright white foam line: a soft glowing strip where the water washes against
  // the lower battlement. Its opacity breathes with the wave rhythm.
  const foamLineH = 0.6;
  const flCanvas = document.createElement('canvas');
  flCanvas.width = 64; flCanvas.height = 8;
  const flCtx = flCanvas.getContext('2d');
  const flGrad = flCtx.createLinearGradient(0, 0, 0, 8);
  flGrad.addColorStop(0, 'rgba(255,255,255,0)');
  flGrad.addColorStop(0.5, 'rgba(235,245,250,0.9)');
  flGrad.addColorStop(1, 'rgba(255,255,255,0)');
  flCtx.fillStyle = flGrad; flCtx.fillRect(0, 0, 64, 8);
  const flTex = new THREE.CanvasTexture(flCanvas);
  flTex.minFilter = THREE.LinearFilter;
  const foamLineGeo = new THREE.PlaneGeometry(ww + 4, foamLineH);
  const foamLineMat = new THREE.MeshBasicMaterial({ map: flTex, transparent: true, opacity: 0.6, depthWrite: false });
  foamLine = new THREE.Mesh(foamLineGeo, foamLineMat);
  foamLine.position.set(0, WALL_Y + 0.5, -9.6);
  scene.add(foamLine);

  // Thin foam edge
  const edgeH = 0.3;
  const edgeGeo = new THREE.PlaneGeometry(ww + 4, edgeH);
  const edgeMat = new THREE.MeshBasicMaterial({ color: 0x234858, transparent: true, opacity: 0.4, depthWrite: false });
  const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
  edgeMesh.position.set(0, WALL_Y + edgeH / 2, -9.7);
  scene.add(edgeMesh);

  // --- 4. City ground ---
  const groundH = groundTop - groundBot;
  const groundGeo = new THREE.PlaneGeometry(ww + 4, groundH);
  const groundMat = new THREE.MeshBasicMaterial({ color: COL_GROUND, depthWrite: false });
  const groundMeshObj = new THREE.Mesh(groundGeo, groundMat);
  groundMeshObj.position.set(0, groundBot + groundH / 2, -10);
  scene.add(groundMeshObj);

  // Wall line (breach boundary — subtle stone wall, not a red danger line)
  const wallGeo = new THREE.PlaneGeometry(ww + 4, 1.2);
  const wallMat = new THREE.MeshBasicMaterial({ color: COL_WALL, depthWrite: false });
  const wallMeshObj = new THREE.Mesh(wallGeo, wallMat);
  wallMeshObj.position.set(0, WALL_Y, -9.5);
  scene.add(wallMeshObj);
}

function updateBackground(dt) {
  if (!seaTexture || reduceMotion) return;

  // Cheap animated ripple: scroll the baked wave texture's UVs. A slight
  // secondary horizontal sway adds a shimmer so it doesn't look like a
  // straight conveyor. No per-frame canvas redraw.
  waveOffset += dt * 0.03; // UV units/sec (texture is normalised 0..1)
  seaTexture.offset.y = (seaTexture.offset.y + dt * 0.03) % 1;
  seaTexture.offset.x = Math.sin(waveOffset * 6) * 0.012;

  // Foam line breathes with the wave rhythm (in sync with the 0.1Hz sea audio
  // feel): opacity + a tiny vertical bob as the surf washes the stone.
  if (foamLine) {
    foamPhase += dt;
    foamLine.material.opacity = 0.45 + 0.35 * (0.5 + 0.5 * Math.sin(foamPhase * 0.8));
    foamLine.position.y = WALL_Y + 0.5 + Math.sin(foamPhase * 0.8) * 0.15;
  }
}

// --- Sea drawing ---

function drawSeaBase(ctx, w, h) {
  // Vertical DEPTH gradient (canvas top = spawn/open sea, bottom = battlement
  // harbour): deep Mediterranean azure up top fading to a brighter turquoise
  // harbour near the stone wall. Kept below the beam-brightness ceiling.
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.0, '#0a1a2e');  // deep dark azure (open sea, top/spawn)
  grad.addColorStop(0.35, '#123a52'); // mid azure
  grad.addColorStop(0.7, '#186b74');  // teal transition
  grad.addColorStop(1.0, '#1f8f8a');  // bright turquoise harbour (battlement)
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function drawWaveCrests(ctx, w, h, offset) {
  // 6 thin wave crest lines scrolling downward
  const NUM_CRESTS = 6;
  const spacing = h / NUM_CRESTS;

  ctx.save();
  for (let i = 0; i < NUM_CRESTS; i++) {
    const baseY = ((i * spacing + offset) % h);
    // Varying opacity per crest — a soft turquoise shimmer against the gradient.
    const alpha = 0.07 + 0.04 * Math.sin(i * 1.7);
    ctx.strokeStyle = `rgba(120, 200, 210, ${alpha})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
      const y = baseY + Math.sin(x * 0.3 + i * 2.1) * 1.5;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}


// === src/fortress.js ===
// ============================================================
// src/fortress.js — Fortress silhouette with damage stages
//
// Drawn to canvas, positioned along city ground behind mirrors.
// Reacts to wall integrity with 4 visual stages.
// Breach triggers shake + dust particles.
// ============================================================





const FORT_W = 512;
const FORT_H = 256;
const COL_STONE = '#2E2419';
const COL_STONE_LIGHT = '#3D3020';
const COL_STONE_HIGHLIGHT = '#4A3B26';
const COL_RUBBLE = '#1F1A10';
const COL_FIRE = '#CC4400';
const COL_SMOKE = 'rgba(40,35,30,0.6)';

let fortMesh = null;
let fortCanvas = null;
let fortCtx = null;
let fortTexture = null;
let lastStage = -1;

// Shake state
let shakeTimer = 0;
let shakeIntensity = 0;
const SHAKE_DURATION = 0.3;

// Dust particles
const dustParticles = [];
const MAX_DUST = 20;

// Smoke plumes (persistent for stages 3-4)
const smokePlumes = [];

// Localized battlement impact flashes (one per ship crash, at its X lane)
const impactFlashes = [];
const MAX_IMPACT_FLASHES = 12;

function initFortress() {
  const scene = getScene();
  const ww = getWorldWidth();

  fortCanvas = document.createElement('canvas');
  fortCanvas.width = FORT_W;
  fortCanvas.height = FORT_H;
  fortCtx = fortCanvas.getContext('2d');

  fortTexture = new THREE.CanvasTexture(fortCanvas);
  fortTexture.minFilter = THREE.LinearFilter;
  fortTexture.magFilter = THREE.LinearFilter;

  // Fortress spans the full width, positioned at the wall line
  // Height: from WALL_Y downward ~12 world units, towers rise ~4 above WALL_Y
  const fortWorldH = 16;
  const fortWorldW = ww + 4;
  const geo = new THREE.PlaneGeometry(fortWorldW, fortWorldH);
  const mat = new THREE.MeshBasicMaterial({ map: fortTexture, transparent: true, depthWrite: false });
  fortMesh = new THREE.Mesh(geo, mat);
  // Centre at WALL_Y - 4 (mostly below wall, towers above)
  fortMesh.position.set(0, WALL_Y - 4, -8);
  scene.add(fortMesh);

  // Initial draw
  drawFortress(1.0);
  lastStage = 4;
}

function updateFortress(dt) {
  const integrity = getWallIntegrity() / 100; // 0 to 1
  const stage = integrity > 0.75 ? 4 : integrity > 0.50 ? 3 : integrity > 0.25 ? 2 : 1;

  // Redraw only when stage changes
  if (stage !== lastStage) {
    lastStage = stage;
    drawFortress(integrity);
    fortTexture.needsUpdate = true;
  }

  // Shake decay
  if (shakeTimer > 0) {
    shakeTimer -= dt;
    const t = shakeTimer / SHAKE_DURATION;
    const ox = (Math.random() - 0.5) * shakeIntensity * t;
    const oy = (Math.random() - 0.5) * shakeIntensity * 0.5 * t;
    fortMesh.position.x = ox;
    fortMesh.position.y = WALL_Y - 4 + oy;
  } else {
    fortMesh.position.x = 0;
    fortMesh.position.y = WALL_Y - 4;
  }

  // Update dust particles
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const p = dustParticles[i];
    p.life -= dt;
    if (p.life <= 0) {
      if (p.mesh) { p.mesh.visible = false; }
      dustParticles.splice(i, 1);
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy -= 15 * dt; // gravity
      if (p.mesh) {
        p.mesh.position.set(p.x, p.y, -7);
        p.mesh.material.opacity = p.life / p.maxLife * 0.6;
      }
    }
  }

  // Update localized impact flashes (fade + slight grow)
  for (let i = impactFlashes.length - 1; i >= 0; i--) {
    const f = impactFlashes[i];
    f.life -= dt;
    if (f.life <= 0) {
      f.mesh.visible = false;
      impactFlashes.splice(i, 1);
    } else {
      const t = f.life / f.maxLife; // 1 -> 0
      // Throb while alive (sustained contact) + fade as life runs out.
      const pulse = 0.7 + 0.3 * Math.sin(performance.now() * 0.02);
      f.mesh.material.opacity = t * 0.9 * pulse;
      const s = 1 + (1 - t) * 0.5;
      f.mesh.scale.set(s, s, 1);
    }
  }
}

// Localized reddish-orange stone flash on the battlement section directly below
// a contacting/crashing lane. Called continuously while a ship drips damage, so
// if a flash already exists near this X we just refresh its life (sustained
// pulse) instead of spawning a new mesh every frame.
function triggerImpactFlash(x) {
  // Refresh a nearby existing flash (same lane) to keep it alive + pulsing.
  for (const f of impactFlashes) {
    if (Math.abs(f.mesh.position.x - x) < 6) {
      f.life = f.maxLife;
      f.mesh.position.x = x;
      return;
    }
  }
  if (impactFlashes.length >= MAX_IMPACT_FLASHES) return;
  const scene = getScene();
  const geo = new THREE.PlaneGeometry(8, 6);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff5522, transparent: true, opacity: 0.9, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, WALL_Y + 2, -6);
  scene.add(mesh);
  impactFlashes.push({ mesh, life: 0.35, maxLife: 0.35 });
}

// Called from session.js when a breach happens
function triggerBreachShake(damage) {
  shakeTimer = SHAKE_DURATION;
  // Subtle thud: ~70% quieter than before (was min(damage/10, 2.5)).
  shakeIntensity = Math.min(damage / 10, 2.5) * 0.3;
  // Spawn dust
  spawnDust(6);
}

function spawnDust(count) {
  const scene = getScene();
  const ww = getWorldWidth();
  for (let i = 0; i < count && dustParticles.length < MAX_DUST; i++) {
    const x = (Math.random() - 0.5) * ww * 0.6;
    const y = WALL_Y + Math.random() * 2;
    const geo = new THREE.PlaneGeometry(1.2, 1.2);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x4A3B26, transparent: true, opacity: 0.5, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, -7);
    scene.add(mesh);
    dustParticles.push({
      mesh, x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: Math.random() * 12 + 5,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 1.0,
    });
  }
}

// --- Fortress drawing ---

function drawFortress(integrity) {
  const ctx = fortCtx;
  const w = FORT_W;
  const h = FORT_H;
  ctx.clearRect(0, 0, w, h);

  const stage = integrity > 0.75 ? 4 : integrity > 0.50 ? 3 : integrity > 0.25 ? 2 : 1;

  // Ground level is at h * 0.35 (from top of canvas)
  // Rampart sits on top of ground, towers rise higher
  const groundY = h * 0.35;
  const rampartH = h * 0.25;
  const rampartTop = groundY - rampartH;
  const crenH = h * 0.06;
  const crenW = w * 0.03;
  const crenGap = w * 0.02;

  // --- Rooftops (behind rampart, suggestion of buildings) ---
  ctx.fillStyle = COL_RUBBLE;
  // Several peaked roofs behind the wall
  for (let i = 0; i < 8; i++) {
    const rx = w * 0.08 + i * w * 0.12;
    const rw = w * 0.08 + Math.random() * w * 0.03;
    const rh = h * 0.08 + Math.random() * h * 0.06;
    ctx.beginPath();
    ctx.moveTo(rx, groundY + rampartH * 0.1);
    ctx.lineTo(rx + rw / 2, groundY + rampartH * 0.1 - rh);
    ctx.lineTo(rx + rw, groundY + rampartH * 0.1);
    ctx.closePath();
    ctx.fill();
  }

  // --- Main rampart wall ---
  ctx.fillStyle = COL_STONE;
  ctx.fillRect(0, rampartTop, w, rampartH);

  // Stone block lines (horizontal courses)
  ctx.strokeStyle = COL_STONE_LIGHT;
  ctx.lineWidth = 1;
  for (let row = 0; row < 5; row++) {
    const y = rampartTop + row * (rampartH / 5);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  // Vertical joints (offset per row)
  ctx.strokeStyle = 'rgba(25,20,12,0.4)';
  for (let row = 0; row < 5; row++) {
    const y = rampartTop + row * (rampartH / 5);
    const offset = (row % 2) * (w * 0.04);
    for (let j = 0; j < 14; j++) {
      const jx = offset + j * (w / 13);
      ctx.beginPath();
      ctx.moveTo(jx, y);
      ctx.lineTo(jx, y + rampartH / 5);
      ctx.stroke();
    }
  }

  // --- Crenellations (merlons along top) ---
  const merlonCount = 16;
  const merlonW = w / merlonCount * 0.55;
  const merlonSpacing = w / merlonCount;
  ctx.fillStyle = COL_STONE;
  for (let i = 0; i < merlonCount; i++) {
    // Skip some in damaged stages
    if (stage <= 3 && (i === 5 || i === 11)) continue; // one missing at stage 3
    if (stage <= 2 && (i === 3 || i === 8 || i === 13)) continue; // more missing
    if (stage <= 1 && (i === 1 || i === 6 || i === 9 || i === 14)) continue;

    const mx = i * merlonSpacing + merlonSpacing * 0.22;
    ctx.fillRect(mx, rampartTop - crenH, merlonW, crenH);
  }

  // --- Towers (two main, one smaller) ---
  drawTower(ctx, w * 0.18, rampartTop, w * 0.08, h * 0.18, stage);
  drawTower(ctx, w * 0.78, rampartTop, w * 0.09, h * 0.20, stage);
  // Smaller centre tower
  drawTower(ctx, w * 0.48, rampartTop, w * 0.06, h * 0.12, stage);

  // --- Damage effects ---
  if (stage <= 3) {
    // Cracks
    ctx.strokeStyle = '#1A1408';
    ctx.lineWidth = 2;
    drawCrack(ctx, w * 0.35, rampartTop + rampartH * 0.3, 20, 4);
    if (stage <= 2) {
      drawCrack(ctx, w * 0.65, rampartTop + rampartH * 0.5, 25, 5);
    }
  }

  if (stage <= 2) {
    // Breach: a gap in the wall with rubble
    const bx = w * 0.55;
    const bw = w * 0.08;
    ctx.fillStyle = '#0c0a06'; // dark hole
    ctx.fillRect(bx, rampartTop + rampartH * 0.3, bw, rampartH * 0.7);
    // Rubble at base
    ctx.fillStyle = COL_RUBBLE;
    for (let r = 0; r < 5; r++) {
      const rx = bx - 5 + Math.random() * (bw + 10);
      const ry = rampartTop + rampartH - 5 + Math.random() * 10;
      ctx.beginPath();
      ctx.arc(rx, ry, 3 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Thin smoke
    ctx.fillStyle = COL_SMOKE;
    for (let s = 0; s < 3; s++) {
      const sx = bx + bw * 0.5 + (Math.random() - 0.5) * 10;
      const sy = rampartTop + rampartH * 0.2 - s * 12;
      ctx.beginPath();
      ctx.arc(sx, sy, 6 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (stage <= 1) {
    // Multiple breaches + fire
    const bx2 = w * 0.25;
    const bw2 = w * 0.07;
    ctx.fillStyle = '#0c0a06';
    ctx.fillRect(bx2, rampartTop + rampartH * 0.2, bw2, rampartH * 0.8);
    // More rubble
    ctx.fillStyle = COL_RUBBLE;
    for (let r = 0; r < 4; r++) {
      ctx.beginPath();
      ctx.arc(bx2 + Math.random() * bw2, rampartTop + rampartH + Math.random() * 8, 3 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Fires
    drawFire(ctx, w * 0.56, rampartTop + rampartH * 0.1);
    drawFire(ctx, w * 0.26, rampartTop + rampartH * 0.05);
    // Heavy smoke
    ctx.fillStyle = 'rgba(30,25,20,0.5)';
    for (let s = 0; s < 6; s++) {
      const sx = w * 0.2 + Math.random() * w * 0.6;
      const sy = rampartTop - 10 - s * 8 - Math.random() * 10;
      ctx.beginPath();
      ctx.arc(sx, sy, 8 + Math.random() * 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Ground below rampart ---
  ctx.fillStyle = COL_STONE;
  ctx.fillRect(0, rampartTop + rampartH, w, h - (rampartTop + rampartH));
}

function drawTower(ctx, x, wallTop, tw, th, stage) {
  const towerTop = wallTop - th;
  ctx.fillStyle = COL_STONE_LIGHT;
  ctx.fillRect(x - tw / 2, towerTop, tw, th);

  // Tower cap (pointed)
  ctx.fillStyle = '#1F1A10';
  ctx.beginPath();
  ctx.moveTo(x - tw / 2 - 2, towerTop);
  ctx.lineTo(x, towerTop - th * 0.2);
  ctx.lineTo(x + tw / 2 + 2, towerTop);
  ctx.closePath();
  ctx.fill();

  // Window slit
  ctx.fillStyle = '#0a0806';
  ctx.fillRect(x - 2, towerTop + th * 0.3, 4, th * 0.15);

  // Damage to tower
  if (stage <= 2) {
    ctx.fillStyle = '#0c0a06';
    ctx.fillRect(x - tw * 0.3, towerTop + th * 0.5, tw * 0.3, th * 0.3);
  }
}

function drawCrack(ctx, x, y, length, segments) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 0; i < segments; i++) {
    x += (Math.random() - 0.3) * (length / segments);
    y += Math.random() * (length / segments) * 0.8;
    ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawFire(ctx, x, y) {
  // Simple flame shapes
  const flames = [
    { dx: 0, dy: 0, r: 6, col: COL_FIRE },
    { dx: -3, dy: -4, r: 4, col: '#FF6600' },
    { dx: 2, dy: -7, r: 3, col: '#FFAA00' },
    { dx: -1, dy: -10, r: 2, col: '#FFCC44' },
  ];
  for (const f of flames) {
    ctx.fillStyle = f.col;
    ctx.beginPath();
    ctx.arc(x + f.dx, y + f.dy, f.r, 0, Math.PI * 2);
    ctx.fill();
  }
}


// === src/zeus.js ===
// ============================================================
// src/zeus.js â€” Zeus ultimate: lightning strike
//
// Ready state: "ZEUS IS LISTENING" text + chime when faith threshold met.
// Strike: white flash, staggered lightning bolts to all ships,
// massive damage, 3s stun, screen shake, thunder crack + rumble.
// ============================================================






// --- State ---
let zeusReady = false;
let readyNotified = false;

let strikeActive = false;
let strikeTimer = 0;
let strikeBolts = [];
let flashAlpha = 0;
let zeusShakeTimer = 0;
let zeusShakeIntensity = 0;

// Audio context (lazy, shared with game audio via global AudioContext)
let aCtx = null;

function isZeusReady() { return zeusReady; }
function getZeusFlash() { return flashAlpha; }
function getZeusShake() {
  if (zeusShakeTimer <= 0) return { x: 0, y: 0 };
  const t = zeusShakeTimer / 0.5;
  return {
    x: (Math.random() - 0.5) * zeusShakeIntensity * t,
    y: (Math.random() - 0.5) * zeusShakeIntensity * 0.5 * t
  };
}

function initZeus() {
  // No text label — the visual effects (bolts, flash, shake) carry the moment
}

// Called each frame from main loop
// Reset all Zeus state on session restart — clear bolts, flash, shake, strike
function resetZeus() {
  const scene = getScene();
  for (const bolt of strikeBolts) {
    if (bolt.mesh) {
      scene.remove(bolt.mesh);
      if (bolt.mesh.geometry) bolt.mesh.geometry.dispose();
      if (bolt.mesh.material) bolt.mesh.material.dispose();
    }
  }
  strikeBolts = [];
  strikeActive = false;
  strikeTimer = 0;
  flashAlpha = 0;
  zeusShakeTimer = 0;
  zeusShakeIntensity = 0;
  zeusReady = false;
  readyNotified = false;
}

function updateZeus(dt, affordable) {
  const wasReady = zeusReady;
  zeusReady = affordable;

  // Notify on crossing threshold (chime only, no text)
  if (zeusReady && !readyNotified) {
    readyNotified = true;
    playReadyChime();
  }
  if (!zeusReady) {
    readyNotified = false;
  }

  // Strike animation
  if (strikeActive) {
    updateStrike(dt);
  }
}

// Called from crafting.js when Zeus button is pressed
function triggerZeusStrike() {
  if (strikeActive) return;
  strikeActive = true;
  strikeTimer = 1.8;
  flashAlpha = 1.0;
  zeusShakeTimer = 0.5;
  zeusShakeIntensity = 4;
  readyNotified = false;

  const pool = getEnemyPool();
  const ww = getWorldWidth();
  const laneWidth = ww / ENEMY_LANE_COUNT;
  const scene = getScene();

  // Hit all active enemies
  const targets = pool.filter(e => e.active);
  strikeBolts = [];

  for (let i = 0; i < targets.length; i++) {
    const enemy = targets[i];
    const ex = -ww / 2 + laneWidth * (enemy.lane + 0.5);
    const ey = enemy.y;

    // Mark for Zeus kill â€” defer heat application by 0.2s for charring visual
    // Store the pending heat to be applied after charring stage
    const isLight = (enemy.type === 'skiff' || enemy.type === 'trireme');
    enemy.zeusPendingHeat = isLight ? enemy.maxHp * 1.5 : enemy.maxHp * 0.5;
    enemy.zeusCharring = 0.25; // 0.25s charring before heat hits
    // Stun: stop for 3 seconds
    enemy.stunTimer = 3.0;

    // Create bolt mesh (staggered reveal)
    const bolt = createBoltMesh(ex + (Math.random() - 0.5) * 3, SHIP_SPAWN_Y + 8, ex, ey);
    bolt.revealAt = 1.8 - i * 0.06; // stagger 60ms apart
    bolt.revealed = false;
    bolt.life = 0.4;
    bolt.mesh.visible = false;
    scene.add(bolt.mesh);
    strikeBolts.push(bolt);
  }

  // Thunder audio — natural thunderclap on the shared audio bus.
  playZeusThunder();
}

function updateStrike(dt) {
  strikeTimer -= dt;
  flashAlpha = Math.max(0, flashAlpha - dt * 2.5);

  // Reveal bolts staggered
  for (const bolt of strikeBolts) {
    if (!bolt.revealed && strikeTimer < bolt.revealAt) {
      bolt.revealed = true;
      bolt.mesh.visible = true;
    }
    if (bolt.revealed) {
      bolt.life -= dt;
      if (bolt.life <= 0) {
        bolt.mesh.visible = false;
      } else {
        bolt.mesh.material.opacity = Math.min(1, bolt.life * 5);
      }
    }
  }

  // Shake decay
  if (zeusShakeTimer > 0) zeusShakeTimer -= dt;

  // End
  if (strikeTimer <= 0) {
    strikeActive = false;
    const scene = getScene();
    for (const bolt of strikeBolts) {
      scene.remove(bolt.mesh);
      bolt.mesh.geometry.dispose();
      bolt.mesh.material.dispose();
    }
    strikeBolts = [];
  }
}

// --- Lightning bolt: jagged quad strip ---
function createBoltMesh(x1, y1, x2, y2) {
  const segments = 10 + Math.floor(Math.random() * 5);
  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const jitterX = (i > 0 && i < segments) ? (Math.random() - 0.5) * 8 : 0;
    const jitterY = (i > 0 && i < segments) ? (Math.random() - 0.5) * 2 : 0;
    points.push(x1 + (x2 - x1) * t + jitterX, y1 + (y2 - y1) * t + jitterY);
  }

  const verts = [];
  const thickness = 0.7;
  for (let i = 0; i < points.length - 2; i += 2) {
    const ax = points[i], ay = points[i + 1];
    const bx = points[i + 2], by = points[i + 3];
    const dx = bx - ax, dy = by - ay;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len * thickness, ny = dx / len * thickness;
    verts.push(ax + nx, ay + ny, 0, ax - nx, ay - ny, 0, bx + nx, by + ny, 0);
    verts.push(ax - nx, ay - ny, 0, bx - nx, by - ny, 0, bx + nx, by + ny, 0);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const mat = new THREE.MeshBasicMaterial({
    color: 0xFFFFDD, transparent: true, opacity: 1.0,
    side: THREE.DoubleSide, depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.z = 9;
  return { mesh, revealAt: 0, revealed: false, life: 0.4 };
}

// --- Audio ---
function getACtx() {
  if (aCtx) return aCtx;
  try { aCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  return aCtx;
}

function playReadyChime() {
  const ctx = getACtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  // Rising two-note chime: C5 â†’ E5
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.2, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
  g.connect(ctx.destination);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 523;
  o1.connect(g); o1.start(now); o1.stop(now + 0.15);
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 659;
  o2.connect(g); o2.start(now + 0.13); o2.stop(now + 0.6);
}

function playThunderCrack() {
  const ctx = getACtx();
  if (!ctx) return;
  const now = ctx.currentTime;

  // Sharp crack: noise burst
  const crackLen = Math.ceil(ctx.sampleRate * 0.1);
  const buf = ctx.createBuffer(1, crackLen, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < crackLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / crackLen, 2);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const cg = ctx.createGain();
  cg.gain.setValueAtTime(0.5, now);
  cg.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  src.connect(cg).connect(ctx.destination);
  src.start(now);

  // Low rumble tail
  const rumLen = Math.ceil(ctx.sampleRate * 1.5);
  const rBuf = ctx.createBuffer(1, rumLen, ctx.sampleRate);
  const rd = rBuf.getChannelData(0);
  for (let i = 0; i < rumLen; i++) rd[i] = Math.random() * 2 - 1;
  const rSrc = ctx.createBufferSource(); rSrc.buffer = rBuf;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(180, now);
  lp.frequency.exponentialRampToValueAtTime(30, now + 1.3);
  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0.3, now + 0.05);
  rg.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
  rSrc.connect(lp).connect(rg).connect(ctx.destination);
  rSrc.start(now + 0.04);

  // Deep sub-bass boom: sine dropping 45Hz -> 20Hz for a felt thunderclap
  const sub = ctx.createOscillator();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(45, now);
  sub.frequency.exponentialRampToValueAtTime(20, now + 0.9);
  const subGain = ctx.createGain();
  subGain.gain.setValueAtTime(0.7, now);
  subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
  sub.connect(subGain).connect(ctx.destination);
  sub.start(now);
  sub.stop(now + 1.2);
}


// === src/poseidon.js ===
// ============================================================
// src/poseidon.js — Poseidon ultimate: whirlpool control
//
// Opens a whirlpool in centre of sea. All ships slow 50% and
// are pulled laterally toward centre. Sailed ships pulled harder.
// No direct damage. Duration ~6s. Deep sucking sound.
// ============================================================





let active = false;
let timer = 0;
let whirlpoolMesh = null;
let whirlpoolPhase = 0;
let placementPending = false; // waiting for player to tap placement
let placementTimer = 0;      // timeout for auto-cancel
let rippleMesh = null;        // targeting ripple that follows the finger
let rippleX = 0, rippleY = 5; // current ripple/target position

const DURATION = GOD_ABILITIES.poseidon.duration;
const PULL_STRENGTH_SAILED = 14;  // world units/sec lateral pull
const PULL_STRENGTH_OARED = 6;
const PLACEMENT_TIMEOUT = 5;      // seconds before auto-cancel + refund

function isPoseidonPlacementPending() { return placementPending; }
function cancelPoseidonPlacement() {
  placementPending = false;
  placementTimer = 0;
  if (rippleMesh) rippleMesh.visible = false;
}

// Called from input.js as the finger moves during placement so the ripple
// follows the touch point.
function setPoseidonTarget(worldX, worldY) {
  rippleX = worldX;
  rippleY = worldY;
}

function initPoseidon() {
  const scene = getScene();
  // Whirlpool visual: rotating spiral (canvas texture on a circle)
  const size = 20;
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  drawWhirlpool(ctx, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.premultiplyAlpha = false;
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, opacity: 0, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  whirlpoolMesh = new THREE.Mesh(geo, mat);
  whirlpoolMesh.position.set(0, 0, -5); // default centre, moved on placement
  scene.add(whirlpoolMesh);

  // Targeting ripple: a soft water-pulse ring that follows the finger while
  // choosing where to drop the whirlpool (replaces the old "Tap the water" text).
  const rGeo = new THREE.RingGeometry(2.4, 3.2, 32);
  const rMat = new THREE.MeshBasicMaterial({
    color: 0x66ccff, transparent: true, opacity: 0, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
  rippleMesh = new THREE.Mesh(rGeo, rMat);
  rippleMesh.position.set(0, 5, 8);
  rippleMesh.visible = false;
  scene.add(rippleMesh);
}

// Reset all Poseidon state on session restart — stop whirlpool, clear wind/pull
function resetPoseidon() {
  active = false;
  timer = 0;
  whirlpoolPhase = 0;
  placementPending = false;
  placementTimer = 0;
  if (whirlpoolMesh) whirlpoolMesh.material.opacity = 0;
  if (rippleMesh) rippleMesh.visible = false;
  setWindActive(false);
}

function triggerPoseidonStrike() {
  if (active || placementPending) return;
  // Enter placement mode — a targeting ripple now follows the finger.
  placementPending = true;
  placementTimer = PLACEMENT_TIMEOUT;
  rippleX = 0; rippleY = 5;
  if (rippleMesh) { rippleMesh.position.set(rippleX, rippleY, 8); rippleMesh.visible = true; }
}

function placePoseidon(worldX, worldY) {
  if (!placementPending) return;
  placementPending = false;
  placementTimer = 0;
  if (rippleMesh) rippleMesh.visible = false;
  active = true;
  timer = DURATION;
  whirlpoolPhase = 0;
  whirlpoolMesh.position.x = worldX;
  whirlpoolMesh.position.y = worldY;
  setWindActive(true);
  playWhirlpoolSound();
}

function updatePoseidon(dt) {
  // Placement timeout: auto-cancel if player doesn't tap within PLACEMENT_TIMEOUT
  if (placementPending) {
    placementTimer -= dt;
    // Ripple follows the finger, with a gentle breathing pulse in scale/opacity.
    if (rippleMesh) {
      rippleMesh.visible = true;
      rippleMesh.position.set(rippleX, rippleY, 8);
      const p = 0.5 + 0.5 * Math.sin(performance.now() * 0.006);
      rippleMesh.material.opacity = 0.4 + 0.35 * p;
      const s = 0.85 + 0.3 * p;
      rippleMesh.scale.set(s, s, 1);
      rippleMesh.rotation.z += dt * 0.8;
    }
    if (placementTimer <= 0) {
      // Timeout — cancel and refund (refund handled by crafting reimport not practical;
      // just cancel silently — cost was already paid. Timeout is generous at 5s.)
      cancelPoseidonPlacement();
    }
    return;
  }

  if (!active) {
    whirlpoolMesh.material.opacity = 0;
    return;
  }

  timer -= dt;
  whirlpoolPhase += dt * 4; // rotation speed

  // Visual: fade in/out, rotate
  const fadeIn = Math.min(1, (DURATION - timer) * 3); // quick fade in
  const fadeOut = Math.min(1, timer * 2); // fade out at end
  whirlpoolMesh.material.opacity = 0.4 * fadeIn * fadeOut;
  whirlpoolMesh.rotation.z = whirlpoolPhase;

  // Pull all ships toward whirlpool centre
  const pool = getEnemyPool();
  const ww = getWorldWidth();
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;

    // Lateral pull toward whirlpool position
    const laneWidth = ww / 5;
    const shipX = -ww / 2 + laneWidth * (e.lane + 0.5) + (e.pullX || 0);
    const targetX = whirlpoolMesh.position.x;
    const dx = targetX - shipX;
    const pullStrength = e.propulsion === 'sailed' ? PULL_STRENGTH_SAILED : PULL_STRENGTH_OARED;

    // Accumulate pull (uses pullX, not driftX — won't be overwritten by animation)
    const pull = Math.sign(dx) * Math.min(Math.abs(dx), pullStrength * dt * fadeIn * fadeOut);
    e.pullX = (e.pullX || 0) + pull;

    // Tilt ship toward centre (visual feedback)
    const tiltTarget = Math.sign(dx) * 0.12 * fadeIn;
    e.mesh.rotation.z = e.mesh.rotation.z * 0.85 + tiltTarget * 0.15;
  }

  // End: the vortex expires. Ships must NEVER snap back to their lanes — their
  // current lateral offset (pullX) is COMMITTED as permanent. We simply stop
  // applying pull and clear the wind slow; because world-X is always computed
  // as laneCentre + driftX + pullX, leaving pullX untouched keeps each ship
  // exactly where the vortex left it, and normal downward sailing continues
  // from there (e.y -= speed * dt) with no teleport or rubber-banding.
  if (timer <= 0) {
    active = false;
    setWindActive(false);
    const pool2 = getEnemyPool();
    for (const e of pool2) {
      if (!e.active) continue;
      e.mesh.rotation.z = 0; // level out any lingering vortex tilt (visual only)
      // pullX intentionally left as-is — the shifted position is now permanent.
    }
  }
}

function drawWhirlpool(ctx, sz) {
  const cx = sz / 2, cy = sz / 2;
  ctx.clearRect(0, 0, sz, sz);
  // Spiral arms
  for (let arm = 0; arm < 4; arm++) {
    const baseAngle = arm * Math.PI / 2;
    ctx.strokeStyle = `rgba(40, 120, 160, ${0.6 - arm * 0.1})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let t = 0; t < 3; t += 0.1) {
      const r = 5 + t * 18;
      const a = baseAngle + t * 2.5;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (t === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // Centre dark hole
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
  grad.addColorStop(0, 'rgba(5, 20, 30, 0.8)');
  grad.addColorStop(1, 'rgba(5, 20, 30, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 15, 0, Math.PI * 2);
  ctx.fill();
}

// Audio: deep sucking sound
function playWhirlpoolSound() {
  let ctx;
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const now = ctx.currentTime;

  // Low oscillator sweep down
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + DURATION);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(200, now);
  lp.frequency.exponentialRampToValueAtTime(50, now + DURATION);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.2, now + 0.3);
  g.gain.linearRampToValueAtTime(0.15, now + DURATION - 1);
  g.gain.exponentialRampToValueAtTime(0.001, now + DURATION);
  osc.connect(lp).connect(g).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + DURATION + 0.1);

  // Noise layer: water rush
  const nLen = Math.ceil(ctx.sampleRate * DURATION);
  const nBuf = ctx.createBuffer(1, nLen, ctx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;
  const nSrc = ctx.createBufferSource();
  nSrc.buffer = nBuf;
  const nLp = ctx.createBiquadFilter();
  nLp.type = 'bandpass';
  nLp.frequency.value = 300;
  nLp.Q.value = 1;
  const nG = ctx.createGain();
  nG.gain.setValueAtTime(0, now);
  nG.gain.linearRampToValueAtTime(0.08, now + 0.5);
  nG.gain.linearRampToValueAtTime(0.05, now + DURATION - 1);
  nG.gain.exponentialRampToValueAtTime(0.001, now + DURATION);
  nSrc.connect(nLp).connect(nG).connect(ctx.destination);
  nSrc.start(now);
  nSrc.stop(now + DURATION + 0.1);
}

// src/helios.js — Helios ultimate: Solar Overcharge
//
// Active ability (replaces the old passive Priest). On cast:
//   - Full-screen warm solar bloom overlay for `duration` seconds.
//   - Generates `faithGain` Faith spread evenly across the flare
//     (the fuel for repeat Zeus/Poseidon casts).
//   - Stuns every ship on screen (speed 0) for `stunDuration` seconds.
//   - Disables Shield-Bearer deflection while the flare is active, so
//     beams deal full direct damage straight through the shields.
//   - Rising solar hum + bright chime SFX.
// ============================================================







const CFG = GOD_ABILITIES.helios;

let heliosActive = false;
let heliosTimer = 0;              // seconds remaining in the flare
let heliosFaithRemaining = 0;     // faith still to be granted this flare
let bloomMesh = null;
let heliosACtx = null;
let heliosHumOsc = null;
let heliosHumGain = null;

function isHeliosActive() { return heliosActive; }
// While the flare burns, shield plates are overpowered by the sun.
function isShieldDisabled() { return heliosActive; }

function initHelios() {
  const oScene = getOverlayScene();
  const worldWidth = getWorldWidth();
  // Full-screen warm bloom: a plane covering the whole viewport in the overlay
  // scene, additive so it reads as blinding light rather than a flat tint.
  const geo = new THREE.PlaneGeometry(worldWidth * 1.2, WORLD_HEIGHT * 1.2);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffdd88, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  bloomMesh = new THREE.Mesh(geo, mat);
  bloomMesh.position.set(0, 0, 20); // in front of everything in the overlay scene
  bloomMesh.visible = false;
  oScene.add(bloomMesh);
}

// Called from crafting.js when Helios is purchased.
function triggerHelios() {
  heliosActive = true;
  heliosTimer = CFG.duration;
  heliosFaithRemaining = CFG.faithGain;
  if (bloomMesh) bloomMesh.visible = true;

  // Stun every ship currently on screen.
  const pool = getEnemyPool();
  for (const e of pool) {
    if (e.active) e.stunTimer = Math.max(e.stunTimer || 0, CFG.stunDuration);
  }

  playSolarHum();
}

function updateHelios(dt) {
  if (!heliosActive) return;

  heliosTimer -= dt;

  // Drip the faith evenly across the flare duration.
  if (heliosFaithRemaining > 0) {
    const rate = CFG.faithGain / CFG.duration; // faith per second
    const grant = Math.min(heliosFaithRemaining, rate * dt);
    gainFaith(grant);
    heliosFaithRemaining -= grant;
  }

  // Two-stage flare so ship silhouettes stay readable:
  //  - 0..0.4s: bright near-white whiteout bloom (the "flash").
  //  - 0.4s..end: a low-opacity golden sun-glare so the fleet is still visible
  //    through the light, with a short fade at the very end.
  const elapsed = CFG.duration - heliosTimer;
  if (bloomMesh) {
    const WHITEOUT = 0.4;
    const mat = bloomMesh.material;
    if (elapsed < WHITEOUT) {
      // Rise to a bright whiteout over the first 0.4s.
      const t = elapsed / WHITEOUT;           // 0..1
      mat.color.setHex(0xfff4d8);             // near-white warm
      mat.opacity = 0.9 * t;
    } else {
      // Golden glare for the rest — transparent enough to see silhouettes.
      const tailFade = Math.min(1, heliosTimer * 2.5); // fade over last ~0.4s
      const shimmer = 0.9 + 0.1 * Math.sin(elapsed * 10);
      mat.color.setHex(0xffcc55);             // golden
      mat.opacity = 0.22 * tailFade * shimmer;
    }
  }

  if (heliosTimer <= 0) {
    endFlare();
  }
}

function endFlare() {
  heliosActive = false;
  heliosTimer = 0;
  heliosFaithRemaining = 0;
  if (bloomMesh) {
    bloomMesh.material.opacity = 0;
    bloomMesh.visible = false;
  }
  stopSolarHum();
}

function resetHelios() {
  endFlare();
}

// --- Audio: resonant temple chime + horn (organic, via shared audio bus so it
// respects mute). The old sci-fi sawtooth sweep was removed. ---
function playSolarHum() { playHeliosHorn(); }
function stopSolarHum() { /* horn is a one-shot swell; nothing to stop */ }


// === src/beam.js ===
// ============================================================
// src/beam.js — Iterative raycast beam solver with resonance detection
// ============================================================


// Segment: { start, end, colour, intensity, bounces, preSplit }
let segments = [];
let dirty = true;
// Diagnostics — read by debug overlay
let maxBouncesUsed = 0;
let hitBounceCap = false;
function markDirty() { dirty = true; }
function isDirty() { return dirty; }
function getSegments() { return segments; }
function getBeamDiag() { return { maxBouncesUsed, hitBounceCap }; }
// Resonance: detected when 3+ bounces occur between the same mirror pair
let resonanceActive = false;
let resonanceMirrors = null; // [mirrorA, mirrorB] if resonance detected
function getResonanceActive() { return resonanceActive; }
function getResonanceMirrors() { return resonanceMirrors; }
// Called by main loop when dirty
function solve(sourceX, sourceY, mirrors, prisms, worldWidth, foundryColliders) {
  segments = [];
  maxBouncesUsed = 0;
  hitBounceCap = false;
  resonanceActive = false;
  resonanceMirrors = null;
  mirrorHitSequence = [];
  const dir = { x: 0, y: -1 };
  traceBeam(
    { x: sourceX, y: sourceY },
    dir,
    COLOUR_WHITE,
    1.0,
    mirrors,
    prisms,
    [], // foundries are pass-through, not colliders
    worldWidth,
    MAX_BOUNCES,
    null,
    0,
    true // preSplit: this is the raw sun beam before hitting prism
  );
  dirty = false;
  // Post-solve: detect resonance (3+ bounces between same mirror pair)
  detectResonance();
}
let mirrorHitSequence = [];
function detectResonance() {
  if (mirrorHitSequence.length < RESONANCE_MIN_BOUNCES) return;
  for (let i = 0; i <= mirrorHitSequence.length - RESONANCE_MIN_BOUNCES; i++) {
    const a = mirrorHitSequence[i], b = mirrorHitSequence[i + 1];
    if (!a || !b || a === b) continue;
    let count = 2;
    for (let j = i + 2; j < mirrorHitSequence.length; j++) {
      if (mirrorHitSequence[j] === ((j - i) % 2 === 0 ? a : b)) count++; else break;
    }
    if (count >= RESONANCE_MIN_BOUNCES) { resonanceActive = true; resonanceMirrors = [a, b]; return; }
  }
}
function traceBeam(origin, direction, colour, intensity, mirrors, prisms, foundryColliders, worldWidth, bouncesLeft, excludePrism, bouncesUsed, preSplit, wide) {
  if (segments.length >= MAX_SEGMENTS) return;
  if (bouncesLeft < 0) {
    hitBounceCap = true;
    return;
  }
  const hit = castRay(origin, direction, mirrors, prisms, foundryColliders, worldWidth, excludePrism);
  // The incident beam ALWAYS terminates at the true collision point. No centre
  // snapping — that offset caused beams to graze/pass through the disc. Any
  // visual "centre" alignment is handled purely in the mirror sprite texture,
  // never in the collision/termination coordinates.
  const endPoint = hit.point;
  segments.push({
    start: { x: origin.x, y: origin.y },
    end: { x: endPoint.x, y: endPoint.y },
    colour,
    intensity,
    bounces: bouncesUsed,
    preSplit: !!preSplit,
    wide: !!wide, // high-tier focused ray → renderer draws a fatter core
    // "active" = this beam is doing work (contacting a target). activeSeed is
    // the part known at solve time: the raw sun column (preSplit) and any
    // segment terminating on the prism. Ship/altar contact is OR-ed in each
    // frame by damage.js / foundry.js (into seg.active). Idle beams stay dim.
    activeSeed: !!preSplit || hit.type === 'prism',
    active: !!preSplit || hit.type === 'prism'
  });
  if (hit.type === 'mirror' && bouncesLeft > 0) {
    // Record for resonance detection
    mirrorHitSequence.push(hit.object);
    // -------------------------------------------------------
    // Reflection math (double-sided):
    // Given incident direction d and surface normal n,
    // reflected direction r = d - 2*(d·n)*n
    //
    // If d·n > 0, beam is hitting from behind — flip n so
    // reflection works correctly from either side.
    // -------------------------------------------------------
    let n = { x: hit.normal.x, y: hit.normal.y };
    const dot = direction.x * n.x + direction.y * n.y;
    // Flip normal if beam approaches from behind
    if (dot > 0) {
      n.x = -n.x;
      n.y = -n.y;
    }
    const dotFixed = direction.x * n.x + direction.y * n.y;
    const reflected = {
      x: direction.x - 2 * dotFixed * n.x,
      y: direction.y - 2 * dotFixed * n.y
    };
    // Normalise to avoid drift
    const len = Math.sqrt(reflected.x * reflected.x + reflected.y * reflected.y);
    reflected.x /= len;
    reflected.y /= len;
    const newBounces = bouncesUsed + 1;
    if (newBounces > maxBouncesUsed) maxBouncesUsed = newBounces;
    // Reflect from the TRUE collision point, nudged a tiny step along the

// Ray vs AABB intersection (for foundries)

    { axis: 'y', val: -hh },

      t = (edge.val - origin.y) / dir.y;
      if (t > 0.1 && t < tMin) {
        const x = origin.x + dir.x * t;

// Generate N band angles across the split spread.
// Higher prism tiers FOCUS rather than fan out: the angular spread is tightened
// so the extra bands stay near-parallel and read as a few wide, intense rays
// instead of a spray of overlapping additive "noodles". Each high-tier band is
// also tagged wide=true so the renderer draws it with a fatter core.
function generateBandAngles(n) {

  const wide = n >= 5;                                       // fatter core rays at 5/6
  const bands = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1; // -1 to +1
    bands.push({
      colour: colours[i % colours.length],
      angleOffset: t * PRISM_SPLIT_ANGLE * spreadScale,

}
// Rotate a 2D vector by angle (radians)
function rotateVec(v, angle) {

  return {
    x: v.x * cos - v.y * sin,
    y: v.x * sin + v.y * cos

// ============================================================
// src/beam-render.js — Quad mesh pool for beam segment rendering
//
// Each segment is a textured quad with additive blending.
// A second wider quad behind provides soft glow.
// Pool is pre-allocated; unused meshes are hidden.
//
// Width encodes power: thicker = stronger beam.
// Gold band renders thinner and pulses slowly.
// ============================================================




const meshes = [];      // { core: Mesh, glow: Mesh }
let poolReady = false;
let pulseTime = 0;

// Gold is rendered at 60% width of other bands to be visually distinct
const GOLD_WIDTH_FACTOR = 0.6;

function initBeamRenderer() {
  const scene = getScene();
  for (let i = 0; i < BEAM_SEGMENT_POOL_SIZE; i++) {
    const core = createQuadMesh(1.0);
    const glow = createQuadMesh(0.35);
    core.visible = false;
    glow.visible = false;
    // Beams render behind objects (z < 0)
    glow.position.z = -0.5;
    core.position.z = -0.3;
    scene.add(glow);
    scene.add(core);
    meshes.push({ core, glow });
  }
  poolReady = true;
}

function updateBeamPulse(dt) {
  pulseTime += dt;
}

function rebuildBeams(segments) {
  if (!poolReady) return;

  for (let i = 0; i < BEAM_SEGMENT_POOL_SIZE; i++) {
    const entry = meshes[i];
    if (i < segments.length) {
      const seg = segments[i];

      // Width proportional to intensity: full=1.0, halved sub-ray=0.5
      let widthMult = seg.intensity;
      // Gold is thinner
      if (seg.colour === COLOUR_GOLD) widthMult *= GOLD_WIDTH_FACTOR;
      // Gold pulses: opacity oscillates 0.7–1.0
      let opacityMult = 1.0;
      if (seg.colour === COLOUR_GOLD) {
        opacityMult = 0.7 + 0.3 * Math.sin(pulseTime * 2.5);
      }

      // Active/idle tiers affect BRIGHTNESS ONLY, never width. A beam must keep
      // a clean, uniform, slender profile whether or not it's touching a target
      // — contact feedback is shown at the hit point (see damage.js), not by
      // bulging the whole beam.
      const isActive = seg.active !== false; // undefined (older segs) treated active
      const tierOpacity = isActive ? 1.0 : 0.25;
      const glowBoost = isActive ? 1.5 : 0.35; // intense core glow on active beams

      // Width is fixed/sharp: it depends only on the beam's own intensity (full
      // band vs halved sub-ray) and the gold-thinning factor above. NO active
      // scaling, NO high-tier fattening — clamped to a hard max so it never
      // exceeds a crisp strip on contact.
      const coreW = Math.min(BEAM_WIDTH * widthMult, BEAM_WIDTH);
      const glowW = Math.min(BEAM_GLOW_WIDTH * widthMult, BEAM_GLOW_WIDTH);

      // Edge fade: reduce opacity if segment ends near world boundary
      const hh = WORLD_HEIGHT / 2;
      const edgeMargin = 4; // fade starts this many units from edge
      const endDistFromEdge = Math.min(
        Math.abs(seg.end.x) < 28 ? 99 : 28 - Math.abs(seg.end.x) + edgeMargin,
        hh - Math.abs(seg.end.y) + edgeMargin
      );
      const edgeFade = Math.min(1, Math.max(0.1, endDistFromEdge / edgeMargin));
      const finalOpacity = opacityMult * edgeFade * tierOpacity;

      positionQuad(entry.core, seg.start, seg.end, coreW);
      positionQuad(entry.glow, seg.start, seg.end, glowW);
      setQuadColour(entry.core, seg.colour, seg.intensity * finalOpacity);
      setQuadColour(entry.glow, seg.colour, seg.intensity * glowBoost * finalOpacity);
      entry.core.visible = true;
      entry.glow.visible = true;
    } else {
      entry.core.visible = false;
      entry.glow.visible = false;
    }
  }
}

// Soft cross-beam gradient texture: bright down the centre line, fading to
// transparent at the top/bottom edges (across the beam WIDTH, which is the
// quad's local Y after scaling). Gives beams a luminous concentrated-sunbeam
// look with soft edge falloff instead of a flat solid bar. Length axis (X) is
// uniform so the beam reads continuous end-to-end.
let beamTexture = null;
function getBeamTexture() {
  if (beamTexture) return beamTexture;
  const h = 64, w = 8;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  // Vertical gradient (across width): centre bright -> edges transparent.
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.32, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.5, 'rgba(255,255,255,1)');
  grad.addColorStop(0.68, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  beamTexture = new THREE.CanvasTexture(c);
  beamTexture.minFilter = THREE.LinearFilter;
  beamTexture.magFilter = THREE.LinearFilter;
  return beamTexture;
}

function createQuadMesh(opacity) {
  const geo = new THREE.PlaneGeometry(1, 1);
  // The plane's local Y (UV v) is the beam-width axis, so the vertical texture
  // gradient produces the across-beam edge falloff; length (X) stays uniform.
  const mat = new THREE.MeshBasicMaterial({
    map: getBeamTexture(),
    color: 0xffffff,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  return new THREE.Mesh(geo, mat);
}

function positionQuad(mesh, start, end, width) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);

  mesh.position.x = (start.x + end.x) / 2;
  mesh.position.y = (start.y + end.y) / 2;

  mesh.scale.x = length;
  mesh.scale.y = width;

  mesh.rotation.z = angle;
}

function setQuadColour(mesh, colour, intensity) {
  mesh.material.color.setHex(colour);
  mesh.material.opacity = Math.min(1.0, intensity);
}

// Hide/show all beam geometry (for game-over screen)
function setBeamsVisible(visible) {
  for (let i = 0; i < meshes.length; i++) {
    meshes[i].core.visible = visible && meshes[i].core.visible;
    meshes[i].glow.visible = visible && meshes[i].glow.visible;
  }
  if (!visible) {
    for (let i = 0; i < meshes.length; i++) {
      meshes[i].core.visible = false;
      meshes[i].glow.visible = false;
    }
  }
}

// src/mirror.js — Mirror objects, generic socket system, tweens
// ============================================================





const sockets = [];
const mirrors = [];
let mirrorMeshGroup = null;

const MIRROR_THICKNESS = 1;
// Disc radius for the drag bounding box (half the mirror length ≈ the gold disc).
const MIRROR_RADIUS = MIRROR_LENGTH / 2;
// px→world conversion for the spec offsets (world is 100u over ~780px portrait).
const PX = 100 / 780;

// Strict rectangular drag bounding box for a mirror centre. Shared by the live
// drag (input.js) and the drop commit (moveMirrorFree) so a disc can never be
// dragged off-stage, below the stone battlement, or up into the spawn area.
function clampMirrorPos(x, y) {
  const hw = getWorldWidth() / 2;
  const minX = -hw + MIRROR_RADIUS;
  const maxX = hw - MIRROR_RADIUS;
  const minY = BATTLEMENT_TOP_Y + MIRROR_RADIUS + 10 * PX; // never below wall top
  const maxY = PRISM_Y - 150 * PX;                         // never into spawn area
  return {
    x: Math.max(minX, Math.min(maxX, x)),
    y: Math.max(minY, Math.min(maxY, y)),

}
function getMirrorFloorY() { return BATTLEMENT_TOP_Y + MIRROR_RADIUS; }

// Active tweens: { mirror, fromX, fromY, toX, toY, elapsed, duration }
const tweens = [];

function initSockets() {
  sockets.length = 0;
  for (let i = 0; i < SOCKET_POSITIONS.length; i++) {
    sockets.push({ type: null, objectRef: null });
  }
}

function getSockets() { return sockets; }
function getSocketPositions() { return SOCKET_POSITIONS; }
function getMirrors() { return mirrors; }

function initMirrors() {
  const scene = getScene();

  scene.add(mirrorMeshGroup);

  for (let i = 0; i < MIRROR_COUNT_START; i++) {
    const socketIdx = DEFAULT_MIRROR_SOCKETS[i];
    const mirror = createMirror(socketIdx);
    // Default angles: flank mirrors horizontal (aim bands into ship lanes),
    // centre mirror vertical (needs player rotation to be useful)
    if (i === 1) {

      mirror.angle = Math.PI / 2;

      mirror.angle = 0;

    sockets[socketIdx].type = 'mirror';
    sockets[socketIdx].objectRef = mirror;
  }

  // Socket indicators: hidden when FREE_PLACEMENT is true
  if (!FREE_PLACEMENT) {
    for (let i = 0; i < SOCKET_POSITIONS.length; i++) {
      const [sx, sy] = SOCKET_POSITIONS[i];
      const indicator = new THREE.Mesh(
        new THREE.RingGeometry(1.5, 1.8, 16),
        new THREE.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.5 })

  const [sx, sy] = SOCKET_POSITIONS[socketIndex];

  const texSize = 64;
  const c = document.createElement('canvas');

    hits: 0,

    defaultX: sx,   // fallback slot for out-of-bounds recovery
    defaultY: sy,

// Add a new mirror at purchase — placed in the centre of mirror field, horizontal (angle=0)
function addMirror() {
  const ww = getWorldWidth();
  // Find a free socket, or place freely in the mirror field
  let socketIdx = -1;
  for (let i = 0; i < sockets.length; i++) {
    if (sockets[i].type === null) { socketIdx = i; break; }
  }
  if (socketIdx < 0) socketIdx = 0; // fallback

  const mirror = createMirror(socketIdx);
  mirror.angle = 0; // horizontal — immediately useful (reflects beams upward)

  if (FREE_PLACEMENT) {
    // Place the new mirror at the emptiest spot in the field: scan a grid of
    // candidate positions and pick the one whose nearest existing mirror is
    // furthest away. This never drops a mirror onto an occupied coordinate and
    // spreads purchases across the width. The starting mirrors sit at
    // x=-15/0/+15 on y=-25; new ones prefer the lower row (-29, whose sprite
    // still stays inside the field, spanning -35..-23) and the width extremes.
    // The field is short, so with many mirrors some proximity is unavoidable —
    // but the chosen spot is always the most separated one available.
    const halfW = Math.min(ww / 2 - 6, 26);
    const rows = [-26, -14];  // prefer the lower row (listed first) on ties
    const STEPS = 13;
    let best = { x: 0, y: -26, score: -Infinity };
    for (const cy of rows) {

          if (d < nearest) nearest = d;

    mirror.freeY = best.y;
    mirror.defaultX = best.x; // recovery slot for a purchased mirror
    mirror.defaultY = best.y;

  updateMirrorGeometry(mirror);

function drawMirrorSprite(ctx, sz) {
  const cx = sz / 2;
  const cy = sz / 2;
  ctx.clearRect(0, 0, sz, sz);

  // Wooden cart frame (horizontal bar behind the shield)
  ctx.fillStyle = '#3D2010';
  ctx.fillRect(cx - sz * 0.42, cy - 2, sz * 0.84, 4);

  // Wheels (small circles at ends)
  ctx.fillStyle = '#2A1500';
  ctx.beginPath();
  ctx.arc(cx - sz * 0.38, cy + 3, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + sz * 0.38, cy + 3, 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Wheel spokes
  ctx.strokeStyle = '#5C3D2E';
  ctx.lineWidth = 0.8;
  for (let w = -1; w <= 1; w += 2) {
    const wx = cx + w * sz * 0.38;
    const wy = cy + 3;
    ctx.beginPath(); ctx.moveTo(wx - 2, wy); ctx.lineTo(wx + 2, wy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wy - 2); ctx.lineTo(wx, wy + 2); ctx.stroke();
  }

  // Bronze polished shield face (large ellipse — wider than tall since mirror is oriented horizontally)
  const shieldRx = sz * 0.32;
  const shieldRy = sz * 0.28;
  // Metallic gradient
  const grad = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, shieldRx);
  grad.addColorStop(0, '#E8C87A');   // bright highlight
  grad.addColorStop(0.3, '#CC9944'); // polished bronze
  grad.addColorStop(0.7, '#996633'); // darker bronze
  grad.addColorStop(1, '#664422');   // rim shadow
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldRx, shieldRy, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shield rim ring
  ctx.strokeStyle = '#553311';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldRx, shieldRy, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Centre boss (raised bump)
  ctx.fillStyle = '#DDAA55';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#AA7733';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function updateMirrorGeometry(mirror) {
  let sx, sy;
  if (FREE_PLACEMENT && mirror.freeX !== undefined) {
    sx = mirror.freeX;
    sy = mirror.freeY;
  } else {
    [sx, sy] = SOCKET_POSITIONS[mirror.socketIndex];
  }
  const halfLen = mirror.length / 2;
  const cos = Math.cos(mirror.angle);
  const sin = Math.sin(mirror.angle);

  mirror.p1 = { x: sx - halfLen * cos, y: sy - halfLen * sin };
  mirror.p2 = { x: sx + halfLen * cos, y: sy + halfLen * sin };
  mirror.normal = { x: -sin, y: cos };

  mirror.mesh.position.set(sx, sy, 0);
  mirror.mesh.rotation.z = mirror.angle;

  // Specular glint: slides along the disc's surface normal and flares brightest
  // when the normal faces up toward a virtual overhead sun (normal.y -> 1).
  if (mirror.highlight) {
    const nx = mirror.normal.x, ny = mirror.normal.y;
    const off = 1.6; // how far along the normal the glint sits
    mirror.highlight.position.set(sx + nx * off, sy + ny * off, 0.05);
    // Brightness peaks when the polished face tilts toward the sun (ny high).
    const facing = Math.max(0, ny);              // 0..1
    mirror.highlight.material.opacity = 0.2 + 0.65 * facing;
  }
}

// Free placement: move mirror to position, clamped to mirror field
function moveMirrorFree(mirror, x, y) {
  const p = clampMirrorPos(x, y);
  mirror.freeX = p.x;
  mirror.freeY = p.y;
  updateMirrorGeometry(mirror);
  markDirty();
}

// Per-frame safety net: if any mirror has somehow ended up below the wall floor
// (a lost/out-of-bounds disc), snap it back to its default altar slot so it can
// never be permanently lost off-screen. Returns true if it recovered any mirror.
function sanitizeMirrors() {
  const floor = getMirrorFloorY();
  let recovered = false;
  for (const m of mirrors) {
    if (m.freeY < floor || m.freeY == null || m.freeX == null || isNaN(m.freeY) || isNaN(m.freeX)) {
      m.freeX = (m.defaultX != null) ? m.defaultX : 0;
      m.freeY = (m.defaultY != null) ? m.defaultY : MIRROR_FIELD_TOP;
      if (m.mesh) m.mesh.position.set(m.freeX, m.freeY, m.mesh.position.z);
      updateMirrorGeometry(m);
      recovered = true;
    }
  }
  if (recovered) markDirty();
  return recovered;
}

// --- Tween system ---

// Ease-out cubic: decelerates to zero
function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

// Start a tween from current visual position to target socket
function startTween(mirror, fromX, fromY) {
  const [toX, toY] = SOCKET_POSITIONS[mirror.socketIndex];
  // Remove any existing tween for this mirror
  for (let i = tweens.length - 1; i >= 0; i--) {
    if (tweens[i].mirror === mirror) tweens.splice(i, 1);
  }
  tweens.push({
    mirror,
    fromX, fromY,
    toX, toY,
    elapsed: 0,
    duration: MIRROR_TWEEN_MS / 1000
  });
}

// Called from main loop each frame. Returns true if any tween is active.
function updateMirrorTweens(dt) {
  let anyActive = false;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt;
    const t = Math.min(tw.elapsed / tw.duration, 1);
    const e = easeOut(t);

    const x = tw.fromX + (tw.toX - tw.fromX) * e;
    const y = tw.fromY + (tw.toY - tw.fromY) * e;
    tw.mirror.mesh.position.x = x;
    tw.mirror.mesh.position.y = y;

    // During tween, update geometry based on interpolated position
    // so beam sweeps smoothly
    const halfLen = tw.mirror.length / 2;
    const cos = Math.cos(tw.mirror.angle);
    const sin = Math.sin(tw.mirror.angle);
    tw.mirror.p1 = { x: x - halfLen * cos, y: y - halfLen * sin };
    tw.mirror.p2 = { x: x + halfLen * cos, y: y + halfLen * sin };
    tw.mirror.normal = { x: -sin, y: cos };
    // Keep the specular glint tracking the disc during the tween.
    if (tw.mirror.highlight) {
      tw.mirror.highlight.position.set(x + (-sin) * 1.6, y + cos * 1.6, 0.05);
    }

    markDirty(); // re-solve beam every frame during tween
    anyActive = true;

    if (t >= 1) {
      // Tween complete — snap to final position
      updateMirrorGeometry(tw.mirror);
      tweens.splice(i, 1);
    }
  }
  return anyActive;
}

// Move mirror to a new socket with tween
function moveMirrorToSocket(mirror, newSocketIndex) {
  const oldIndex = mirror.socketIndex;
  const targetSocket = sockets[newSocketIndex];

  // Capture current visual position for tween start
  const fromX = mirror.mesh.position.x;
  const fromY = mirror.mesh.position.y;

  if (targetSocket.type !== null && targetSocket.objectRef !== mirror) {
    const other = targetSocket.objectRef;
    sockets[oldIndex].type = targetSocket.type;
    sockets[oldIndex].objectRef = other;
    if (other.socketIndex !== undefined) {
      other.socketIndex = oldIndex;
      const [ox, oy] = SOCKET_POSITIONS[oldIndex];
      if (other.mesh) other.mesh.position.set(ox, oy, 0);
      if (other.p1) updateMirrorGeometry(other);
      if (other.position) {
        other.position.x = ox;
        other.position.y = oy;
      }
    }
  } else {
    sockets[oldIndex].type = null;
    sockets[oldIndex].objectRef = null;
  }

  sockets[newSocketIndex].type = 'mirror';
  sockets[newSocketIndex].objectRef = mirror;
  mirror.socketIndex = newSocketIndex;

  // Start tween from dragged position to target socket
  startTween(mirror, fromX, fromY);
  markDirty();
}

function rotateMirror(mirror, newAngle) {
  mirror.angle = newAngle;
  updateMirrorGeometry(mirror);
  markDirty();
}

function damageMirror(mirror) {
  if (mirror.shattered) return;
  mirror.hits++;
  if (mirror.hits >= MIRROR_MAX_HITS && !mirror.reinforced) {
    mirror.shattered = true;
    mirror.mesh.material.color.setHex(0x330000);
    mirror.mesh.material.opacity = 0.3;
    mirror.mesh.material.transparent = true;
    markDirty();
  } else {
    const darkness = 1 - (mirror.hits / MIRROR_MAX_HITS) * 0.4;
    mirror.mesh.material.color.setRGB(0.53 * darkness, 0.53 * darkness, 0.8 * darkness);
  }
}

function repairMirror(mirror) {
  mirror.hits = 0;
  mirror.shattered = false;
  mirror.mesh.material.color.setHex(0x8888cc);
  mirror.mesh.material.opacity = 1.0;
  mirror.mesh.material.transparent = false;
  markDirty();
}

function updateAllMirrorGeometries() {
  for (const mirror of mirrors) {
    updateMirrorGeometry(mirror);
  }
}

// Reset all mirrors to default positions, angles, and states.
// Destroys every mirror (including ones bought during the run) and rebuilds
// the starting set, so nothing purchased survives a restart.
function resetMirrors() {
  // Tear down all existing mirror meshes and clear socket occupancy
  for (let i = 0; i < mirrors.length; i++) {
    const m = mirrors[i];
    if (m.mesh) {
      if (mirrorMeshGroup) mirrorMeshGroup.remove(m.mesh);
      if (m.mesh.geometry) m.mesh.geometry.dispose();
      if (m.mesh.material) {
        if (m.mesh.material.map) m.mesh.material.map.dispose();
        m.mesh.material.dispose();
      }
    }
    // Also tear down the specular highlight sprite.
    if (m.highlight) {
      if (mirrorMeshGroup) mirrorMeshGroup.remove(m.highlight);
      if (m.highlight.geometry) m.highlight.geometry.dispose();
      if (m.highlight.material) {
        if (m.highlight.material.map) m.highlight.material.map.dispose();
        m.highlight.material.dispose();
      }
    }
  }
  mirrors.length = 0;
  tweens.length = 0;
  for (let i = 0; i < sockets.length; i++) {
    sockets[i].type = null;
    sockets[i].objectRef = null;
  }

  // Rebuild the starting mirrors (mirrors default state, same as initMirrors)
  for (let i = 0; i < MIRROR_COUNT_START; i++) {
    const socketIdx = DEFAULT_MIRROR_SOCKETS[i];
    const mirror = createMirror(socketIdx);
    mirror.angle = (i === 1) ? Math.PI / 2 : 0; // centre vertical, flanks horizontal
    updateMirrorGeometry(mirror);
    mirrors.push(mirror);
    sockets[socketIdx].type = 'mirror';
    sockets[socketIdx].objectRef = mirror;
  }
  markDirty();
}
