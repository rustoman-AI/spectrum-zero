// ============================================================
// src/crafting.js — Shop UI: mirrors, prisms, god abilities (Helios/Zeus/Poseidon)
// Rendered as in-scene canvas texture at bottom of playfield.
// ============================================================











let trayMesh = null;
let trayCanvas = null;
let trayCtx = null;
let trayTexture = null;
let trayY = 0;
let trayWidth = 0;
const trayHeight = 5;
let mirrorsBought = 0;
let focusCount = 0;
let zeusCount = 0;
let poseidonCount = 0;
let heliosCount = 0;
let zeusCooldown = 0;       // seconds remaining (drawn as radial wipe)
let poseidonCooldown = 0;
let heliosCooldown = 0;
const ZEUS_COOLDOWN_TIME = 8;     // seconds
const POSEIDON_COOLDOWN_TIME = 10;
const HELIOS_COOLDOWN_TIME = 7;
const prevAffordable = [];  // track per-button affordability for pulse
const pulseTimes = [];      // countdown for 300ms pulse animation

// The prism upgrade is a single slot that advances 4 -> 5 -> 6 and then
// disappears once tier 6 is owned. Owned tiers can never be repurchased.
const PRISM_UPGRADES = {
  3: { id: 'prism4', label: '4-Prism', tier: 4, getCost: () => SHOP.prism4 },
  4: { id: 'prism5', label: '5-Prism', tier: 5, getCost: () => SHOP.prism5 },
  5: { id: 'prism6', label: '6-Prism', tier: 6, getCost: () => SHOP.prism6 },
};

// Build the visible shop list for the current frame. The prism slot reflects
// the next tier the player can buy (or is omitted entirely at max tier), so the
// layout stays a fixed, non-overlapping grid that shrinks as tiers max out.
function buildShopItems() {
  const items = [
    { id: 'mirror', label: 'Mirror', getCost: () => ({ bronze: SHOP.mirror.bronze + mirrorsBought * SHOP.mirror.scaling }) },
  ];
  const upgrade = PRISM_UPGRADES[getActiveTier()];
  if (upgrade) items.push(upgrade);
  items.push(
    { id: 'helios', label: 'Helios', getCost: () => {
      const costs = GOD_ABILITIES.helios.costs;
      return costs[Math.min(heliosCount, costs.length - 1)];
    } },
    { id: 'zeus', label: 'Zeus', getCost: () => {
      const costs = GOD_ABILITIES.zeus.costs;
      return costs[Math.min(zeusCount, costs.length - 1)];
    } },
    { id: 'poseidon', label: 'Poseidon', getCost: () => {
      const costs = GOD_ABILITIES.poseidon.costs;
      return costs[Math.min(poseidonCount, costs.length - 1)];
    } },
  );
  return items;
}

function getFocusMultiplier() { return 1 + focusCount * 0.15; }

function initCrafting() {
  const oScene = getOverlayScene();
  const worldWidth = getWorldWidth();
  mirrorsBought = 0;
  activeTier = 3;
  focusCount = 0;

  trayWidth = worldWidth * 0.95;
  trayY = -WORLD_HEIGHT / 2 + 3;

  // 2x-resolution backing canvas (1024x80) drawn in a 512x40 logical space so
  // the small cost text stays crisp when the tray plane is upscaled on a phone.
  trayCanvas = document.createElement('canvas');
  trayCanvas.width = 1024;
  trayCanvas.height = 80;
  trayCtx = trayCanvas.getContext('2d');
  trayCtx.scale(2, 2); // logical coordinates remain 512x40

  trayTexture = new THREE.CanvasTexture(trayCanvas);
  trayTexture.minFilter = THREE.LinearFilter;

  const geo = new THREE.PlaneGeometry(trayWidth, trayHeight);
  const mat = new THREE.MeshBasicMaterial({ map: trayTexture, transparent: true, depthWrite: false });
  trayMesh = new THREE.Mesh(geo, mat);
  trayMesh.position.set(0, trayY, 0);
  oScene.add(trayMesh);
}

function updateCraftingTray() {
  if (!trayCtx) return;
  // Tick cooldowns (approx 1 frame at 60fps)
  const cdt = 0.016;
  if (zeusCooldown > 0) zeusCooldown -= cdt;
  if (poseidonCooldown > 0) poseidonCooldown -= cdt;
  if (heliosCooldown > 0) heliosCooldown -= cdt;
  const res = getResources();
  const faith = getFaith();

  trayCtx.clearRect(0, 0, 512, 40);
  trayCtx.fillStyle = 'rgba(0,0,0,0.7)';
  trayCtx.fillRect(0, 0, 512, 40);

  const shopItems = buildShopItems();
  const btnW = 512 / shopItems.length;
  for (let i = 0; i < shopItems.length; i++) {
    const item = shopItems[i];
    const cost = item.getCost();
    // A god power on cooldown cannot be bought yet, so it should not read as
    // "ready" even if the player can afford it. The instant the cooldown hits
    // 0 (recomputed every frame) the button lights up with its real state.
    const onCooldown =
      (item.id === 'zeus' && zeusCooldown > 0) ||
      (item.id === 'poseidon' && poseidonCooldown > 0) ||
      (item.id === 'helios' && heliosCooldown > 0);
    const canAfford = canAffordCombined(cost, res, faith);
    const affordable = canAfford && !onCooldown;
    const x = i * btnW;

    // Detect affordability crossing → trigger 300ms pulse
    if (prevAffordable[i] === false && affordable) {
      pulseTimes[i] = 0.3;
    }
    prevAffordable[i] = affordable;
    if (pulseTimes[i] > 0) pulseTimes[i] -= 0.016; // approx 1 frame

    const pulsing = pulseTimes[i] > 0;

    // Zeus button: extra-loud pulsing when ready
    const isZeusBtn = item.id === 'zeus';
    const zeusGlow = isZeusBtn && isZeusReady();
    const zeusPhase = zeusGlow ? (Math.sin(Date.now() * 0.008) * 0.5 + 0.5) : 0;

    let bgColour, borderCol;
    if (zeusGlow) {
      // Zeus ready: bright gold pulsing
      const glow = 0.6 + zeusPhase * 0.4;
      bgColour = `rgba(${Math.floor(180*glow)},${Math.floor(140*glow)},${Math.floor(40*glow)},1)`;
      borderCol = '#FFDD44';
    } else {
      bgColour = affordable ? (pulsing ? 'rgba(130,130,200,1)' : 'rgba(70,70,120,0.9)') : 'rgba(40,40,50,0.6)';
      borderCol = affordable ? (pulsing ? '#ffffff' : '#9999cc') : 'rgba(60,60,80,0.4)';
    }

    trayCtx.fillStyle = bgColour;
    trayCtx.fillRect(x + 1, 1, btnW - 2, 38);

    // ---- Ready-state pulse glow --------------------------------------------
    // When a button is affordable AND actionable, wrap it in a continuously
    // pulsing bright border so the player can't miss that the ability is ready.
    // This is the in-canvas equivalent of a CSS keyframe border-glow. Zeus keeps
    // its dedicated gold treatment; every other ready button pulses green so it
    // reads as "go". The pulse is a slow sine (kept subtle so it never fights
    // the playfield) that drives both the border brightness and an outer
    // shadowBlur halo.
    const readyPulse = affordable && !zeusGlow;
    if (readyPulse) {
      // 0..1 slow sine (~1.4 Hz). Phase-offset per button so the row shimmers
      // rather than strobing in unison.
      const phase = Math.sin(Date.now() * 0.009 + i * 0.7) * 0.5 + 0.5;
      const glowCol = '#4EFE82';             // bright "ready" green
      trayCtx.save();
      trayCtx.strokeStyle = glowCol;
      trayCtx.shadowColor = glowCol;
      trayCtx.shadowBlur = 4 + phase * 8;    // breathing outer halo
      trayCtx.lineWidth = 2 + phase * 1.5;   // 2..3.5px breathing border
      trayCtx.globalAlpha = 0.65 + phase * 0.35;
      trayCtx.strokeRect(x + 2, 2, btnW - 4, 36);
      trayCtx.restore();
    }

    // Base border (drawn on top so the crisp edge stays sharp over the glow)
    trayCtx.strokeStyle = borderCol;
    trayCtx.lineWidth = zeusGlow ? 3 : (pulsing ? 2.5 : (affordable ? 1.5 : 0.5));
    trayCtx.strokeRect(x + 1, 1, btnW - 2, 38);

    // Clip text to this button cell so labels can never bleed into neighbours
    trayCtx.save();
    trayCtx.beginPath();
    trayCtx.rect(x + 1, 1, btnW - 2, 38);
    trayCtx.clip();

    const cxc = x + btnW / 2;
    const iconTint = (affordable || zeusGlow) ? '#ffffff' : '#888888';
    const hasIcon = (item.id === 'zeus' || item.id === 'helios' || item.id === 'poseidon');
    // God abilities get a vector icon at the top, then name, then cost — so the
    // three rows are: icon (y~8), name (y~20), cost (y~31). Non-ability items
    // keep the classic name (y~13) + cost (y~27) layout.
    if (hasIcon) {
      drawAbilityIcon(item.id, cxc, 8, 8, iconTint);
    }

    // Kill any inherited shadow before drawing text. The ready-pulse glow above
    // sets shadowBlur inside a save/restore, but we belt-and-suspenders clear it
    // here so glyphs never pick up a green halo that reads as a ghost/double.
    trayCtx.shadowBlur = 0;
    trayCtx.shadowColor = 'transparent';

    // Wipe the name band back to the flat button background before drawing it,
    // matching the cost-band wipe below, so no sub-label can ever ghost/stack.
    const nameY = hasIcon ? 20 : 13;
    trayCtx.fillStyle = bgColour;
    trayCtx.fillRect(x + 1, nameY - 8, btnW - 2, 11);

    trayCtx.fillStyle = (affordable || zeusGlow) ? '#ffffff' : '#777777';
    trayCtx.font = 'bold 8px monospace';
    trayCtx.textAlign = 'center';
    trayCtx.fillText(item.label, cxc, nameY);

    // Cost line — but ONLY when the button is NOT on cooldown. During cooldown
    // the radial timer draws its own "Ns" in the same spot; showing both stacks
    // the two strings, so we show one or the other, never both.
    if (!onCooldown) {
      // Wipe the cost-text band back to the flat button background first, so a
      // multi-token cost (e.g. Helios "15Si 20Bz") can never leave a ghosted /
      // stacked remnant from a wider previous string or the glow halo. We're
      // already clipped to this button cell, so this only repaints its own row.
      const costY = hasIcon ? 31 : 27;
      trayCtx.fillStyle = bgColour;
      trayCtx.fillRect(x + 1, costY - 8, btnW - 2, 12);
      drawCostTokens(cost, res, faith, cxc, costY, btnW);
    }

    trayCtx.restore();

    // Radial cooldown overlay for god powers
    let cooldownFrac = 0;
    let cooldownTotal = 0;
    if (item.id === 'zeus' && zeusCooldown > 0) { cooldownFrac = zeusCooldown / ZEUS_COOLDOWN_TIME; cooldownTotal = ZEUS_COOLDOWN_TIME; }
    if (item.id === 'poseidon' && poseidonCooldown > 0) { cooldownFrac = poseidonCooldown / POSEIDON_COOLDOWN_TIME; cooldownTotal = POSEIDON_COOLDOWN_TIME; }
    if (item.id === 'helios' && heliosCooldown > 0) { cooldownFrac = heliosCooldown / HELIOS_COOLDOWN_TIME; cooldownTotal = HELIOS_COOLDOWN_TIME; }
    if (cooldownFrac > 0) {
      // Dark radial wipe (pie slice from top, clockwise), CLIPPED to this
      // button cell and sized so it never spills past the button into the bar
      // below the battlement. Radius kept within the button half-height.
      const cx = x + btnW / 2;
      const cy = 20;
      const r = 15; // < half the 38px button height, stays inside the cell
      trayCtx.save();
      // Clip strictly to the button rect so the arc can never bleed outside it.
      trayCtx.beginPath();
      trayCtx.rect(x + 1, 1, btnW - 2, 38);
      trayCtx.clip();
      trayCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      trayCtx.beginPath();
      trayCtx.moveTo(cx, cy);
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + cooldownFrac * Math.PI * 2;
      trayCtx.arc(cx, cy, r, startAngle, endAngle);
      trayCtx.closePath();
      trayCtx.fill();
      // Cooldown seconds text, centred on the button (no cost shown while cooling).
      trayCtx.fillStyle = '#ffffff';
      trayCtx.font = 'bold 11px monospace';
      trayCtx.textAlign = 'center';
      trayCtx.textBaseline = 'middle';
      trayCtx.fillText(Math.ceil(cooldownFrac * cooldownTotal) + 's', cx, 22);
      trayCtx.textBaseline = 'alphabetic';
      trayCtx.restore();
    }
  }
  trayTexture.needsUpdate = true;
}

function handleCraftTap(worldX, worldY) {
  const halfW = trayWidth / 2;
  const halfH = trayHeight / 2;
  if (worldY < trayY - halfH || worldY > trayY + halfH) return false;
  if (worldX < -halfW || worldX > halfW) return false;

  const shopItems = buildShopItems();
  const normX = (worldX + halfW) / trayWidth;
  const btnIndex = Math.floor(normX * shopItems.length);
  if (btnIndex < 0 || btnIndex >= shopItems.length) return false;

  return attemptPurchase(shopItems[btnIndex]);
}

function resetCrafting() {
  mirrorsBought = 0;
  focusCount = 0;
  zeusCount = 0;
  poseidonCount = 0;
  heliosCount = 0;
  zeusCooldown = 0;
  poseidonCooldown = 0;
  heliosCooldown = 0;
  if (typeof resetTier === 'function') resetTier();
}

function attemptPurchase(item) {
  // Block god powers during cooldown
  if (item.id === 'zeus' && zeusCooldown > 0) return false;
  if (item.id === 'poseidon' && poseidonCooldown > 0) return false;
  if (item.id === 'helios' && heliosCooldown > 0) return false;
  // Guard: never allow buying a prism tier at or below the one already owned.
  if (item.tier && getActiveTier() >= item.tier) return false;
  const res = getResources();
  const faith = getFaith();
  const cost = item.getCost();
  if (!canAffordCombined(cost, res, faith)) return false;

  // Spend resources
  const resCost = {};
  for (const k in cost) {
    if (k === 'faith') { spendFaith(cost[k]); }
    else { resCost[k] = cost[k]; }
  }
  if (Object.keys(resCost).length > 0) spend(resCost);

  switch (item.id) {
    case 'mirror': mirrorsBought++; addMirror(); break;
    case 'prism4': setTier(4); markDirty(); break;
    case 'prism5': setTier(5); markDirty(); break;
    case 'prism6': setTier(6); markDirty(); break;
    case 'helios': heliosCount++; heliosCooldown = HELIOS_COOLDOWN_TIME; triggerHelios(); break;
    case 'zeus': zeusCount++; zeusCooldown = ZEUS_COOLDOWN_TIME; triggerZeusStrike(); break;
    case 'poseidon': poseidonCount++; poseidonCooldown = POSEIDON_COOLDOWN_TIME; triggerPoseidonStrike(); break;
  }
  return true;
}

function canAffordCombined(cost, res, faith) {
  for (const k in cost) {
    if (k === 'faith') { if (faith < cost[k]) return false; }
    else { if ((res[k] || 0) < cost[k]) return false; }
  }
  return true;
}

function isZeusAffordable() {
  const res = getResources();
  const faith = getFaith();
  const costs = GOD_ABILITIES.zeus.costs;
  const cost = costs[Math.min(zeusCount, costs.length - 1)];
  return canAffordCombined(cost, res, faith);
}

function costStr(cost) {
  const labels = { bronze: 'Bz', silver: 'Si', gold: 'Au', faith: 'Fa' };
  const parts = [];
  for (const k in cost) {
    parts.push(cost[k] + (labels[k] || k[0]));
  }
  return parts.join(' ');
}

// Draw the cost as separate tokens, centred at (centreX, y). Tokens the player
// can afford render light; tokens they can't afford render red so it's obvious
// which currency is short.
// Draw a small vector icon for a god ability, centred at (cx, cy) on the tray
// canvas. `s` is the icon half-extent (px). `col` is the stroke/fill colour.
function drawAbilityIcon(id, cx, cy, s, col) {
  trayCtx.save();
  trayCtx.strokeStyle = col;
  trayCtx.fillStyle = col;
  trayCtx.lineJoin = 'round';
  trayCtx.lineCap = 'round';
  if (id === 'zeus') {
    // Lightning bolt: a filled zig-zag.
    trayCtx.beginPath();
    trayCtx.moveTo(cx + s * 0.35, cy - s);
    trayCtx.lineTo(cx - s * 0.5, cy + s * 0.15);
    trayCtx.lineTo(cx - s * 0.02, cy + s * 0.15);
    trayCtx.lineTo(cx - s * 0.35, cy + s);
    trayCtx.lineTo(cx + s * 0.55, cy - s * 0.2);
    trayCtx.lineTo(cx + s * 0.05, cy - s * 0.2);
    trayCtx.closePath();
    trayCtx.fill();
  } else if (id === 'helios') {
    // Radiant sun: filled disc + 8 rays.
    trayCtx.lineWidth = 1.3;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      trayCtx.beginPath();
      trayCtx.moveTo(cx + Math.cos(a) * s * 0.7, cy + Math.sin(a) * s * 0.7);
      trayCtx.lineTo(cx + Math.cos(a) * s * 1.15, cy + Math.sin(a) * s * 1.15);
      trayCtx.stroke();
    }
    trayCtx.beginPath();
    trayCtx.arc(cx, cy, s * 0.5, 0, Math.PI * 2);
    trayCtx.fill();
  } else if (id === 'poseidon') {
    // Classic Greek trident: three pointed tines curving UP from a central
    // staff. Coordinates are measured from the button top so the tine tips keep
    // ~6px padding below the border (button top is y≈1 → tips at ~y7).
    trayCtx.lineWidth = 1.3;
    const tipY = 7;                 // outer tine tips (≈6px below the border)
    const crossY = tipY + s * 0.7;  // where the outer tines curve back to
    const midTipY = 6;              // centre tine tip (kept ≥6px from border)
    const baseY = 17;               // staff ends above the name row (y≈20)
    const spread = s * 0.8;         // half-distance between outer tines
    // Central staff + centre tine
    trayCtx.beginPath();
    trayCtx.moveTo(cx, midTipY);
    trayCtx.lineTo(cx, baseY);
    // Left tine: curves outward then up to a point
    trayCtx.moveTo(cx, crossY);
    trayCtx.quadraticCurveTo(cx - spread, crossY, cx - spread, tipY);
    // Right tine
    trayCtx.moveTo(cx, crossY);
    trayCtx.quadraticCurveTo(cx + spread, crossY, cx + spread, tipY);
    trayCtx.stroke();
    // Small pointed barbs at each tine tip for the "spear" read.
    trayCtx.beginPath();
    for (const tx of [cx - spread, cx, cx + spread]) {
      const ty = (tx === cx) ? midTipY : tipY;
      trayCtx.moveTo(tx - 1, ty + 1.5);
      trayCtx.lineTo(tx, ty - 0.5);
      trayCtx.lineTo(tx + 1, ty + 1.5);
    }
    trayCtx.stroke();
  }
  trayCtx.restore();
}

const COST_LABELS = { bronze: 'Bz', silver: 'Si', gold: 'Au', faith: 'Fa' };
const COST_SEP = ' + '; // explicit separator, e.g. "15Si + 20Bz"
// Draw the cost as clean colour-coded tokens on ONE line joined by " + ", e.g.
// "15Si + 20Bz". Affordable currencies render light; short ones render red so
// it's obvious which is missing. The separator is a dim neutral glyph drawn as
// its own segment so spacing stays exact. The whole line is auto-shrunk to fit
// the button width so it never overflows, wraps, or leaves fragments from a
// previous state (the caller also wipes the cost band each frame).
function drawCostTokens(cost, res, faith, centreX, y, btnW) {
  // Build tokens (compact "15Si" form).
  const tokens = [];
  for (const k in cost) {
    const have = (k === 'faith') ? faith : (res[k] || 0);
    tokens.push({ text: cost[k] + (COST_LABELS[k] || k[0]), ok: have >= cost[k] });
  }
  if (tokens.length === 0) return;

  const maxW = btnW - 10; // keep a clear margin from the button edges

  // Find the largest font (<=8px) at which the whole "A + B" line fits maxW.
  let fontPx = 8;
  const measureTotal = () => {
    trayCtx.font = 'bold ' + fontPx + 'px monospace';
    let w = 0;
    for (let t = 0; t < tokens.length; t++) {
      w += trayCtx.measureText(tokens[t].text).width;
      if (t < tokens.length - 1) w += trayCtx.measureText(COST_SEP).width;
    }
    return w;
  };
  let totalW = measureTotal();
  while (totalW > maxW && fontPx > 5.5) { fontPx -= 0.5; totalW = measureTotal(); }

  trayCtx.textAlign = 'left';
  let cx = centreX - totalW / 2;
  for (let t = 0; t < tokens.length; t++) {
    trayCtx.fillStyle = tokens[t].ok ? '#dddddd' : '#ff5555';
    trayCtx.fillText(tokens[t].text, cx, y);
    cx += trayCtx.measureText(tokens[t].text).width;
    if (t < tokens.length - 1) {
      // Dim neutral "+" separator between currencies.
      trayCtx.fillStyle = '#999999';
      trayCtx.fillText(COST_SEP, cx, y);
      cx += trayCtx.measureText(COST_SEP).width;
    }
  }
  trayCtx.textAlign = 'center'; // restore for subsequent draws
}


// === src/effects.js ===
// ============================================================
// src/effects.js — Contact glow, sparks, destruction sequence, audio
// Pooled sprites, no per-frame allocation.
// ============================================================



// --- Soft radial sprite textures (shared) ---
// A round soft glow (bright centre → transparent edge) used for glows/embers,
// and a softer, fuzzier puff used for smoke. Replaces flat square particles.
let _glowTex = null, _smokeTex = null;
function radialTexture(stops) {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  for (const [pos, col] of stops) g.addColorStop(pos, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
function getGlowTex() {
  if (!_glowTex) _glowTex = radialTexture([
    [0.0, 'rgba(255,255,255,1)'],
    [0.35, 'rgba(255,255,255,0.7)'],
    [1.0, 'rgba(255,255,255,0)'],
  ]);
  return _glowTex;
}
function getSmokeTex() {
  if (!_smokeTex) _smokeTex = radialTexture([
    [0.0, 'rgba(255,255,255,0.55)'],
    [0.5, 'rgba(255,255,255,0.28)'],
    [1.0, 'rgba(255,255,255,0)'],
  ]);
  return _smokeTex;
}

// --- Contact glow pool (beam hitting enemy) ---
const GLOW_POOL_SIZE = 8;
const glowPool = [];
const GLOW_LIFE = 0.15;      // seconds — fixed flash lifetime
const GLOW_BASE = 1.5;       // base plane size (world units)
// Cap so peak rendered glow (GLOW_BASE * scale) stays ~1.2x a mid ship (~3.5u):
// 1.5 * 2.6 = 3.9 units. Never dwarfs the ship or its neighbours.
const GLOW_MAX_SCALE = 2.6;

// --- Spark pool (short-lived particles on damage) ---
const SPARK_POOL_SIZE = 24;
const sparkPool = [];

// --- Debris pool (destruction particles) ---
const DEBRIS_POOL_SIZE = 16;
const debrisPool = [];

// --- Smoke puff pool (drifting smoke on hits/destruction + ship wakes) ---
// Larger now that wakes spawn V-shaped pairs behind every moving ship.
const SMOKE_POOL_SIZE = 48;
const smokePool = [];

// --- WebAudio context (created on first user interaction) ---
let audioCtx = null;

function initEffects() {
  const scene = getScene();
  // Contact glows — soft round radial sprite (not a flat square).
  for (let i = 0; i < GLOW_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(1.5, 1.5);
    const mat = new THREE.MeshBasicMaterial({
      map: getGlowTex(), color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.4;
    scene.add(mesh);
    glowPool.push({ mesh, life: 0, colour: 0xffffff, scale: 1 });
  }
  // Embers — soft round glowing motes that rise and arc (was flat sparks).
  for (let i = 0; i < SPARK_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(0.7, 0.7);
    const mat = new THREE.MeshBasicMaterial({
      map: getGlowTex(), color: 0xffcc00, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.5;
    scene.add(mesh);
    sparkPool.push({ mesh, life: 0, maxLife: 0.4, vx: 0, vy: 0, baseSize: 0.7 });
  }
  // Smoke puffs — soft grey radial, drift up + grow + fade (normal blending).
  for (let i = 0; i < SMOKE_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({
      map: getSmokeTex(), color: 0x4a4038, transparent: true, opacity: 0,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.35;
    scene.add(mesh);
    smokePool.push({ mesh, life: 0, maxLife: 1, vx: 0, vy: 0, size0: 1, grow: 2, spin: 0 });
  }
  // Debris
  for (let i = 0; i < DEBRIS_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(1.2, 1.2);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x886644, transparent: true, opacity: 0, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.3;
    scene.add(mesh);
    debrisPool.push({ mesh, life: 0, vx: 0, vy: 0, gravity: 0 });
  }
}

function updateEffects(dt) {
  // Glows: smooth opacity fade over the fixed 0.15s life. Scale is set once at
  // spawn and held constant — no growth-on-decay, so repeated beam ticks can't
  // compound the flash into a swelling blob.
  for (const g of glowPool) {
    if (g.life > 0) {
      g.life -= dt;
      g.mesh.material.opacity = Math.max(0, (g.life / GLOW_LIFE) * 0.45);
      g.mesh.scale.set(g.scale, g.scale, 1);
      if (g.life <= 0) g.mesh.visible = false;
    }
  }
  // Embers: rise + arc + gentle flicker, warm fade. Slight upward buoyancy
  // (negative gravity pull) so they float up like sparks off a fire.
  for (const s of sparkPool) {
    if (s.life > 0) {
      s.life -= dt;
      s.mesh.position.x += s.vx * dt;
      s.mesh.position.y += s.vy * dt;
      s.vy += 6 * dt;   // buoyancy: drift upward over time
      s.vx *= 0.96;     // air drag
      const t = s.life / s.maxLife; // 1 -> 0
      const flicker = 0.75 + 0.25 * Math.sin(performance.now() * 0.03 + s.mesh.id);
      s.mesh.material.opacity = Math.max(0, t) * flicker;
      const size = s.baseSize * (0.6 + 0.4 * t);
      s.mesh.scale.set(size, size, 1);
      if (s.life <= 0) s.mesh.visible = false;
    }
  }
  // Smoke puffs: drift up, expand, fade out.
  for (const p of smokePool) {
    if (p.life > 0) {
      p.life -= dt;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.y += p.vy * dt;
      p.vy += 3 * dt;   // rise faster as it lifts
      p.vx *= 0.97;
      const t = p.life / p.maxLife; // 1 -> 0
      const size = p.size0 + (1 - t) * p.grow; // grows as it ages
      p.mesh.scale.set(size, size, 1);
      p.mesh.rotation.z += p.spin * dt;
      p.mesh.material.opacity = Math.max(0, t) * 0.5; // never fully opaque
      if (p.life <= 0) p.mesh.visible = false;
    }
  }
  // Debris: move + gravity + fade
  for (const d of debrisPool) {
    if (d.life > 0) {
      d.life -= dt;
      d.mesh.position.x += d.vx * dt;
      d.mesh.position.y += d.vy * dt;
      d.vy -= d.gravity * dt;
      d.mesh.material.opacity = Math.max(0, d.life / 1.5);
      d.mesh.rotation.z += 3 * dt;
      if (d.life <= 0) d.mesh.visible = false;
    }
  }
}

// Spawn drifting smoke puffs at a position (dark combustion smoke).
function spawnSmoke(x, y, count, colour) {
  let spawned = 0;
  for (const p of smokePool) {
    if (spawned >= count) break;
    if (p.life <= 0) {
      p.mesh.position.set(x + (Math.random() - 0.5) * 1.5, y, 0.35);
      p.mesh.material.color.setHex(colour != null ? colour : 0x4a4038);
      p.mesh.material.opacity = 0.5;
      p.mesh.visible = true;
      p.life = p.maxLife = 0.9 + Math.random() * 0.8;
      p.vx = (Math.random() - 0.5) * 4;
      p.vy = 4 + Math.random() * 4;
      p.size0 = 1.2 + Math.random() * 0.8;
      p.grow = 2.5 + Math.random() * 2;
      p.spin = (Math.random() - 0.5) * 1.5;
      p.mesh.scale.set(p.size0, p.size0, 1);
      spawned++;
    }
  }
}

// Spawn a light, short-lived foam WAKE puff behind a moving ship. Small and
// quick so the shared pool recycles fast even with many ships on screen.
// Spawn a V-SHAPED foam wake behind a moving ship: two small foam puffs at the
// stern that drift outward-and-behind (ships travel downward, so "behind" is
// upward), tracing the spreading V of a bow/stern wave. Small + short so the
// shared pool recycles fast even with many ships on screen.
function spawnWake(x, y, colour) {
  const col = (colour != null) ? colour : 0x9fb8c4;
  let placed = 0;
  for (const p of smokePool) {
    if (placed >= 2) break;
    if (p.life <= 0) {
      const side = placed === 0 ? -1 : 1; // left arm then right arm of the V
      p.mesh.position.set(x + side * 0.6, y, 0.32);
      p.mesh.material.color.setHex(col);
      p.mesh.material.opacity = 0.3;
      p.mesh.visible = true;
      p.life = p.maxLife = 0.55 + Math.random() * 0.3;
      p.vx = side * (2.5 + Math.random() * 1.5);  // spread outward → the V opens
      p.vy = 2.5 + Math.random() * 1.5;           // trail behind (upward)
      p.size0 = 0.6 + Math.random() * 0.3;
      p.grow = 1.2;                               // widen slightly as it trails
      p.spin = 0;
      p.mesh.scale.set(p.size0, p.size0, 1);
      placed++;
    }
  }
}

// Spawn a contact glow at position, scaled by DPS
function spawnContactGlow(x, y, colour, dps) {
  for (const g of glowPool) {
    if (g.life <= 0) {
      g.mesh.position.x = x;
      g.mesh.position.y = y;
      g.mesh.material.color.setHex(colour);
      g.mesh.material.opacity = 0.45; // calmer flash (was 0.7 — too distracting)
      g.mesh.visible = true;
      g.life = GLOW_LIFE;
      // Scale grows gently with DPS but is hard-clamped so it never balloons.
      g.scale = Math.min(GLOW_MAX_SCALE, 1.0 + dps / 120);
      g.colour = colour;
      return;
    }
  }
}

// Spawn rising embers at position (soft round glowing motes).
function spawnSparks(x, y, colour, count) {
  for (let n = 0; n < count; n++) {
    for (const s of sparkPool) {
      if (s.life <= 0) {
        s.mesh.position.set(x, y, 0.5);
        s.mesh.material.color.setHex(colour);
        s.mesh.material.opacity = 1;
        s.mesh.visible = true;
        s.life = s.maxLife = 0.4 + Math.random() * 0.4;
        s.baseSize = 0.5 + Math.random() * 0.5;
        // Fan outward but biased upward so they read as rising embers.
        s.vx = (Math.random() - 0.5) * 16;
        s.vy = 6 + Math.random() * 14;
        s.mesh.scale.set(s.baseSize, s.baseSize, 1);
        break;
      }
    }
  }
}

// Destruction sequence: flash + debris + audio
// heavy=true for flagship/large ships → deeper bass + bigger flash
function spawnDestruction(x, y, heavy) {
  // Flash (large bright glow)
  spawnContactGlow(x, y, 0xffffff, heavy ? 160 : 100);
  // Rising embers + drifting smoke puffs for an organic burn/explosion.
  spawnSparks(x, y, 0xffaa33, heavy ? 10 : 6);
  spawnSmoke(x, y, heavy ? 5 : 3);
  // Debris particles
  for (let i = 0; i < 8; i++) {
    for (const d of debrisPool) {
      if (d.life <= 0) {
        d.mesh.position.x = x;
        d.mesh.position.y = y;
        d.mesh.material.opacity = 1;
        d.mesh.visible = true;
        d.life = 0.8 + Math.random() * 0.7; // 0.8-1.5s
        d.vx = (Math.random() - 0.5) * 25;
        d.vy = Math.random() * 15 + 5;
        d.gravity = 20 + Math.random() * 10;
        d.mesh.rotation.z = Math.random() * 6.28;
        break;
      }
    }
  }
  // Audio: wood crack + thump (+ sub-bass for heavy ships)
  playDestructionSound(heavy);
}

// --- WebAudio synthesis ---
let fxMaster = null;   // shared compressor+lowpass tail for this context
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
    // Master softener: compressor + gentle 4500Hz lowpass, matching audio.js so
    // the destruction noise burst can't spike into harsh, clicky top end.
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.25;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 4500; lp.Q.value = 0.707;
    comp.connect(lp).connect(audioCtx.destination);
    fxMaster = comp;
  }
  return audioCtx;
}

function playDestructionSound(heavy) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const out = fxMaster || ctx.destination;
  const now = ctx.currentTime;
  // Wood crack: short noise burst
  const noiseLen = heavy ? 0.14 : 0.08;
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * noiseLen, ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(heavy ? 0.4 : 0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, now + noiseLen);
  noise.connect(noiseGain).connect(out);
  noise.start(now);
  // Low thump: sine at 60Hz
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(60, now);
  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.4, now);
  oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(oscGain).connect(out);
  osc.start(now);
  osc.stop(now + 0.2);
  // Heavy ships: deep sub-bass explosion (rumbling drop from 40Hz -> 22Hz)
  if (heavy) {
    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(40, now);
    sub.frequency.exponentialRampToValueAtTime(22, now + 0.45);
    const subGain = ctx.createGain();
    subGain.gain.setValueAtTime(0.6, now);
    subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    sub.connect(subGain).connect(out);
    sub.start(now);
    sub.stop(now + 0.55);
  }
}

function resetEffects() {
  for (const g of glowPool) { g.life = 0; g.mesh.visible = false; }
  for (const s of sparkPool) { s.life = 0; s.mesh.visible = false; }
  for (const d of debrisPool) { d.life = 0; d.mesh.visible = false; }
  for (const p of smokePool) { p.life = 0; p.mesh.visible = false; }
}


// === src/audio.js ===
// ============================================================
// src/audio.js — WebAudio synthesis, no audio files
//
// Beam hum, prism chime, burn hiss, destruction, wall damage,
// altar tone. Pooled oscillators, master gain, mute toggle.
// ============================================================

let ctx = null;
let masterGain = null;
let muted = false;
let muteBtn = null;
// Overall SFX master level. Dropped from 0.5 to 0.4 (-20%) in the polish pass to
// give the compressor/lowpass headroom and take the edge off loud stacks.
const MASTER_GAIN = 0.4;

// Pools
let hum = null;
let humGain = null;
let burnNoise = null;
let burnGain = null;
let altarOsc = null;
let altarGain = null;

const MAX_VOICES = 6;
let activeVoices = 0;

function initAudio() {
  // Create mute button (DOM, top-right corner)
  muteBtn = document.createElement('div');
  muteBtn.textContent = '🔊';
  muteBtn.style.cssText = 'position:fixed;top:8px;right:8px;font-size:20px;cursor:pointer;z-index:99999;user-select:none;';
  muteBtn.addEventListener('pointerdown', toggleMute);
  document.body.appendChild(muteBtn);
}

function ensureCtx() {
  if (ctx) return ctx;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    // Overall SFX gain reduced 20% (0.5 -> 0.4) per polish pass. See MASTER_GAIN.
    masterGain.gain.value = muted ? 0 : MASTER_GAIN;
    // Master softening chain: every voice routes through masterGain, so a single
    // compressor + gentle lowpass at the tail tames ear-piercing clicks/beeps
    // and stops loud stacks (many SFX at once) from clipping.
    //   masterGain -> compressor -> lowpass(4500Hz) -> destination
    const masterComp = ctx.createDynamicsCompressor();
    masterComp.threshold.value = -18;  // start gently compressing above -18 dB
    masterComp.knee.value = 24;        // soft knee for a smooth, un-pumpy limit
    masterComp.ratio.value = 4;        // 4:1 — limiter-ish but musical
    masterComp.attack.value = 0.003;
    masterComp.release.value = 0.25;
    const masterLp = ctx.createBiquadFilter();
    masterLp.type = 'lowpass';
    masterLp.frequency.value = 4500;   // roll off the harsh top end
    masterLp.Q.value = 0.707;          // Butterworth (no resonant peak)
    masterGain.connect(masterComp);
    masterComp.connect(masterLp);
    masterLp.connect(ctx.destination);
    setupHum();
    setupBurnNoise();
    setupAltarTone();
    setupSeaAmbience();
  } catch (e) { return null; }
  return ctx;
}

// ============================================================
// SEA AMBIENCE — continuous filtered PINK NOISE (the ocean bed), with its gain
// modulated by a slow 0.1Hz LFO so it rhythmically swells and recedes like
// waves washing against the stone battlement. No discrete bursts, no drone.
// ============================================================
let breezeGain = null;      // base sea-bed level (also the mute/reset handle)
let waveLfoGain = null;     // LFO depth → adds to breezeGain via the LFO
let waveLfo = null;         // 0.1Hz sine LFO
function setupSeaAmbience() {
  // --- True pink noise via Paul Kellet's economical filter ---
  const bufLen = ctx.sampleRate * 4; // 4s loop, long enough to avoid obvious tiling
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < bufLen; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
    b6 = white * 0.115926;
    d[i] = pink * 0.11; // normalise the pink sum toward [-1,1]
  }
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  // Lowpass to soften into a watery/airy bed (roll off the hiss).
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900;

  // Base gain = quiet steady bed; the LFO adds a swelling amount on top.
  breezeGain = ctx.createGain();
  breezeGain.gain.value = 0.05;

  // 0.1Hz LFO (one full wave every 10s) → modulates a depth gain that sums into
  // the base bed, so the noise breathes in and out like surf.
  waveLfo = ctx.createOscillator();
  waveLfo.type = 'sine';
  waveLfo.frequency.value = 0.1; // ocean-wave period ~10s
  waveLfoGain = ctx.createGain();
  waveLfoGain.gain.value = 0.035; // swell depth (± around the base)
  waveLfo.connect(waveLfoGain);
  // Route: noise -> lp -> breezeGain -> master. LFO adds to breezeGain.gain.
  waveLfoGain.connect(breezeGain.gain);
  src.connect(lp).connect(breezeGain).connect(masterGain);
  src.start();
  waveLfo.start();
}

// Kept for the main-loop call site; the sea is now fully LFO-driven so this is
// a no-op (no per-frame work needed).
function updateSeaAmbience(dt) { /* LFO-driven, nothing to tick */ }

function toggleMute(e) {
  if (e) e.preventDefault();
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : MASTER_GAIN;
  if (muteBtn) muteBtn.textContent = muted ? '🔇' : '🔊';
}

// --- Beam tone: warm sunlight shimmer, not a sci-fi drone. A soft triangle
// through a lowpass, quiet, pitch/volume gently tracking throughput. ---
function setupHum() {
  hum = ctx.createOscillator();
  hum.type = 'triangle';       // warm, not buzzy
  hum.frequency.value = 160;
  humGain = ctx.createGain();
  humGain.gain.value = 0;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 500;
  hum.connect(filter).connect(humGain).connect(masterGain);
  hum.start();
}

function updateHum(throughput) {
  if (!humGain) return;
  // throughput: 0 to ~50. Keep it quiet and warm — a shimmer of focused light.
  const vol = Math.min(0.06, throughput * 0.0014);
  const pitch = 150 + throughput * 0.8;
  humGain.gain.value = vol;
  if (hum) hum.frequency.value = pitch;
}

// --- Burn hiss: filtered noise while beam contacts hull ---
function setupBurnNoise() {
  const bufSize = ctx.sampleRate * 0.5;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  burnNoise = ctx.createBufferSource();
  burnNoise.buffer = buf;
  burnNoise.loop = true;
  burnGain = ctx.createGain();
  burnGain.gain.value = 0;
  // Woody sizzle bed: a bandpass around 1.2kHz (roasting timber), not a thin
  // 3kHz white hiss. The sharp POPS of burning wood are added by the crackle
  // pulse system (updateCrackle) — this is just the underlying sizzle.
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200;
  filter.Q.value = 0.6;
  burnNoise.connect(filter).connect(burnGain).connect(masterGain);
  burnNoise.start();
}

function updateBurnHiss(intensity) {
  if (!burnGain) return;
  // intensity: 0 to 1 (fraction of enemies being burned). Quieter now — the
  // burn sizzle was distracting; keep it a faint bed under the crackle.
  burnGain.gain.value = Math.min(0.03, intensity * 0.04);
}

// --- Prism chime: short bell ---
function playPrismChime() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 880;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.2, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
  osc.connect(g).connect(masterGain);
  osc.start();
  osc.stop(ctx.currentTime + 0.4);
  osc.onended = () => activeVoices--;
}

// --- Destruction: thump + noise burst ---
function playDestruction() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;
  // Duck hum briefly
  if (humGain) { humGain.gain.value *= 0.3; setTimeout(() => { if(humGain) humGain.gain.value /= 0.3; }, 200); }
  // Thump
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.15);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.3, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
  osc.connect(g).connect(masterGain);
  osc.start(); osc.stop(ctx.currentTime + 0.25);
  // Noise burst
  const bufLen = ctx.sampleRate * 0.08;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) d[i] = (Math.random()*2-1) * (1 - i/bufLen);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.2, ctx.currentTime);
  ng.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
  src.connect(ng).connect(masterGain);
  src.start(); src.onended = () => activeVoices--;
  osc.onended = () => {};
}

// --- Shield deflection: metallic ping ---
let lastDeflectTime = 0;
function playDeflect() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  // Rate-limit: max once per 0.2s to avoid spam
  const now = ctx.currentTime;
  if (now - lastDeflectTime < 0.2) return;
  lastDeflectTime = now;
  activeVoices++;
  const osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1800, now);
  osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.12, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 600;
  osc.connect(hp).connect(g).connect(masterGain);
  osc.start(now); osc.stop(now + 0.12);
  osc.onended = () => activeVoices--;
}

// --- Shield deflection: ringing BRONZE PLATE clang. Metallic inharmonic sine
// cluster at 420 / 680 / 1150 Hz (a non-harmonic ratio set = struck bronze),
// with a fast attack and a short ringing decay. ---
let lastRicochetTime = 0;
function playRicochet() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  const now = ctx.currentTime;
  if (now - lastRicochetTime < 0.08) return;
  lastRicochetTime = now;
  activeVoices++;
  const out = ctx.createGain();
  out.gain.value = 1;
  out.connect(masterGain);
  // The three inharmonic partials of the bronze plate.
  const partials = [
    { f: 420,  g: 0.12, decay: 0.35 },
    { f: 680,  g: 0.08, decay: 0.28 },
    { f: 1150, g: 0.05, decay: 0.20 },
  ];
  for (const p of partials) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    // Slight detune per strike so repeats don't sound identical/mechanical.
    osc.frequency.value = p.f * (1 + (Math.random() - 0.5) * 0.01);
    const g = ctx.createGain();
    g.gain.setValueAtTime(p.g, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + p.decay);
    osc.connect(g).connect(out);
    osc.start(now);
    osc.stop(now + p.decay + 0.05);
  }
  // Brief metallic strike transient for the "clang" bite.
  const tLen = Math.ceil(ctx.sampleRate * 0.012);
  const tBuf = ctx.createBuffer(1, tLen, ctx.sampleRate);
  const td = tBuf.getChannelData(0);
  for (let i = 0; i < tLen; i++) td[i] = (Math.random() * 2 - 1) * (1 - i / tLen);
  const tSrc = ctx.createBufferSource(); tSrc.buffer = tBuf;
  const tHp = ctx.createBiquadFilter(); tHp.type = 'highpass'; tHp.frequency.value = 2000;
  const tG = ctx.createGain(); tG.gain.value = 0.05;
  tSrc.connect(tHp).connect(tG).connect(out);
  tSrc.start(now); tSrc.stop(now + 0.02);
  setTimeout(() => { activeVoices--; }, 420);
}

// --- Wall breach: ancient war drum (TYMPANON). A struck taut skin = a sine
// with an exponential pitch drop 120Hz -> 45Hz over 0.2s, through a lowpass for
// a warm hollow body. A brief wooden crunch layers on top for the hull hit. ---
function playWallHit() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;
  const now = ctx.currentTime;

  // Tympanon membrane: 120 -> 45 Hz over 0.2s, warm body via lowpass.
  const drum = ctx.createOscillator();
  drum.type = 'sine';
  drum.frequency.setValueAtTime(120, now);
  drum.frequency.exponentialRampToValueAtTime(45, now + 0.2);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(320, now);
  lp.frequency.exponentialRampToValueAtTime(120, now + 0.3);
  const drumG = ctx.createGain();
  drumG.gain.setValueAtTime(0.3, now);
  drumG.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
  drum.connect(lp).connect(drumG).connect(masterGain);
  drum.start(now); drum.stop(now + 0.5);

  // Wooden hull crunch on top: short mid-band noise burst, fast decay.
  const crLen = Math.ceil(ctx.sampleRate * 0.08);
  const crBuf = ctx.createBuffer(1, crLen, ctx.sampleRate);
  const cd = crBuf.getChannelData(0);
  for (let i = 0; i < crLen; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / crLen);
  const crSrc = ctx.createBufferSource();
  crSrc.buffer = crBuf;
  const crBp = ctx.createBiquadFilter();
  crBp.type = 'bandpass';
  crBp.frequency.setValueAtTime(400, now);
  crBp.frequency.exponentialRampToValueAtTime(170, now + 0.08);
  crBp.Q.value = 1.2;
  const crG = ctx.createGain();
  crG.gain.setValueAtTime(0.16, now);
  crG.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  crSrc.connect(crBp).connect(crG).connect(masterGain);
  crSrc.start(now); crSrc.stop(now + 0.11);

  drum.onended = () => activeVoices--;
}

// --- Helios / Priest: resonant TEMPLE BELL. A struck fundamental with a stack
// of decaying HARMONIC overtones (integer multiples), each higher partial
// quieter and faster-decaying, so the bell rings out warm and sacred. ---
function playHeliosHorn() {
  if (!ensureCtx()) return;
  const now = ctx.currentTime;
  const out = ctx.createGain();
  out.gain.value = 1;
  out.connect(masterGain);

  const fund = 392; // ~G4 — a deep, resonant temple bell
  // Harmonic overtone series (1x..6x): quieter and shorter as they go up.
  const harmonics = [
    { mult: 1, g: 0.16, decay: 3.2 },
    { mult: 2, g: 0.10, decay: 2.6 },
    { mult: 3, g: 0.06, decay: 2.0 },
    { mult: 4, g: 0.04, decay: 1.5 },
    { mult: 5, g: 0.025, decay: 1.1 },
    { mult: 6, g: 0.015, decay: 0.8 },
  ];
  for (const h of harmonics) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = fund * h.mult;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(h.g, now + 0.01);      // sharp strike attack
    g.gain.exponentialRampToValueAtTime(0.0005, now + h.decay); // long ring
    osc.connect(g).connect(out);
    osc.start(now);
    osc.stop(now + h.decay + 0.1);
  }
  // Soft mallet strike transient to seat the attack.
  const tLen = Math.ceil(ctx.sampleRate * 0.01);
  const tBuf = ctx.createBuffer(1, tLen, ctx.sampleRate);
  const td = tBuf.getChannelData(0);
  for (let i = 0; i < tLen; i++) td[i] = (Math.random() * 2 - 1) * (1 - i / tLen);
  const tSrc = ctx.createBufferSource(); tSrc.buffer = tBuf;
  const tBp = ctx.createBiquadFilter(); tBp.type = 'bandpass'; tBp.frequency.value = 1800;
  const tG = ctx.createGain(); tG.gain.value = 0.05;
  tSrc.connect(tBp).connect(tG).connect(out);
  tSrc.start(now); tSrc.stop(now + 0.015);
}

// --- Victory fanfare: a bright, resonant temple-trumpet flourish. A rising
// major arpeggio (C-E-G) played on warm sawtooth "trumpets" through a lowpass,
// capped by a ringing bell chord on the final note so it lands triumphant but
// clean (the master compressor/lowpass keep it from getting shrill). ---
function playVictoryFanfare() {
  if (!ensureCtx()) return;
  const now = ctx.currentTime;
  const out = ctx.createGain();
  out.gain.value = 1;
  out.connect(masterGain);

  // Rising arpeggio: C5, E5, G5, then a held high C6 on top.
  const notes = [
    { f: 523.25, t: 0.00, dur: 0.32 },
    { f: 659.25, t: 0.16, dur: 0.32 },
    { f: 783.99, t: 0.32, dur: 0.45 },
    { f: 1046.5, t: 0.52, dur: 0.9 },
  ];
  for (const n of notes) {
    const t0 = now + n.t;
    // Two slightly detuned saws = a fuller "brass" body.
    for (const detune of [-4, 4]) {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = n.f;
      osc.detune.value = detune;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2400, t0);
      lp.frequency.exponentialRampToValueAtTime(1400, t0 + n.dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.09, t0 + 0.03);          // trumpet swell
      g.gain.exponentialRampToValueAtTime(0.0005, t0 + n.dur);
      osc.connect(lp).connect(g).connect(out);
      osc.start(t0); osc.stop(t0 + n.dur + 0.05);
    }
  }

  // Ringing bell chord seated on the final high note for a sacred "temple" tail.
  const bellT = now + 0.52;
  const bellFund = 1046.5; // C6
  const bellHarm = [
    { mult: 1, g: 0.12, decay: 2.6 },
    { mult: 2, g: 0.07, decay: 2.0 },
    { mult: 3, g: 0.04, decay: 1.5 },
    { mult: 4.2, g: 0.02, decay: 1.1 }, // slightly inharmonic shimmer
  ];
  for (const h of bellHarm) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = bellFund * h.mult;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, bellT);
    g.gain.linearRampToValueAtTime(h.g, bellT + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0005, bellT + h.decay);
    osc.connect(g).connect(out);
    osc.start(bellT); osc.stop(bellT + h.decay + 0.1);
  }
}

// --- Zeus: deep acoustic THUNDER — a modulated low-frequency noise sweep that
// rolls and rumbles (not an 8-bit zap). A short crack transient seats the
// strike, then a long low-passed noise bed sweeps down while a slow tremolo
// LFO makes it "roll" like real thunder receding across the bay. ---
function playZeusThunder() {
  if (!ensureCtx()) return;
  const now = ctx.currentTime;

  // Short crack transient (the initial strike), quick decay.
  const crackLen = Math.ceil(ctx.sampleRate * 0.12);
  const cBuf = ctx.createBuffer(1, crackLen, ctx.sampleRate);
  const cd = cBuf.getChannelData(0);
  for (let i = 0; i < crackLen; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / crackLen, 1.5);
  const cSrc = ctx.createBufferSource(); cSrc.buffer = cBuf;
  const cHp = ctx.createBiquadFilter(); cHp.type = 'highpass'; cHp.frequency.value = 800;
  const cG = ctx.createGain();
  cG.gain.setValueAtTime(0.35, now);
  cG.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
  cSrc.connect(cHp).connect(cG).connect(masterGain);
  cSrc.start(now); cSrc.stop(now + 0.18);

  // Rolling rumble bed: long low-passed noise, filter sweeping 320 -> 55 Hz as
  // the thunder rolls away.
  const dur = 2.4;
  const rumLen = Math.ceil(ctx.sampleRate * dur);
  const rBuf = ctx.createBuffer(1, rumLen, ctx.sampleRate);
  const rd = rBuf.getChannelData(0);
  for (let i = 0; i < rumLen; i++) rd[i] = Math.random() * 2 - 1;
  const rSrc = ctx.createBufferSource(); rSrc.buffer = rBuf;
  const rLp = ctx.createBiquadFilter();
  rLp.type = 'lowpass';
  rLp.frequency.setValueAtTime(320, now);
  rLp.frequency.exponentialRampToValueAtTime(55, now + dur * 0.9);
  const rG = ctx.createGain();
  rG.gain.setValueAtTime(0.0, now);
  rG.gain.linearRampToValueAtTime(0.34, now + 0.08); // onset behind the crack
  rG.gain.exponentialRampToValueAtTime(0.001, now + dur);

  // Tremolo LFO (~4Hz, fading) modulates the rumble gain → the "rolling" of
  // thunder. The LFO output is scaled and summed into rG.gain.
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(5.5, now);
  lfo.frequency.linearRampToValueAtTime(2.5, now + dur); // slows as it recedes
  const lfoDepth = ctx.createGain();
  lfoDepth.gain.setValueAtTime(0.12, now);
  lfoDepth.gain.exponentialRampToValueAtTime(0.005, now + dur);
  lfo.connect(lfoDepth).connect(rG.gain);

  rSrc.connect(rLp).connect(rG).connect(masterGain);
  rSrc.start(now + 0.03); rSrc.stop(now + dur + 0.05);
  lfo.start(now); lfo.stop(now + dur + 0.05);
}

// --- Altar tone: soft rising note while lit ---
function setupAltarTone() {
  altarOsc = ctx.createOscillator();
  altarOsc.type = 'sine';
  altarOsc.frequency.value = 220;
  altarGain = ctx.createGain();
  altarGain.gain.value = 0;
  altarOsc.connect(altarGain).connect(masterGain);
  altarOsc.start();
}

function updateAltarTone(litCount, anyOverheated) {
  if (!altarGain) return;
  altarGain.gain.value = litCount > 0 ? Math.min(0.06, litCount * 0.02) : 0;
  if (altarOsc) altarOsc.frequency.value = anyOverheated ? 150 : 220 + litCount * 30;
}

function resetAudio() {
  silenceBattleAudio();
  // Restore the ambient sea bed + wave LFO depth for the new run.
  if (breezeGain) breezeGain.gain.value = 0.05;
  if (waveLfoGain) waveLfoGain.gain.value = 0.035;
}

// Immediately silence all continuous battle loops (beam hum, burn hiss, altar
// tone, wood crackle). Used on game over so only the defeat sound is left.
// One-shot voices already in flight (destruction, gong) are unaffected.
function silenceBattleAudio() {
  if (humGain) humGain.gain.value = 0;
  if (burnGain) burnGain.gain.value = 0;
  if (altarGain) altarGain.gain.value = 0;
  // Silence the sea bed: zero the LFO depth first so it can't push the gain
  // back up, then zero the base level.
  if (waveLfoGain) waveLfoGain.gain.value = 0;
  if (breezeGain) breezeGain.gain.value = 0;
  for (const cv of crackleVoices) { stopCrackleVoice(cv); }
  crackleVoices.length = 0;
}

// ============================================================
// WOOD CRACKLE — per-ship looping: flame hiss + random pops
// Max 4 simultaneous voices (highest heat ships).
// ============================================================
const MAX_CRACKLE_VOICES = 4;
const crackleVoices = []; // { enemyId, hissGain, hissSrc, popInterval, nextPop, filterNode, gain }

// Called each frame from damage.js or main — pass array of {id, heat} for all burning ships
function updateCrackle(burningShips) {
  if (!ensureCtx()) return;

  // Sort by heat descending, take top MAX_CRACKLE_VOICES
  burningShips.sort((a, b) => b.heat - a.heat);
  const topShips = burningShips.slice(0, MAX_CRACKLE_VOICES);
  const topIds = topShips.map(s => s.id);

  // Remove voices for ships no longer in top burning
  for (let i = crackleVoices.length - 1; i >= 0; i--) {
    if (!topIds.includes(crackleVoices[i].enemyId)) {
      stopCrackleVoice(crackleVoices[i]);
      crackleVoices.splice(i, 1);
    }
  }

  // Add/update voices for top burning ships
  for (const ship of topShips) {
    let voice = crackleVoices.find(v => v.enemyId === ship.id);
    if (!voice) {
      voice = startCrackleVoice(ship.id);
      if (voice) crackleVoices.push(voice);
    }
    if (voice) {
      // Scale volume and pop rate by heat (0 to 1)
      const heat = Math.min(1, ship.heat);
      voice.gain.gain.value = 0.015 + heat * 0.035; // hiss volume (quieter)
      voice.popRate = 2 + heat * 4; // 2 to 6 pops/sec
    }
  }

  // Fire pops on schedule
  const now = ctx.currentTime;
  for (const voice of crackleVoices) {
    if (now >= voice.nextPop) {
      fireCracklePop(voice);
      voice.nextPop = now + (1 / voice.popRate) * (0.5 + Math.random());
    }
  }
}

function startCrackleVoice(enemyId) {
  if (!ctx) return null;
  // Hiss: looping noise through a highpass
  const bufLen = ctx.sampleRate * 0.3;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2500;
  const gain = ctx.createGain();
  gain.gain.value = 0.03;
  src.connect(filter).connect(gain).connect(masterGain);
  src.start();
  return {
    enemyId,
    hissSrc: src,
    gain,
    filterNode: filter,
    popRate: 3,
    nextPop: ctx.currentTime + Math.random() * 0.3,
  };
}

function fireCracklePop(voice) {
  if (!ctx || activeVoices >= MAX_VOICES) return;
  // Short noise burst 15-40ms through bandpass 800-2000Hz
  const duration = 0.015 + Math.random() * 0.025;
  const bufLen = Math.ceil(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen); // decay envelope baked in
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 800 + Math.random() * 1200; // 800-2000 Hz
  bp.Q.value = 2 + Math.random() * 3;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.04 + Math.random() * 0.06, ctx.currentTime); // softer pops
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  src.connect(bp).connect(g).connect(masterGain);
  src.start();
  src.stop(ctx.currentTime + duration + 0.01);
}

function stopCrackleVoice(voice) {
  try { voice.hissSrc.stop(); } catch (_) {}
  try { voice.gain.disconnect(); } catch (_) {}
}

// ============================================================
// SINKING GLUG — descending sine + filtered noise swell
// Plays after destruction (call with slight delay).
// ============================================================
function playSinkGlug() {
  if (!ensureCtx() || activeVoices >= MAX_VOICES) return;
  activeVoices++;

  const now = ctx.currentTime;
  const duration = 0.45;

  // Descending sine: 400Hz → 80Hz over 400ms
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);

  // Lowpass filter closing with the pitch
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2000, now);
  lp.frequency.exponentialRampToValueAtTime(100, now + 0.4);

  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.2, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(lp).connect(oscGain).connect(masterGain);
  osc.start(now);
  osc.stop(now + duration);

  // Water noise swell underneath
  const noiseDur = 0.3;
  const nBufLen = Math.ceil(ctx.sampleRate * noiseDur);
  const nBuf = ctx.createBuffer(1, nBufLen, ctx.sampleRate);
  const nData = nBuf.getChannelData(0);
  for (let i = 0; i < nBufLen; i++) nData[i] = Math.random() * 2 - 1;
  const nSrc = ctx.createBufferSource();
  nSrc.buffer = nBuf;
  const nLp = ctx.createBiquadFilter();
  nLp.type = 'lowpass';
  nLp.frequency.setValueAtTime(600, now);
  nLp.frequency.linearRampToValueAtTime(200, now + noiseDur);
  const nGain = ctx.createGain();
  nGain.gain.setValueAtTime(0, now);
  nGain.gain.linearRampToValueAtTime(0.12, now + 0.05); // quick swell
  nGain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);
  nSrc.connect(nLp).connect(nGain).connect(masterGain);
  nSrc.start(now);
  nSrc.stop(now + noiseDur + 0.01);

  osc.onended = () => activeVoices--;
}


// === src/damage.js ===
// ============================================================
// src/damage.js — DPS formula, armour, kill handling
//
// Per frame: for each active enemy, count beam segments that
// intersect its hitbox. Apply the DPS formula from the GDD:
//
//   DPS = N * D_BASE * (1 + SYNERGY_BONUS * (N - 1))
//   final = max(0, DPS - armour * N)
//   enemy.hp -= final * dt
//
// Gold band also applies slow via enemy.js.
// On kill: deactivate enemy, award Slag.
// ============================================================












const ENEMY_HIT_HALF_W = 3;
const ENEMY_HIT_HALF_H = 3;
let totalKills = 0;

function getKillCount() { return totalKills; }
function resetDamage() { totalKills = 0; }

function updateDamage(dt) {
  const segments = getSegments();
  const pool = getEnemyPool();
  const worldWidth = getWorldWidth();
  const laneWidth = worldWidth / ENEMY_LANE_COUNT;

  // Reset each beam's "active" flag to its solve-time seed; ship contact below
  // (and altar contact in foundry) re-adds it. Drives the beam opacity tiers.
  for (let s = 0; s < segments.length; s++) segments[s].active = segments[s].activeSeed || false;

  for (let i = 0; i < pool.length; i++) {
    const enemy = pool[i];
    if (!enemy.active) continue;
    enemy.shieldBlocking = false;

    // Enemy world position
    const ex = -worldWidth / 2 + laneWidth * (enemy.lane + 0.5);
    const ey = enemy.y;

    // Count full bands (intensity=1) and sub-rays (intensity<1) hitting this enemy
    let fullBands = 0;
    let subRays = 0;
    let subRayIntensity = 0;
    let goldHitting = false;
    let hitColour = 0;
    let totalBeamsHitting = 0;
    let contactX = ex, contactY = ey; // exact beam-hull contact point (first hit)
    let haveContact = false;

    for (let s = 0; s < segments.length; s++) {
      const seg = segments[s];
      // Pre-split beam (raw sun column) does no damage
      if (seg.preSplit) continue;
      if (segmentIntersectsBox(seg, ex, ey, ENEMY_HIT_HALF_W, ENEMY_HIT_HALF_H)) {
        // Shield-bearer check: block beams within shieldAngle degrees of vertical.
        // Helios flare overpowers the plates — beams pass straight through.
        if (enemy.shieldAngle > 0 && !isShieldDisabled()) {
          const dx = seg.end.x - seg.start.x;
          const dy = seg.end.y - seg.start.y;
          const len = Math.sqrt(dx * dx + dy * dy);
          if (len > 0.01) {
            // Angle from vertical: atan2(|horizontal|, |vertical|)
            const angleFromVert = Math.atan2(Math.abs(dx / len), Math.abs(dy / len)) * (180 / Math.PI);
            if (angleFromVert <= enemy.shieldAngle) {
              // Blocked — metallic spark deflection burst + high-frequency
              // ricochet tick at the exact point the beam meets the plate.
              // (No floating text: the sparks + ricochet read instantly.)
              const cp = segmentBoxEntry(seg, ex, ey, ENEMY_HIT_HALF_W, ENEMY_HIT_HALF_H);
              const bx = cp ? cp.x : ex;
              const by = cp ? cp.y : ey + ENEMY_HIT_HALF_H;
              if (Math.random() < dt * 14) {
                spawnContactGlow(bx, by, 0xfff0c0, 12); // bright metallic flash
                spawnSparks(bx, by, 0xffdd88, 5);       // fan of hot sparks
                playRicochet();
              }
              enemy.shieldBlocking = true;
              continue; // this segment does no damage
            }
          }
        }
        totalBeamsHitting++;
        seg.active = true; // beam is contacting a hull → full-opacity tier
        hitColour = seg.colour;
        if (!haveContact) {
          const cp = segmentBoxEntry(seg, ex, ey, ENEMY_HIT_HALF_W, ENEMY_HIT_HALF_H);
          if (cp) { contactX = cp.x; contactY = cp.y; haveContact = true; }
        }
        if (seg.colour === COLOUR_GOLD) goldHitting = true;
        if (seg.intensity >= 1.0) {
          fullBands++;
        } else {
          subRays++;
          subRayIntensity = seg.intensity;
        }
      }
    }

    // Update visual state for burn feedback
    enemy.bandsHitting = totalBeamsHitting;
    if (hitColour) enemy.lastHitColour = hitColour;

    // Apply gold slow
    if (goldHitting) {
      applyGoldSlow(enemy);
    }

    // Apply damage
    if (totalBeamsHitting > 0) {
      // -------------------------------------------------------
      // Damage formula (tier-aware, sub-rays excluded from synergy):
      //   tier = active prism tier → dBase, synergy from PRISM_TIERS
      //   synergyDPS = fullBands * dBase * (1 + synergy * (fullBands-1))
      //   flatDPS = subRays * dBase * subRayIntensity
      //   totalRaw = (synergyDPS + flatDPS) * focusMult * resonanceMult
      //   final = max(0, totalRaw - armour * totalBeams)
      // -------------------------------------------------------
      const tier = getActiveTier();
      const tierData = PRISM_TIERS[tier] || PRISM_TIERS[3];
      const dBase = tierData.dBase;
      const synBonus = tierData.synergy;
      const focusMult = getFocusMultiplier();
      const resMult = getResonanceActive() ? RESONANCE_MULTIPLIER : 1.0;
      const synergyDPS = fullBands > 0 ? fullBands * dBase * (1 + synBonus * (fullBands - 1)) : 0;
      const flatDPS = subRays * dBase * (subRayIntensity || 0.5);
      const raw = (synergyDPS + flatDPS) * focusMult * resMult;
      const dmg = Math.max(0, raw - enemy.armour * totalBeamsHitting);
      // Heat accumulator: damage adds heat, enemy dies when heat >= effectiveHP
      enemy.heat += dmg * dt;
      enemy.burn = enemy.heat / enemy.maxHp;
      // Refresh the decay grace: heat won't start draining until the beam has
      // been off the target for HEAT_DECAY_GRACE seconds.
      enemy.heatGrace = HEAT_DECAY_GRACE;

      // Contact feedback at the exact hit point — kept SUBTLE (calmer, not
      // distracting): slower spawn rate, smaller/dimmer glow, fewer sparks.
      if (Math.random() < dt * 9) {
        spawnContactGlow(contactX, contactY, hitColour || 0xffaa00, 18);
        spawnSparks(contactX, contactY, hitColour || 0xffcc66, 1);
      }
      if (Math.random() < dt * 2) {
        spawnSmoke(contactX, contactY, 1, 0x5a5048); // occasional faint smoke wisp
      }

      if (enemy.heat >= enemy.maxHp) {
        const rewards = { mote: 5, husk: 10, carapace: 20, devourer: 0 };
        const reward = rewards[enemy.type] || 0;
        addSlagDirect(reward);
        totalKills++;
        const ex = -worldWidth / 2 + laneWidth * (enemy.lane + 0.5);
        const heavy = (enemy.type === 'flagship' || enemy.type === 'quadrireme');
        spawnDestruction(ex, enemy.y, heavy);
        // Sinking glug plays after the explosion (200ms delay)
        setTimeout(playSinkGlug, 200);
        triggerKillEffect(enemy, reward);
        deactivateEnemy(enemy);
      }
    } else {
      enemy.bandsHitting = 0;
      // Heat decay: after a 0.5s grace period (so holding a beam feels
      // rewarding), accumulated heat cools at 10%/s.
      if (enemy.heat > 0) {
        if (enemy.heatGrace > 0) {
          enemy.heatGrace -= dt;
        } else {
          enemy.heat = Math.max(0, enemy.heat - enemy.maxHp * HEAT_DECAY_RATE * dt);
          enemy.burn = enemy.heat / enemy.maxHp;
        }
      }
    }
  }
}

// Test if a line segment (beam) intersects an axis-aligned box (enemy hitbox)
function segmentIntersectsBox(seg, cx, cy, hw, hh) {
  // Use parametric line-vs-AABB test
  const sx = seg.start.x;
  const sy = seg.start.y;
  const ex = seg.end.x;
  const ey = seg.end.y;
  const dx = ex - sx;
  const dy = ey - sy;

  // Box bounds
  const xmin = cx - hw;
  const xmax = cx + hw;
  const ymin = cy - hh;
  const ymax = cy + hh;

  let tmin = 0;
  let tmax = 1;

  // X slab
  if (Math.abs(dx) < 1e-8) {
    if (sx < xmin || sx > xmax) return false;
  } else {
    let t1 = (xmin - sx) / dx;
    let t2 = (xmax - sx) / dx;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1);
    tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }

  // Y slab
  if (Math.abs(dy) < 1e-8) {
    if (sy < ymin || sy > ymax) return false;
  } else {
    let t1 = (ymin - sy) / dy;
    let t2 = (ymax - sy) / dy;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1);
    tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }

  return true;
}

// Return the exact point where a beam segment enters the enemy hitbox,
// i.e. the contact point on the hull/shield. Returns null if no intersection.
function segmentBoxEntry(seg, cx, cy, hw, hh) {
  const sx = seg.start.x, sy = seg.start.y;
  const dx = seg.end.x - sx, dy = seg.end.y - sy;
  const xmin = cx - hw, xmax = cx + hw;
  const ymin = cy - hh, ymax = cy + hh;
  let tmin = 0, tmax = 1;
  if (Math.abs(dx) < 1e-8) {
    if (sx < xmin || sx > xmax) return null;
  } else {
    let t1 = (xmin - sx) / dx, t2 = (xmax - sx) / dx;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return null;
  }
  if (Math.abs(dy) < 1e-8) {
    if (sy < ymin || sy > ymax) return null;
  } else {
    let t1 = (ymin - sy) / dy, t2 = (ymax - sy) / dy;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return null;
  }
  // tmin is the entry parameter (clamped to segment start at 0)
  return { x: sx + dx * tmin, y: sy + dy * tmin };
}

// Shield deflection is now shown purely with metallic sparks + a ricochet tick
// (see the shield-block branch above). The old floating "BLOCKED" label was
// removed; this stub remains so the main loop's call is a harmless no-op.

// === src/tutorial.js ===
// ============================================================
// src/tutorial.js — Onboarding micro-tutorial overlay (match start).
//
// A brief, elegant semi-transparent banner shown from 0:00 that teaches the
// three core controls. It fades in, holds, then fades out automatically after
// ~6s OR the instant the player sinks their first ship (whichever comes first).
//
// Rendered as an in-scene canvas texture on a plane in the OVERLAY scene, so it
// is inherently non-blocking: all pointer handling lives on the WebGL canvas
// element and these meshes never intercept input (canvas overlay == the
// pointer-events:none equivalent for our WebGL UI).
// ============================================================




let bannerMesh = null;
let bannerCanvas = null;
let bannerCtx = null;
let bannerTexture = null;

let tutElapsed = 0;      // seconds since the tutorial started
let dismissed = false;   // hard-off (fade-out complete)
let opacity = 0;
let fadingOut = false;   // latched once a fade-out trigger fires
let fadeOutT = 0;        // fade-out clock (seconds since fade-out began)
let opacityAtFadeStart = 1; // opacity captured the instant fade-out began
let fadeOutDur = 0.6;    // active fade-out duration (short when dismissed by input)

const HOLD_TIME = 6;     // seconds fully visible before auto fade-out
const FADE_IN = 0.4;     // fade-in duration
const FADE_OUT = 0.6;    // default fade-out duration (timer / first-kill)
const FADE_OUT_INPUT = 0.22; // snappier fade when the player interacts

// The three control hints. Emoji render on a 2x canvas so they stay crisp.
const HINTS = [
  { icon: '\u{1F7E2}', text: 'TAP MIRROR: Aim & Rotate Beam' },      // 🟢
  { icon: '\u{270B}',  text: 'DRAG MIRROR: Reposition across Harbor' }, // ✋
  { icon: '\u2600\uFE0F', text: 'DEFEND: Focus sunlight to burn ships!' }, // ☀️
];

function initTutorial() {
  const oScene = getOverlayScene();
  const worldWidth = getWorldWidth();

  // 2x-resolution backing canvas (1024x256 -> logical 512x128) so the text and
  // emoji stay sharp when the banner plane is upscaled on a phone.
  bannerCanvas = document.createElement('canvas');
  bannerCanvas.width = 1024;
  bannerCanvas.height = 256;
  bannerCtx = bannerCanvas.getContext('2d');
  bannerCtx.scale(2, 2); // logical coordinates remain 512x128

  bannerTexture = new THREE.CanvasTexture(bannerCanvas);
  bannerTexture.minFilter = THREE.LinearFilter;

  // Plane sized to a comfortable card in world units. Aspect 512:128 = 4:1.
  const cardW = worldWidth * 0.72;
  const cardH = cardW * (128 / 512);
  const geo = new THREE.PlaneGeometry(cardW, cardH);
  const mat = new THREE.MeshBasicMaterial({
    map: bannerTexture, transparent: true, opacity: 0, depthWrite: false,
  });
  bannerMesh = new THREE.Mesh(geo, mat);
  // Upper-middle of the playfield: clear of the top HUD (~y45) and of the
  // mirror row / shop bar at the bottom, so it never sits over the controls.
  bannerMesh.position.set(0, WORLD_HEIGHT * 0.12, 2);
  bannerMesh.visible = false;
  oScene.add(bannerMesh);

  drawBanner();
}

function drawBanner() {
  if (!bannerCtx) return;
  const W = 512, H = 128;
  bannerCtx.clearRect(0, 0, W, H);

  // Rounded semi-transparent card background with a soft border.
  tutRoundRect(bannerCtx, 6, 6, W - 12, H - 12, 10);
  bannerCtx.fillStyle = 'rgba(10, 16, 26, 0.62)';
  bannerCtx.fill();
  bannerCtx.lineWidth = 1.5;
  bannerCtx.strokeStyle = 'rgba(120, 190, 255, 0.45)';
  bannerCtx.stroke();

  // Title
  bannerCtx.textAlign = 'center';
  bannerCtx.textBaseline = 'alphabetic';
  bannerCtx.fillStyle = '#cfe3ff';
  bannerCtx.font = 'bold 15px monospace';
  bannerCtx.fillText('HOW TO DEFEND SYRACUSE', W / 2, 26);

  // Three hint rows, left-aligned icon + text, evenly spaced.
  const rows = [46, 74, 102];
  const iconX = 26;
  const textX = 50;
  for (let i = 0; i < HINTS.length; i++) {
    const y = rows[i];
    bannerCtx.textAlign = 'left';
    bannerCtx.font = '16px monospace';
    bannerCtx.fillText(HINTS[i].icon, iconX, y);
    bannerCtx.fillStyle = '#eaf2ff';
    bannerCtx.font = 'bold 13px monospace';
    bannerCtx.fillText(HINTS[i].text, textX, y);
    bannerCtx.fillStyle = '#eaf2ff';
  }

  bannerTexture.needsUpdate = true;
}

function tutRoundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

// Advance the tutorial. `killCount` is the running ships-sunk total; the first
// kill dismisses the banner early. Called every frame from the main loop.
function updateTutorial(dt, killCount) {
  if (dismissed || !bannerMesh) return;

  tutElapsed += dt;

  // Latch the fade-out on either trigger: the first ship sunk, or the hold
  // window elapsing. We capture the current opacity so an early kill fades
  // smoothly from wherever the fade-in had reached.
  if (!fadingOut && ((killCount > 0) || tutElapsed >= (FADE_IN + HOLD_TIME))) {
    fadingOut = true;
    fadeOutT = 0;
    fadeOutDur = FADE_OUT;
    opacityAtFadeStart = opacity;
  }

  if (!fadingOut) {
    // Fade in, then hold at full.
    opacity = Math.min(1, tutElapsed / FADE_IN);
  } else {
    fadeOutT += dt;
    opacity = Math.max(0, opacityAtFadeStart * (1 - fadeOutT / fadeOutDur));
  }

  bannerMesh.material.opacity = opacity;
  bannerMesh.visible = opacity > 0.001;

  if (fadingOut && opacity <= 0.001) {
    dismissed = true;
    bannerMesh.visible = false;
  }
}

// Begin the fade-out immediately, e.g. on the player's very first interaction.
// Idempotent: once the banner is fading or gone this is a no-op. We fade rather
// than hard-cut so the dismissal still reads as smooth, but a short fade means
// the crystal + first target ship are unobstructed almost instantly.
function dismissTutorial() {
  if (dismissed || fadingOut || !bannerMesh) return;
  fadingOut = true;
  fadeOutT = 0;
  fadeOutDur = FADE_OUT_INPUT; // snappy so the playfield clears at once
  opacityAtFadeStart = opacity;
}

function resetTutorial() {
  tutElapsed = 0;
  dismissed = false;
  opacity = 0;
  fadingOut = false;
  fadeOutT = 0;
  fadeOutDur = FADE_OUT;
  opacityAtFadeStart = 1;
  if (bannerMesh) {
    bannerMesh.material.opacity = 0;
    bannerMesh.visible = false;
  }
}


// === src/session.js ===
// ============================================================
// src/session.js — Timer, breach counter, win/lose state, reset
//
// Win: Recombination >= 100% at 15:00, OR Devourer killed.
// Lose: 3 breaches, OR 15:00 with Devourer alive + Recombination < 100%.
// ============================================================




















let elapsed = 0;
let wallIntegrity = 100; // wall HP, starts at 100
let gameOver = false;
let gameWon = false;
let devourerKilled = false;


// HUD
let hudCanvas = null;
let hudCtx = null;
let hudTexture = null;
let hudMesh = null;

// Overlay
let overlayMesh = null;
let overlayCanvas = null;
let overlayCtx = null;
let overlayTexture = null;
let dimMesh = null;
let wallFlashMesh = null; // full-screen red flash on wall damage

function initSession() {

  gameOver = false;
  gameWon = false;

function getElapsed() { return elapsed; }

function getWallIntegrity() { return wallIntegrity; }

function isGameWon() { return gameWon; }
