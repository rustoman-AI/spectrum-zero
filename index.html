// ============================================================
// src/prism.js — Prism: fixed infrastructure at (0, PRISM_Y)
// Not draggable. Splits the white sun beam into coloured bands.
// ============================================================





const prisms = [];
const PRISM_RADIUS = 2.5;
let activeTier = DEFAULT_PRISM_TIER;

function getPrisms() { return prisms; }
function getActiveTier() { return activeTier; }
function getActiveTierData() { return PRISM_TIERS[activeTier]; }

function setTier(newTier) {
  activeTier = newTier;
  markDirty();
}

function resetTier() { activeTier = DEFAULT_PRISM_TIER; }

function resetPrisms() {
  // Prism is fixed — just reset tier
  activeTier = DEFAULT_PRISM_TIER;
  markDirty();
}

function initPrisms() {
  if (prisms.length > 0) return; // already placed, don't duplicate
  const scene = getScene();
  const x = 0;
  const y = PRISM_Y;

  const r = PRISM_RADIUS;
  const group = new THREE.Group();
  group.position.set(x, y, 0.2);

  // Diamond shape: 4 facet triangles
  const verts = [
    { x: 0, y: r },
    { x: r, y: 0 },
    { x: 0, y: -r },
    { x: -r, y: 0 },
  ];
  const facetColours = [0xddeeff, 0xbbddee, 0xaaccdd, 0xccddee];
  const bottomTints = [null, null, 0xffe9a0, 0xff8c1a];
  for (let i = 0; i < 4; i++) {
    const a = verts[i];
    const b = verts[(i + 1) % 4];
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(a.x, a.y);
    shape.lineTo(b.x, b.y);
    shape.closePath();
    const geo = new THREE.ShapeGeometry(shape);
    const col = bottomTints[i] || facetColours[i];
    const mat = new THREE.MeshBasicMaterial({
      color: col, transparent: true,
      opacity: i >= 2 ? 0.7 : 0.85,
    });
    const facetMesh = new THREE.Mesh(geo, mat);
    facetMesh.position.z = 0.01 * i;
    group.add(facetMesh);
  }

  // Internal glow
  const glowGeo = new THREE.PlaneGeometry(r * 1.4, r * 1.4);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xddeeff, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const glowMesh = new THREE.Mesh(glowGeo, glowMat);
  glowMesh.position.z = -0.05;
  group.add(glowMesh);

  scene.add(group);

  const prism = {
    id: 0,
    position: { x: x, y: y },
    radius: PRISM_RADIUS,
    mesh: group,
    glowMat,
  };
  prisms.push(prism);
  markDirty();
}

// Update prism glow based on beam activity
function updatePrismGlow(segments) {
  for (const prism of prisms) {
    if (!prism.glowMat) continue;
    let lit = false;
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      const dx = seg.end.x - prism.position.x;
      const dy = seg.end.y - prism.position.y;
      if (dx * dx + dy * dy < prism.radius * prism.radius * 2) {
        lit = true;
        break;
      }
    }
    prism.glowMat.opacity = lit ? 0.5 + 0.2 * Math.sin(performance.now() * 0.005) : 0.15;
  }
}

// Breach events from the most recent updateEnemies() call, for per-lane feedback.
const lastBreaches = [];
function getLastBreaches() { return lastBreaches; }

// Visual size (world units, ~sprite height) per ship type. Half of this is the
// ship's leading-edge offset used for the ram-line crash so no ship of any
// size ever overlaps the mirror discs.
const SHIP_SIZE = { skiff: 2.5, trireme: 3.5, quadrireme: 4.5, shieldbearer: 4.0, flagship: 8 };
function shipHalfHeight(type) { return (SHIP_SIZE[type] || 3) / 2; }

const pool = [];
let enemyGroup = null;
const shipTextures = {};

// --- Procedural ship sprite generation (drawn to canvas at load) ---
function generateShipTextures() {
  const types = ['skiff', 'trireme', 'quadrireme', 'shieldbearer', 'flagship'];
  for (const type of types) {
    const sz = 128;
    const c = document.createElement('canvas');
    c.width = sz; c.height = sz;
    const ctx = c.getContext('2d');
    drawShip(ctx, sz, type);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.premultiplyAlpha = false;
    shipTextures[type] = tex;
  }
}

function drawShip(ctx, sz, type) {
  const cx = sz / 2;
  const cy = sz / 2;
  ctx.clearRect(0, 0, sz, sz);

  // Ship type variations
  const configs = {
    skiff:        { hullW: 0.55, hullH: 0.18, prowLen: 0.12, mastH: 0.40, sailW: 0.35, sailH: 0.30, oars: 0, stripe: '#8B4513', hullCol: '#6B4226', deckCol: '#9E6B3E' },
    trireme:      { hullW: 0.65, hullH: 0.20, prowLen: 0.15, mastH: 0.30, sailW: 0.18, sailH: 0.15, oars: 5, stripe: '#C41E3A', hullCol: '#5C3317', deckCol: '#8B6B4A' },
    quadrireme:   { hullW: 0.72, hullH: 0.22, prowLen: 0.16, mastH: 0.30, sailW: 0.20, sailH: 0.15, oars: 7, stripe: '#1E5631', hullCol: '#4A2B10', deckCol: '#7A5B3A' },
    shieldbearer: { hullW: 0.68, hullH: 0.22, prowLen: 0.14, mastH: 0.28, sailW: 0.16, sailH: 0.12, oars: 5, stripe: '#CC8844', hullCol: '#5C3317', deckCol: '#8B6B4A' },
    flagship:     { hullW: 0.80, hullH: 0.25, prowLen: 0.18, mastH: 0.55, sailW: 0.50, sailH: 0.40, oars: 0, stripe: '#DAA520', hullCol: '#3D1F00', deckCol: '#6B4226' },
  };
  const cfg = configs[type] || configs.skiff;

  const hullW = cfg.hullW * sz;
  const hullH = cfg.hullH * sz;
  const prowLen = cfg.prowLen * sz;
  const mastH = cfg.mastH * sz;
  const sailW = cfg.sailW * sz;
  const sailH = cfg.sailH * sz;

  // Ship travels downward on screen. Prow (pointed) faces DOWN (toward wall).
  // Stern (flat/raised) at top. Hull is a long HORIZONTAL wedge, wider than tall.
  const hullCenterY = cy + 4; // hull slightly below centre (mast/sail above)
  const hullLeft = cx - hullW / 2;
  const hullRight = cx + hullW / 2;
  const prowTipY = hullCenterY + hullH * 0.5 + prowLen; // pointed tip below
  const sternY = hullCenterY - hullH * 0.5; // flat stern above

  ctx.save();

  // Hull body: flat-bottomed wedge shape
  ctx.beginPath();
  ctx.moveTo(cx, prowTipY);                                    // prow tip (bottom centre)
  ctx.lineTo(hullRight - 2, hullCenterY + hullH * 0.3);       // right bow
  ctx.lineTo(hullRight, hullCenterY - hullH * 0.2);           // right waist
  ctx.lineTo(hullRight - 3, sternY);                           // right stern
  ctx.lineTo(hullLeft + 3, sternY);                            // left stern (flat top)
  ctx.lineTo(hullLeft, hullCenterY - hullH * 0.2);            // left waist
  ctx.lineTo(hullLeft + 2, hullCenterY + hullH * 0.3);        // left bow
  ctx.closePath();
  ctx.fillStyle = cfg.hullCol;
  ctx.fill();

  // Deck stripe (lighter horizontal band across the hull)
  ctx.fillStyle = cfg.deckCol;
  ctx.fillRect(hullLeft + 4, hullCenterY - 3, hullW - 8, 5);

  // Painted stripe along waterline
  ctx.strokeStyle = cfg.stripe;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hullLeft + 4, hullCenterY + hullH * 0.15);
  ctx.lineTo(cx, prowTipY - 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hullRight - 4, hullCenterY + hullH * 0.15);
  ctx.lineTo(cx, prowTipY - 4);
  ctx.stroke();

  // Oar strokes: angle DOWNWARD from hull toward water (below hull line)
  if (cfg.oars > 0) {
    ctx.strokeStyle = 'rgba(80, 50, 25, 0.8)';
    ctx.lineWidth = 1.5;
    const oarRegionTop = hullCenterY - hullH * 0.15;
    const oarRegionBot = hullCenterY + hullH * 0.2;
    const oarSpacing = (oarRegionBot - oarRegionTop) / (cfg.oars + 1);
    for (let i = 1; i <= cfg.oars; i++) {
      const oy = oarRegionTop + i * oarSpacing;
      // Left oar: angled downward-left
      ctx.beginPath();
      ctx.moveTo(hullLeft + 1, oy);
      ctx.lineTo(hullLeft - 10, oy + 6);
      ctx.stroke();
      // Right oar: angled downward-right
      ctx.beginPath();
      ctx.moveTo(hullRight - 1, oy);
      ctx.lineTo(hullRight + 10, oy + 6);
      ctx.stroke();
    }
  }

  // Stern ornament (raised transom)
  ctx.fillStyle = '#3D2010';
  ctx.fillRect(cx - hullW * 0.15, sternY - 4, hullW * 0.3, 5);

  // Mast (vertical, above hull centre)
  ctx.fillStyle = '#3D2010';
  ctx.fillRect(cx - 1.5, hullCenterY - mastH - hullH * 0.3, 3, mastH);

  // Sail (trapezoid, clearly above hull)
  if (sailW > 0 && sailH > 0) {
    const sailTop = hullCenterY - mastH - hullH * 0.3 + 4;
    const sailBot = sailTop + sailH;
    ctx.fillStyle = 'rgba(230, 215, 190, 0.85)';
    ctx.beginPath();
    ctx.moveTo(cx - sailW / 2, sailBot);
    ctx.lineTo(cx + sailW / 2, sailBot);
    ctx.lineTo(cx + sailW * 0.35, sailTop);
    ctx.lineTo(cx - sailW * 0.35, sailTop);
    ctx.closePath();
    ctx.fill();
    // Cross-bar
    ctx.strokeStyle = '#3D2010';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx - sailW / 2, sailBot);
    ctx.lineTo(cx + sailW / 2, sailBot);
    ctx.stroke();
  }

  // Prow ram ornament
  ctx.fillStyle = '#1A0A00';
  ctx.beginPath();
  ctx.moveTo(cx, prowTipY + 2);
  ctx.lineTo(cx - 3, prowTipY - 5);
  ctx.lineTo(cx + 3, prowTipY - 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function initEnemies() {
  const scene = getScene();
  enemyGroup = new THREE.Group();
  scene.add(enemyGroup);

  // Generate ship sprite textures (procedural canvas, no image files)
  generateShipTextures();

  for (let i = 0; i < ENEMY_POOL_SIZE; i++) {
    const mesh = new THREE.Group();
    mesh.position.z = 0.3;

    // Ship sprite (canvas-drawn, swapped per type)
    const spriteGeo = new THREE.PlaneGeometry(6, 6);
    const spriteMat = new THREE.MeshBasicMaterial({
      map: shipTextures.skiff, transparent: true, alphaTest: 0.05, depthWrite: false
    });
    const spriteMesh = new THREE.Mesh(spriteGeo, spriteMat);
    spriteMesh.position.z = 0.01;
    mesh.add(spriteMesh);

    // Emissive ember glow behind the hull — an additive orange halo that ramps
    // up as the ship approaches ignition (charring). Uses the shared soft glow
    // texture so it reads as a hot edge glow, not a flat rectangle.
    const emberGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 7),
      new THREE.MeshBasicMaterial({
        map: getGlowTex(), color: 0xff6600, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    emberGlow.position.z = -0.02; // just behind the sprite
    mesh.add(emberGlow);

    mesh.visible = false;

    // Burn meter bar
    const barBg = new THREE.Mesh(
      new THREE.PlaneGeometry(5, 0.8),
      new THREE.MeshBasicMaterial({ color: 0x111111 })
    );
    barBg.position.y = -2.5;
    barBg.position.z = 0.1;
    mesh.add(barBg);
    const barFill = new THREE.Mesh(
      new THREE.PlaneGeometry(5, 0.8),
      new THREE.MeshBasicMaterial({ color: 0xff4400 })
    );
    barFill.position.y = -2.5;
    barFill.position.z = 0.15;
    barFill.scale.x = 0;
    mesh.add(barFill);

    // Shield plate: a row of sturdy, slightly-curved mantlet shields
    // (Scutum/Aspis style) mounted flush along the deck — NOT stacked domes.
    // Arc depth is shallow (~70% flatter than a full dome) and the bands sit
    // tightly together so they read as a clean armoured wall, with bronze rims.
    const shieldCanvas = document.createElement('canvas');
    shieldCanvas.width = 64; shieldCanvas.height = 32;
    const shCtx = shieldCanvas.getContext('2d');
    const bandColors = ['#AA7733', '#CC9944', '#DDBB55'];
    const ARC = 2;          // shallow arc depth (was 7 → ~70% flatter)
    const SPACING = 4.5;    // tight vertical spacing (was 9 → plates hug the hull)
    const BASE_Y = 20;      // sit low, flush against the deck profile
    const RX = 29;          // plate half-width (spans the hull cleanly)
    for (let b = 0; b < 3; b++) {
      const cy = BASE_Y - b * SPACING; // stack upward but close, not flaring
      // Plate body: a shallow rounded-rect-ish band via a squat top arc + flat base
      shCtx.fillStyle = bandColors[b];
      shCtx.beginPath();
      shCtx.ellipse(32, cy, RX, ARC, 0, Math.PI, 0); // shallow top curve
      shCtx.lineTo(32 + RX, cy + SPACING * 0.9);      // down the right edge
      shCtx.lineTo(32 - RX, cy + SPACING * 0.9);      // flat base back to left
      shCtx.closePath();
      shCtx.fill();
      // Bronze rim highlight along the plate's top edge (instant "armoured" read).
      shCtx.strokeStyle = '#EEDD88';
      shCtx.lineWidth = 1.0;
      shCtx.beginPath();
      shCtx.ellipse(32, cy, RX, ARC, 0, Math.PI, 0);
      shCtx.stroke();
    }
    const shTex = new THREE.CanvasTexture(shieldCanvas);
    shTex.minFilter = THREE.LinearFilter;
    shTex.premultiplyAlpha = false;
    const shieldPlate = new THREE.Mesh(
      new THREE.PlaneGeometry(5.4, 2.0),
      new THREE.MeshBasicMaterial({ map: shTex, transparent: true, alphaTest: 0.05, depthWrite: false })
    );
    shieldPlate.position.y = 1.8; // mounted lower, flush along the deck
    shieldPlate.position.z = 0.08;
    shieldPlate.visible = false;
    mesh.add(shieldPlate);

    // Oars (3 per side, animated at runtime for oared ships)
    const oarMeshes = [];
    const OAR_COUNT = 3;
    const oarMat = new THREE.MeshBasicMaterial({ color: 0x5C3D2E });
    for (let side = -1; side <= 1; side += 2) {
      for (let oi = 0; oi < OAR_COUNT; oi++) {
        const oarGeo = new THREE.PlaneGeometry(0.2, 1.6);
        const oar = new THREE.Mesh(oarGeo, oarMat);
        // Position: along hull sides, angled downward toward water
        oar.position.x = side * 2.0;
        oar.position.y = oi * 0.7 - (OAR_COUNT * 0.7) / 2 + 0.5;
        oar.position.z = -0.02; // BEHIND the hull sprite
        oar.rotation.z = side * 0.6; // angled downward-outward (~35 degrees)
        oar.visible = false;
        mesh.add(oar);
        oarMeshes.push({ mesh: oar, side, index: oi });
      }
    }

    enemyGroup.add(mesh);
    pool.push({
      active: false, type: 'skiff',
      hp: 0, maxHp: 0, armour: 0, heat: 0,
      lane: 0, y: SHIP_SPAWN_Y,
      speed: 0, baseSpeed: 0,
      burn: 0, slowed: false,
      bandsHitting: 0, lastHitColour: 0,
      mesh, barFill, shieldPlate, oarMeshes, spriteMat, hullMat: spriteMat, emberGlow
    });
  }
}

function getEnemyPool() { return pool; }

function spawnEnemy(type, lane, hpMultiplier, yOffset) {
  const template = ENEMY_TYPES[type];
  if (!template) return null;
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) {
      e.active = true;
      e.type = type;
      e.maxHp = template.hp * hpMultiplier;
      e.hp = e.maxHp;
      e.armour = template.armour;
      e.shieldAngle = template.shieldAngle || 0;
      e.shieldBlocking = false;
      e.stunTimer = 0;
      e.propulsion = template.propulsion || 'oared';
      e.oarPhase = Math.random() * Math.PI * 2; // random start phase
      e.driftX = 0;
      e.pullX = 0; // Poseidon whirlpool pull (separate from animation drift)
      e.zeusCharring = 0; // charring stage before death (0 = not charring)
      e.zeusPendingHeat = 0;
      e.breached = false; // wall-breach guard: damage fires exactly once
      e.sinkTimer = 0;    // crash-and-sink window (set on breach)
      // Restore pooled-sprite state cleared by a prior sink/char.
      if (e.spriteMat) { e.spriteMat.opacity = 1; e.spriteMat.color.setRGB(1, 1, 1); }
      if (e.emberGlow) e.emberGlow.material.opacity = 0;
      e.mesh.rotation.z = 0;
      e.lane = lane;
      // Spawn Y, clamped so the ship's TOP edge never crosses the crystal bound.
      const half = shipHalfHeight(type);
      e.y = Math.min(SHIP_SPAWN_Y + (yOffset || 0), SHIP_TOP_BOUND - half);
      e.speed = template.speed;
      e.baseSpeed = template.speed;
      e.burn = 0;
      e.heat = 0;
      e.heatGrace = 0;
      e.slowed = false;
      e.bandsHitting = 0;
      e.lastHitColour = 0;
      e.mesh.visible = true;
      e.barFill.scale.x = 0;
      positionEnemy(e);
      updateEnemyVisual(e);
      return e;
    }
  }
  return null;
}

// Ships move DOWNWARD (negative Y)
function updateEnemies(dt) {
  let wallDamage = 0;
  lastBreaches.length = 0;
  const ww = getWorldWidth();
  const lw = ww / ENEMY_LANE_COUNT;
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;
    e.slowed = false;
    // Zeus stun: skip movement while stunned
    let moving = false;
    if (e.stunTimer && e.stunTimer > 0) {
      e.stunTimer -= dt;
    } else {
      e.y -= e.speed * dt; // descend
      moving = e.speed > 0.1;
    }

    // Trailing wake: faint foam puffs behind a moving hull (above it, since
    // ships travel downward). Throttled per ship so the pool isn't flooded.
    if (moving) {
      e.wakeTimer = (e.wakeTimer || 0) - dt;
      if (e.wakeTimer <= 0) {
        e.wakeTimer = 0.22 + Math.random() * 0.12;
        const wx = -ww / 2 + lw * (e.lane + 0.5) + (e.driftX || 0) + (e.pullX || 0);
        const wy = e.y + shipHalfHeight(e.type) * 0.7; // behind (above) the hull
        spawnWake(wx, wy, 0x9fb8c4); // pale foam-blue, small quick puff
      }
    }

    // Zeus charring: deferred kill stage (electric arcs then heat)
    if (e.zeusCharring > 0) {
      e.zeusCharring -= dt;
      // Visual: electric white-blue flicker during charring
      const flicker = Math.random() > 0.5 ? 2.5 : 1.2;
      e.spriteMat.color.setRGB(flicker, flicker, flicker * 1.2); // slight blue tint
      // Electric arc sparks around the hull
      const ww2 = getWorldWidth();
      const lw2 = ww2 / ENEMY_LANE_COUNT;
      const ex2 = -ww2 / 2 + lw2 * (e.lane + 0.5) + (e.driftX || 0) + (e.pullX || 0);
      if (Math.random() < 0.6) {
        spawnSparks(ex2, e.y, 0x88ccff, 2); // blue-white electric sparks
      }
      if (e.zeusCharring <= 0 && e.zeusPendingHeat) {
        // Apply the deferred heat now — bright electric burst on death
        spawnContactGlow(ex2, e.y, 0xaaddff, 80);
        e.heat += e.zeusPendingHeat;
        e.zeusPendingHeat = 0;
        e.spriteMat.color.setRGB(1, 1, 1); // reset tint
      }
    }

    // Propulsion animation
    if (e.propulsion === 'oared') {
      // Oar cycle: slow synchronized stroke (period ~2s)
      e.oarPhase += dt * 3.2; // ~2s full cycle
      // Hull rock: once per two strokes, ±1.5 degrees (slower, less twitchy)
      e.mesh.rotation.z = Math.sin(e.oarPhase * 0.5) * 0.026;
      e.driftX = 0;
    } else {
      // Sailed: gentle lateral drift (slow sinusoid)
      e.oarPhase += dt * 1.2;
      e.driftX = Math.sin(e.oarPhase) * 0.8; // gentle sway
      e.mesh.rotation.z = Math.sin(e.oarPhase * 0.7) * 0.015; // very slight roll
    }

    // Ships descend to the stone battlement and only breach when their hull's
    // LEADING (bottom) edge touches the battlement top. Damage is therefore
    // always at the wall/shoreline — never in open water mid-screen. The
    // `breached` guard makes the first-contact burst fire exactly once.
    //
    // STRICT STOP-LINE: hard-clamp the hull so its leading edge can never sink
    // past the battlement top within a single frame step. Without this, a fast
    // ship (or a large dt hitch) could overshoot the line for a frame and
    // visually dip its hull down onto the Bronze/Silver/Gold discs sitting at
    // the wall before the breach removes it. Clamping to `BATTLEMENT_TOP_Y +
    // half` guarantees zero ship-on-disc overlap: the hull rests exactly on the
    // line, then breaches. (BATTLEMENT_TOP_Y === RAM_LINE_Y === RAM_STOP_EDGE.)
    const half = shipHalfHeight(e.type);
    if (e.y - half < BATTLEMENT_TOP_Y) {
      e.y = BATTLEMENT_TOP_Y + half;
    }
    const leadingEdge = e.y - half;
    const atWall = leadingEdge <= BATTLEMENT_TOP_Y;

    // Clamp the contact X to the visible battlement so edge/flank ships (and
    // Poseidon-pulled ones) always render on-screen with a matching flash.
    const rawX = -ww / 2 + lw * (e.lane + 0.5) + (e.driftX || 0) + (e.pullX || 0);
    const edgeX = ww / 2 - 2;
    const cx = Math.max(-edgeX, Math.min(edgeX, rawX));

    if (atWall) {
      // INSTANT breach: deal the full wall damage ONCE, fire an explosion +
      // smoke burst, then remove the ship the SAME frame — it never lingers,
      // sinks, or stacks at the bottom of the screen.
      const dripPct = BREACH_DRIP_PCT[e.type] != null ? BREACH_DRIP_PCT[e.type] : 0.05;
      const heatFrac = Math.min(1, (e.heat || 0) / e.maxHp);
      // One-shot damage: the full breach amount (was bled over the sink window),
      // reduced if the ship was already burning.
      wallDamage += WALL_MAX_HP * dripPct * BREACH_SINK_TIME * Math.max(0.2, 1 - heatFrac);
      const heavy = (e.type === 'flagship' || e.type === 'quadrireme');
      spawnDestruction(cx, BATTLEMENT_TOP_Y + half, heavy); // explosion + embers
      spawnSmoke(cx, BATTLEMENT_TOP_Y + 1, 2);              // parting smoke burst
      lastBreaches.push({ x: cx, lane: e.lane });           // battlement stone flash
      deactivateEnemy(e);  // remove from logic array + fully hide/reset the mesh
      continue;
    }
    positionEnemy(e);
    updateEnemyVisual(e);
  }
  return wallDamage;
}

function applyGoldSlow(enemy) { enemy.slowed = true; }

// Wind state: affects sailed ships more than oared
let windActive = false;
const WIND_SAIL_SLOW = 0.35;  // sailed ships slowed to 35% speed
const WIND_OAR_SLOW = 0.85;  // oared ships barely affected (85%)

function setWindActive(active) { windActive = active; }
function isWindActive() { return windActive; }

function applySlowStates() {
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;
    let speedMult = 1.0;
    if (e.slowed) speedMult *= 0.5; // gold beam slow
    if (windActive) {
      speedMult *= (e.propulsion === 'sailed') ? WIND_SAIL_SLOW : WIND_OAR_SLOW;
    }
    e.speed = e.baseSpeed * speedMult;
  }
}

function deactivateEnemy(enemy) {
  enemy.active = false;
  enemy.mesh.visible = false;
  // Clear per-mesh visual state so a lingering/hidden hull can never show
  // (charred colour, ember glow, faded sprite) if anything toggles visibility.
  if (enemy.emberGlow) enemy.emberGlow.material.opacity = 0;
  if (enemy.spriteMat) { enemy.spriteMat.opacity = 1; enemy.spriteMat.color.setRGB(1, 1, 1); }
  enemy.heat = 0;
  enemy.burn = 0;
  enemy.breached = false;
  enemy.sinkTimer = 0;
}

function triggerKillEffect(enemy, reward) {
  addKillReward(reward);
  if (enemy.hullMat) enemy.hullMat.color.setHex(0xffffff);
}

function getActiveEnemies() { return pool.filter(e => e.active); }

function resetEnemies() {
  for (let i = 0; i < pool.length; i++) {
    pool[i].active = false;
    pool[i].mesh.visible = false;
  }
}

function positionEnemy(e) {
  const worldWidth = getWorldWidth();
  const laneWidth = worldWidth / ENEMY_LANE_COUNT;
  const x = -worldWidth / 2 + laneWidth * (e.lane + 0.5);
  e.mesh.position.x = x + (e.driftX || 0) + (e.pullX || 0);
  e.mesh.position.y = e.y;
}

function updateEnemyVisual(e) {
  e.burn = Math.max(0, (e.heat || 0) / e.maxHp);
  e.barFill.scale.x = e.burn;
  e.barFill.position.x = -2.5 * (1 - e.burn);

  // Swap sprite texture to match type
  const tex = shipTextures[e.type] || shipTextures.skiff;
  if (e.spriteMat.map !== tex) {
    e.spriteMat.map = tex;
    e.spriteMat.needsUpdate = true;
  }

  // --- Charring: hull darkens toward charcoal as heat fills. The sprite colour
  // multiplies from white (1) down toward near-black charcoal (0.12) by burn.
  // A brief coloured lick from the last beam hit rides on top for feedback.
  const char = 1 - e.burn * 0.88;           // 1 → 0.12
  let cr = char, cg = char, cb = char;
  if (e.bandsHitting > 0 && e.lastHitColour !== 0) {
    const r = ((e.lastHitColour >> 16) & 0xff) / 255;
    const g = ((e.lastHitColour >> 8) & 0xff) / 255;
    const b = (e.lastHitColour & 0xff) / 255;
    const t = 0.25; // subtle beam-colour lick over the charred hull
    cr = char * (1 - t) + r * t;
    cg = char * (1 - t) + g * t;
    cb = char * (1 - t) + b * t;
  } else if (e.slowed) {
    cr = char * 0.7; cg = char * 0.9; cb = char * 0.5; // frosty gold-slow tint
  }
  e.spriteMat.color.setRGB(cr, cg, cb);

  // --- Emissive orange edge glow that ramps up just before ignition. Starts
  // appearing past ~55% heat and pulses hotter (toward white-orange) near 100%.
  if (e.emberGlow) {
    if (e.burn > 0.55) {
      const ign = (e.burn - 0.55) / 0.45;              // 0..1 over the last 45%
      const flick = 0.8 + 0.2 * Math.sin(performance.now() * 0.02 + e.oarPhase);
      e.emberGlow.material.opacity = Math.min(0.9, ign * 0.9) * flick;
      // Shift hue from ember-orange toward hot white-orange as it peaks.
      const g = 0.4 + ign * 0.5; // green channel rises → whiter/hotter
      e.emberGlow.material.color.setRGB(1, g, 0.1 + ign * 0.2);
      const gs = 1 + ign * 0.25;
      e.emberGlow.scale.set(gs, gs, 1);
    } else {
      e.emberGlow.material.opacity = 0;
    }
  }

  const s = SHIP_SIZE[e.type] || 3;
  e.mesh.scale.set(s/3, s/3, 1);
  // Shield plate visibility + glint
  if (e.shieldPlate) {
    const isShield = (e.type === 'shieldbearer');
    e.shieldPlate.visible = isShield;
    if (isShield) {
      // Subtle glint: opacity pulse
      const glint = 0.85 + 0.15 * Math.sin(performance.now() * 0.004 + e.oarPhase);
      e.shieldPlate.material.opacity = glint;
    }
  }

  // Oar animation (oared ships only)
  if (e.oarMeshes) {
    const isOared = e.propulsion === 'oared';
    for (const oarObj of e.oarMeshes) {
      oarObj.mesh.visible = isOared;
      if (isOared) {
        // Rowing stroke: sweep in a shallow arc below the hull
        // Base angle is downward-outward (0.6 rad), stroke adds ±0.3 rad
        const stroke = Math.sin(e.oarPhase + oarObj.index * 0.4);
        oarObj.mesh.rotation.z = oarObj.side * (0.6 + stroke * 0.25);
      }
    }
  }
}


// === src/enemy-spawner.js ===
// ============================================================
// src/enemy-spawner.js — Spawn schedule for 600s session
// Phase 1 (0-60s): Skiffs, first shield-bearer at 30s.
// Phase 2 (60-180s): Mixed, shield-bearer escorts every 20s.
// Phase 3 (180-540s): Heavy, shield-bearers on all lanes.
// Phase 4 (540-600s): Flagship.
// ============================================================




const PHASE1_INTERVAL = 2.5;
const PHASE2_INTERVAL = 1.5;
const PHASE3_INTERVAL = 1.2;
const INITIAL_DELAY = 2.0;

// Shield-bearer escort: tight column with 6-unit Y spacing
const ESCORT_SPACING = 6;

let spawnTimer = 0;
let spawnerElapsed = 0;
let totalSpawns = 0;
let flagshipSpawned = false;
let shieldBearerTimer = 0;
let firstShieldSpawned = false;
let shieldBearerLaneIndex = 0; // cycles through lanes

// --- Scripted 90s opening (judge-facing tutorial curve) ---
// Deterministic spawns for the first 90s. Each event fires once when the
// session clock passes its time. After 90s the normal phase spawner takes over.
const SCRIPT_END = 90;
const OPENING_SCRIPT = [
  // 0-20s: 3 slow skiffs, spaced — easy beam-aiming + altar-feeding tutorial
  { t: 2,  fn: () => spawnEnemy('skiff', 2, 1.0) },
  { t: 9,  fn: () => spawnEnemy('skiff', 1, 1.0) },
  { t: 15, fn: () => spawnEnemy('skiff', 3, 1.0) },
  // 20-45s: paired flank spawns — forces a 2nd mirror purchase
  { t: 21, fn: () => { spawnEnemy('skiff', 0, 1.0); spawnEnemy('skiff', 4, 1.0); } },
  { t: 28, fn: () => { spawnEnemy('skiff', 0, 1.0); spawnEnemy('skiff', 4, 1.0); } },
  { t: 34, fn: () => { spawnEnemy('trireme', 0, 1.0); spawnEnemy('trireme', 4, 1.0); } },
  { t: 40, fn: () => { spawnEnemy('trireme', 1, 1.0); spawnEnemy('trireme', 3, 1.0); } },
  // 45-75s: shield-bearers + triremes — pushes Helios stun / Poseidon vortex
  { t: 46, fn: () => spawnShieldFormation(2, 1.0) },
  { t: 55, fn: () => { spawnShieldFormation(1, 1.05); spawnEnemy('trireme', 3, 1.05); } },
  { t: 64, fn: () => { spawnShieldFormation(3, 1.1); spawnEnemy('trireme', 1, 1.1); } },
  { t: 71, fn: () => { spawnEnemy('quadrireme', 2, 1.1); spawnEnemy('trireme', 0, 1.1); spawnEnemy('trireme', 4, 1.1); } },
  // 75-90s: fast assault wave — tests defence + ultimate combos
  { t: 76, fn: () => { for (let l = 0; l < 5; l++) spawnEnemy('skiff', l, 1.15); } },
  { t: 81, fn: () => { spawnEnemy('trireme', 0, 1.2); spawnEnemy('trireme', 2, 1.2); spawnEnemy('trireme', 4, 1.2); } },
  { t: 85, fn: () => { spawnShieldFormation(2, 1.2); spawnEnemy('quadrireme', 0, 1.2); spawnEnemy('quadrireme', 4, 1.2); } },
  { t: 89, fn: () => { for (let l = 0; l < 5; l++) spawnEnemy('skiff', l, 1.25); } },
];
let scriptIndex = 0;

function getSpawnCount() { return totalSpawns; }
function getCurrentInterval() { return getInterval(); }

function updateSpawner(dt, sessionTime) {
  spawnerElapsed = sessionTime;

  // --- Scripted opening: deterministic curve for the first 90s ---
  if (spawnerElapsed < SCRIPT_END) {
    while (scriptIndex < OPENING_SCRIPT.length && spawnerElapsed >= OPENING_SCRIPT[scriptIndex].t) {
      OPENING_SCRIPT[scriptIndex].fn();
      totalSpawns++;
      scriptIndex++;
    }
    return; // suppress the procedural spawner during the scripted opening
  }

  // Reset the procedural timers the first time we cross out of the script so
  // the phase spawner starts cleanly (no burst from a stale timer), and mark the
  // shield-bearer intro as done (the script already taught it) so the periodic
  // branch runs instead of re-spawning the lone "first" shield-bearer.
  if (!firstShieldSpawned) {
    firstShieldSpawned = true;
    shieldBearerTimer = 20;
    spawnTimer = getInterval();
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0 && spawnerElapsed >= INITIAL_DELAY) {
    doSpawn();
    totalSpawns++;
    spawnTimer = getInterval();
  }

  // Shield-bearer + escort spawning (separate timer)
  if (!firstShieldSpawned && spawnerElapsed >= 30) {
    firstShieldSpawned = true;
    // First one: alone in centre (the lesson — isolated, readable)
    spawnShieldFormation(2, 1.0);
    shieldBearerTimer = 20;
  } else if (firstShieldSpawned && spawnerElapsed >= 60) {
    shieldBearerTimer -= dt;
    if (shieldBearerTimer <= 0) {
      shieldBearerTimer = 20;
      const hpMult = 1 + (spawnerElapsed / SESSION_DURATION) * ESCALATION_HP_FACTOR;
      // Alternate through all 5 lanes
      const lane = getNextShieldLane();
      spawnShieldFormation(lane, hpMult);
    }
  }
}

// Spawn shield-bearer leading 2-3 escorts in tight column
function spawnShieldFormation(lane, hpMult) {
  // Leader
  spawnEnemy('shieldbearer', lane, hpMult, 0);
  // 2 trailing ships (skiffs early, triremes later)
  const escortType = spawnerElapsed < PHASE_2_END ? 'skiff' : 'trireme';
  const escortCount = spawnerElapsed < PHASE_2_END ? 2 : 3;
  for (let i = 1; i <= escortCount; i++) {
    spawnEnemy(escortType, lane, hpMult, ESCORT_SPACING * i);
  }
}

// Cycle shield-bearer through lanes: 2, 0, 4, 1, 3, repeat
function getNextShieldLane() {
  const order = [2, 0, 4, 1, 3];
  const lane = order[shieldBearerLaneIndex % order.length];
  shieldBearerLaneIndex++;
  return lane;
}

function resetSpawner() {
  spawnTimer = INITIAL_DELAY;
  spawnerElapsed = 0;
  totalSpawns = 0;
  flagshipSpawned = false;
  shieldBearerTimer = 0;
  firstShieldSpawned = false;
  shieldBearerLaneIndex = 0;
  scriptIndex = 0;
}

function getInterval() {
  if (spawnerElapsed < PHASE_1_END) return PHASE1_INTERVAL;
  if (spawnerElapsed < PHASE_2_END) return PHASE2_INTERVAL;
  return PHASE3_INTERVAL;
}

function doSpawn() {
  const hpMult = 1 + (spawnerElapsed / SESSION_DURATION) * ESCALATION_HP_FACTOR;

  if (spawnerElapsed >= PHASE_3_END && !flagshipSpawned) {
    // Flagship: random lane, drifts laterally (handled in enemy update if desired)
    const bossLane = Math.floor(Math.random() * ENEMY_LANE_COUNT);
    spawnEnemy('flagship', bossLane, 1.0);
    flagshipSpawned = true;
    return;
  }

  // All phases: use full lane range for all types
  const lane = Math.floor(Math.random() * ENEMY_LANE_COUNT);

  if (spawnerElapsed < PHASE_1_END) {
    // Phase 1: skiffs on random lanes
    spawnEnemy('skiff', lane, hpMult);
  } else if (spawnerElapsed < PHASE_2_END) {
    // Phase 2: mix of types across all lanes
    const roll = Math.random();
    if (roll < 0.25) {
      spawnEnemy('quadrireme', lane, hpMult);
    } else if (roll < 0.55) {
      spawnEnemy('trireme', lane, hpMult);
    } else {
      spawnEnemy('skiff', lane, hpMult);
    }
    // Paired pressure every 5th spawn on random opposite lanes
    if (totalSpawns % 5 === 0) {
      const pairA = Math.floor(Math.random() * 2);       // 0 or 1
      const pairB = ENEMY_LANE_COUNT - 1 - pairA;        // 4 or 3
      spawnEnemy('skiff', pairA, hpMult);
      spawnEnemy('skiff', pairB, hpMult);
    }
  } else {
    // Phase 3: heavy across all lanes
    const roll = Math.random();
    if (roll < 0.35) {
      spawnEnemy('quadrireme', lane, hpMult);
    } else if (roll < 0.65) {
      spawnEnemy('trireme', lane, hpMult);
    } else {
      spawnEnemy('skiff', lane, hpMult);
    }
    // Paired heavy pressure every 4th spawn
    if (totalSpawns % 4 === 0) {
      const pairA = Math.floor(Math.random() * 2);       // 0 or 1
      const pairB = ENEMY_LANE_COUNT - 1 - pairA;        // 4 or 3
      spawnEnemy('trireme', pairA, hpMult);
      spawnEnemy('trireme', pairB, hpMult);
    }
  }
}


// === src/foundry.js ===
// ============================================================
// src/foundry.js — Beam-powered altar economy with overheat
//
// 4 altar zones on the city ground. Each requires a beam held on it
// for 80% of its rate. 20% accrues passively.
// Overheat: efficiency halves after 6s continuous, recovers over 10s.
// No beam can reach an altar AND a ship (opposite directions).
// ============================================================






let resources = { bronze: 0, silver: 0, gold: 0 };
let faith = 0;
const altars = [];

function getResources() { return resources; }
function getFaith() { return faith; }
function gainFaith(amount) { faith += amount; }

function canAfford(cost) {
  if (!cost) return false;
  for (const key in cost) {
    if ((resources[key] || 0) < cost[key]) return false;
  }
  return true;
}

function spend(cost) {
  for (const key in cost) { resources[key] -= cost[key]; }
}

function addKillReward(reward) {
  if (!reward) return;
  for (const key in reward) { resources[key] = (resources[key] || 0) + reward[key]; }
}

function resetFoundries() {
  resources = { bronze: 0, silver: 0, gold: 0 };
  faith = 0;
  for (const a of altars) {
    a.litTime = 0; a.overheated = false; a.cooldown = 0; a.everLit = false;
  }
}

function spendFaith(amount) { faith -= amount; }

function initFoundries() {
  const scene = getScene();
  resetFoundries();
  altars.length = 0;

  for (let i = 0; i < ALTAR_POSITIONS.length; i++) {
    const def = ALTAR_POSITIONS[i];

    // --- Glow ring (attention-grabbing pulse when unlit) ---
    const glowGeo = new THREE.RingGeometry(
      Math.max(ALTAR_HW, ALTAR_HH) * 1.3,
      Math.max(ALTAR_HW, ALTAR_HH) * 1.6,
      32
    );
    const glowMat = new THREE.MeshBasicMaterial({
      color: def.colour, transparent: true, opacity: 0.0, side: THREE.DoubleSide
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    glowMesh.position.set(def.x, def.y, -0.2);
    scene.add(glowMesh);

    // --- Altar body mesh ---
    const geo = new THREE.PlaneGeometry(ALTAR_HW * 2, ALTAR_HH * 2);
    const mat = new THREE.MeshBasicMaterial({
      color: def.colour, transparent: true, opacity: 0.25
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(def.x, def.y, -0.1);
    scene.add(mesh);

    // --- Engraved pedestal label ---
    // The metal name is carved into the altar's stone keystone (chiselled look:
    // dark recessed text with a faint highlight), sitting ON the altar itself —
    // not a floating tag above the wall. Always visible.
    const lCanvas = document.createElement('canvas');
    lCanvas.width = 96; lCanvas.height = 24;
    const lCtx = lCanvas.getContext('2d');
    lCtx.font = 'bold 11px monospace';
    lCtx.textAlign = 'center';
    lCtx.textBaseline = 'middle';
    const lbl = def.label || def.type.toUpperCase();
    // Chiselled engraving: dark recessed glyphs + a 1px lighter bevel below-right.
    lCtx.fillStyle = 'rgba(255,255,255,0.18)'; // faint bevel highlight
    lCtx.fillText(lbl, 48, 13);
    lCtx.fillStyle = '#1a1206';                // dark carved recess
    lCtx.fillText(lbl, 48, 12);
    const lTex = new THREE.CanvasTexture(lCanvas);
    lTex.minFilter = THREE.LinearFilter;
    lTex.premultiplyAlpha = false;
    const lGeo = new THREE.PlaneGeometry(6.5, 1.6);
    const lMat = new THREE.MeshBasicMaterial({ map: lTex, transparent: true, alphaTest: 0.05, depthWrite: false });
    const labelMesh = new THREE.Mesh(lGeo, lMat);
    // Engraved onto the pedestal: sits on the altar body, just in front of it.
    labelMesh.position.set(def.x, def.y, 0.05);
    scene.add(labelMesh);

    // --- Overheat arc (RingGeometry with partial theta) ---
    const arcRadius = Math.max(ALTAR_HW, ALTAR_HH) * 1.1;
    const arcGeo = new THREE.RingGeometry(arcRadius - 0.3, arcRadius, 32, 1, 0, 0.01);
    const arcMat = new THREE.MeshBasicMaterial({
      color: 0x44cc44, transparent: true, opacity: 0.9, side: THREE.DoubleSide
    });
    const arcMesh = new THREE.Mesh(arcGeo, arcMat);
    arcMesh.position.set(def.x, def.y, 0.3);
    arcMesh.visible = false;
    scene.add(arcMesh);

    altars.push({
      type: def.type, colour: def.colour,
      x: def.x, y: def.y,
      mesh, glowMesh, arcMesh, arcRadius, labelMesh,
      lit: false, everLit: false,
      litTime: 0, overheated: false, cooldown: 0
    });
  }
}

function updateFoundries(dt) {
  const segments = getSegments();
  const time = performance.now() * 0.001; // seconds for animation

  for (const altar of altars) {
    // Check if any beam segment hits this altar (segment-vs-AABB)
    // Pre-split beam (raw sun column) does not power altars
    altar.lit = false;
    for (let s = 0; s < segments.length; s++) {
      if (segments[s].preSplit) continue;
      if (segHitsBox(segments[s], altar.x, altar.y, ALTAR_HW, ALTAR_HH)) {
        altar.lit = true;
        segments[s].active = true; // beam feeding an altar → full-opacity tier
        // don't break: mark all segments feeding this altar
      }
    }
    if (altar.lit) altar.everLit = true;

    // Overheat logic
    if (altar.lit) {
      altar.litTime += dt;
      altar.cooldown = 0;
    } else {
      altar.litTime = 0;
      if (altar.overheated) {
        altar.cooldown += dt;
        if (altar.cooldown >= ALTAR_RECOVER_TIME) {
          altar.overheated = false;
          altar.cooldown = 0;
        }
      }
    }
    if (altar.litTime >= ALTAR_OVERHEAT_TIME && !altar.overheated) {
      altar.overheated = true;
    }

    // Compute efficiency
    let efficiency = 1.0;
    if (altar.overheated) efficiency = 0.5;

    // Resource accumulation
    const rates = ALTAR_RATES[altar.type];
    const passiveRate = rates.passive;
    const litRate = altar.lit ? rates.lit : 0;
    const totalRate = (passiveRate + litRate) * efficiency;
    resources[altar.type] += totalRate * dt;

    // --- VISUAL FEEDBACK ---

    // 1. Body mesh opacity
    if (altar.lit) {
      altar.mesh.material.opacity = altar.overheated ? 0.55 : 0.8;
    } else {
      // Unlit: gentle pulse if never lit (attract attention)
      if (!altar.everLit) {
        const pulse = 0.2 + 0.15 * Math.sin(time * 2.5 + altar.x * 0.5);
        altar.mesh.material.opacity = pulse;
      } else {
        altar.mesh.material.opacity = 0.25;
      }
    }

    // 2. Glow ring
    if (altar.lit) {
      // Steady bright glow matching metal colour
      altar.glowMesh.material.opacity = altar.overheated ? 0.2 : 0.5;
    } else if (!altar.everLit) {
      // Attention pulse — gentle breathing glow
      const gPulse = 0.1 + 0.2 * Math.abs(Math.sin(time * 1.8 + altar.x * 0.3));
      altar.glowMesh.material.opacity = gPulse;
    } else {
      altar.glowMesh.material.opacity = 0.0;
    }

    // 3. Overheat arc
    const heatFrac = Math.min(1, altar.litTime / ALTAR_OVERHEAT_TIME);
    const coolFrac = altar.overheated ? (1 - altar.cooldown / ALTAR_RECOVER_TIME) : 0;
    const arcFrac = altar.lit ? heatFrac : coolFrac;

    if (arcFrac > 0.01) {
      altar.arcMesh.visible = true;
      // Rebuild arc geometry with new theta length
      const theta = arcFrac * Math.PI * 2;
      altar.arcMesh.geometry.dispose();
      altar.arcMesh.geometry = new THREE.RingGeometry(
        altar.arcRadius - 0.3, altar.arcRadius, 32, 1,
        Math.PI * 0.5, // start at top
        theta
      );
      // Color: green → yellow → red
      if (arcFrac < 0.5) altar.arcMesh.material.color.setHex(0x44cc44);
      else if (arcFrac < 0.8) altar.arcMesh.material.color.setHex(0xcccc44);
      else altar.arcMesh.material.color.setHex(0xcc4444);
      if (altar.overheated) altar.arcMesh.material.color.setHex(0xcc4444);
    } else {
      altar.arcMesh.visible = false;
    }
  }

  // Passive Faith trickle: +0.5 Faith/s per actively burning ship, so Faith
  // builds naturally toward the ultimates even before a Helios cast.
  // (Helios still grants its burst on top of this.)
  let burning = 0;
  const pool = getEnemyPool();
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (e.active && e.heat > 0 && !e.shieldBlocking) burning++;
  }
  faith += burning * 0.5 * dt;
}

// Segment-vs-AABB intersection test
function segHitsBox(seg, cx, cy, hw, hh) {
  const sx = seg.start.x, sy = seg.start.y;
  const ex = seg.end.x, ey = seg.end.y;
  const dx = ex - sx, dy = ey - sy;
  const xmin = cx - hw, xmax = cx + hw;
  const ymin = cy - hh, ymax = cy + hh;
  let tmin = 0, tmax = 1;
  if (Math.abs(dx) < 1e-8) {
    if (sx < xmin || sx > xmax) return false;
  } else {
    let t1 = (xmin - sx) / dx, t2 = (xmax - sx) / dx;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }
  if (Math.abs(dy) < 1e-8) {
    if (sy < ymin || sy > ymax) return false;
  } else {
    let t1 = (ymin - sy) / dy, t2 = (ymax - sy) / dy;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }
  return true;
}

// Legacy compatibility (brass removed → maps to bronze, the common tier)
function getSlag() { return resources.bronze; }
function getInsight() { return resources.bronze; }
function getRecombination() { return 0; }
function getInsightLog() { return []; }
function spendSlag() {}
function spendInsight() {}
function addSlagDirect(amount) { resources.bronze += amount; }
function getFoundryColliders() { return []; }
function getAltarAudioState() {
  let litCount = 0;
  let anyOverheated = false;
  for (const a of altars) {
    if (a.lit) litCount++;
    if (a.overheated) anyOverheated = true;
  }
  return { litCount, anyOverheated };
}
