// THREE is available as a global from the vendor script above

// --- Intro video layer ---
(function() {
  var layer = document.getElementById('intro-layer');
  var video = document.getElementById('intro-video');
  var tapMsg = document.getElementById('intro-tap');
  var started = false;
  var gameStarted = false;
  var debugMode = window.location.search.indexOf('debug=1') > -1;
  var debugEl = null;

  if (debugMode) {
    debugEl = document.createElement('div');
    debugEl.style.cssText = 'position:fixed;bottom:10px;left:10px;color:lime;font:11px monospace;z-index:999999;background:rgba(0,0,0,0.8);padding:6px;white-space:pre;';
    document.body.appendChild(debugEl);
  }
  updateDebugInfo('loading video');

  // Force layout so video has real dimensions (iOS refuses zero-size play)
  void video.offsetHeight;

  // On iOS, video won't load until a user gesture, so we allow tap immediately.
  // play() in the gesture handler will trigger load+play in one step.

  // --- TAP HANDLER ---
  layer.addEventListener('pointerdown', function() {
    if (started) return;
    started = true;
    // Strategy: start muted (always succeeds from gesture), then unmute immediately.
    // Chrome rejects unmuted play() on low-engagement sites, but allows unmuting
    // a playing video within the same user activation.
    video.muted = true;
    var playPromise = video.play();
    tapMsg.style.display = 'none';
    if (playPromise && playPromise.then) {
      playPromise.then(function() {
        // Unmute now — still within the user activation microtask chain
        video.muted = false;
        updateDebugInfo('video playing, unmuted');
      }).catch(function(err) {
        updateDebugInfo('play() failed entirely: ' + err.name);
        startGame();
      });
    } else {
      // Older browser, no promise — just unmute
      video.muted = false;
    }
    // 12-second failsafe (video is ~10s, transition at 8.3s — this is emergency only)
    setTimeout(function() {
      if (!gameStarted) {
        updateDebugInfo('FAILSAFE 12s');
        startGame();
      }
    }, 12000);
  });

  video.addEventListener('ended', startGame);
  // White-flash transition: video has a flash at ~8.0s then fades to black.
  // Start game at the peak so the player never sees dead black frames.
  var transitioned = false;
  var FLASH_START = 8.0;
  var FLASH_GAME  = 8.3;  // start game while screen is still white
  video.addEventListener('timeupdate', function() {
    if (transitioned || !started) return;
    var t = video.currentTime;
    if (t >= FLASH_START) {
      // Fade intro layer to white
      layer.style.transition = 'background 0.3s';
      layer.style.background = '#fff';
    }
    if (t >= FLASH_GAME) {
      transitioned = true;
      video.pause();
      startGame();
    }
  });
  video.addEventListener('error', function() {
    updateDebugInfo('video error');
    startGame();
  });

  // Skip by tapping during playback
  video.addEventListener('pointerdown', function(e) {
    if (started && !video.ended && !gameStarted) {
      e.stopPropagation();
      video.pause();
      startGame();
    }
  });

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    layer.style.display = 'none';
    try {
      if (typeof init === 'function') init();
      updateDebugInfo('startGame OK');
    } catch(e) {
      updateDebugInfo('init ERROR: ' + e.message);
    }
  }

  function updateDebugInfo(msg) {
    if (!debugEl) return;
    debugEl.textContent = 'DEBUG ' + msg + ' | vidReady=' + (video ? video.readyState : '?') + ' | game=' + gameStarted;
  }
})();

// --- Defeat video layer ---
// Plays once per browsing session on first loss. Skippable. Falls back to defeat screen on any failure.
(function() {
  var defeatLayer = document.getElementById('defeat-layer');
  var defeatVideo = document.getElementById('defeat-video');
  var defeatPlayed = false;
  var defeatActive = false;
  var defeatDone = false;
  var FADE_START = 8.5;
  var FADE_CUT   = 9.0;

  // Check sessionStorage — only play once per browsing session
  try { defeatPlayed = sessionStorage.getItem('defeatPlayed') === '1'; } catch(e) {}

  // Preload: start fetching a few seconds into gameplay
  var preloadTimer = setTimeout(function() {
    if (!defeatPlayed) {
      defeatVideo.src = './assets/archimed_fail.mp4?v=3';
      defeatVideo.load();
    }
  }, 5000);

  // Exposed globally so session.js triggerLose can call it
  window.playDefeatCinematic = function(onDone) {
    // onDone: callback to show the defeat overlay
    if (defeatPlayed || defeatActive) { onDone(); return; }
    defeatActive = true;
    defeatDone = false;

    var finish = function() {
      if (defeatDone) return;
      defeatDone = true;
      defeatPlayed = true;
      try { sessionStorage.setItem('defeatPlayed', '1'); } catch(e) {}
      defeatVideo.pause();
      defeatLayer.style.display = 'none';
      onDone();
    };

    // If video not ready, skip straight to defeat screen
    if (!defeatVideo.src || defeatVideo.readyState < 2) {
      finish();
      return;
    }

    // Show layer and play
    defeatLayer.style.display = 'flex';
    defeatLayer.style.background = '#000';
    var playPromise = defeatVideo.play();
    if (playPromise && playPromise.then) {
      playPromise.catch(function() { finish(); });
    }

    // Fade-to-black transition
    defeatVideo.addEventListener('timeupdate', function onTime() {
      if (defeatDone) { defeatVideo.removeEventListener('timeupdate', onTime); return; }
      var t = defeatVideo.currentTime;
      if (t >= FADE_START) {
        defeatLayer.style.transition = 'background 0.5s';
        defeatLayer.style.background = '#000';
      }
      if (t >= FADE_CUT) {
        defeatVideo.removeEventListener('timeupdate', onTime);
        finish();
      }
    });

    // Fallbacks
    defeatVideo.addEventListener('ended', finish);
    defeatVideo.addEventListener('error', finish);

    // Skip on tap
    defeatLayer.addEventListener('pointerdown', function skipTap() {
      defeatLayer.removeEventListener('pointerdown', skipTap);
      finish();
    });

    // Failsafe: 12s max
    setTimeout(function() { if (!defeatDone) finish(); }, 12000);
  };
})();

// === src/renderer.js ===
// ============================================================
// src/renderer.js — Three.js scene, orthographic camera, resize
// Fixed 9:16 portrait render target with letterboxing.
// Two-pass rendering: main scene + overlay scene (always on top).
// ============================================================



const TARGET_ASPECT = 9 / 16;

let scene, camera, renderer, worldWidth;
// Overlay scene renders on top of main scene (second pass, no depth issues)
let overlayScene, overlayCamera;

function initRenderer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080808);

  worldWidth = WORLD_HEIGHT * TARGET_ASPECT;
  const hw = worldWidth / 2;
  const hh = WORLD_HEIGHT / 2;

  camera = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 100);
  camera.position.z = 50;

  // Overlay scene (no background, renders on top)
  overlayScene = new THREE.Scene();
  overlayCamera = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 100);
  overlayCamera.position.z = 50;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.autoClear = false; // we manage clearing manually for two-pass
  document.body.appendChild(renderer.domElement);

  applyLetterbox();
  window.addEventListener('resize', applyLetterbox);
}

function applyLetterbox() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const winAspect = winW / winH;

  let canvasW, canvasH;
  if (winAspect > TARGET_ASPECT) {
    canvasH = winH;
    canvasW = Math.floor(winH * TARGET_ASPECT);
  } else {
    canvasW = winW;
    canvasH = Math.floor(winW / TARGET_ASPECT);
  }

  renderer.setSize(canvasW, canvasH);

  const el = renderer.domElement;
  el.style.position = 'absolute';
  el.style.left = Math.floor((winW - canvasW) / 2) + 'px';
  el.style.top = Math.floor((winH - canvasH) / 2) + 'px';
}

function getScene() { return scene; }
function getOverlayScene() { return overlayScene; }
function getCamera() { return camera; }
function getRenderer() { return renderer; }
function getWorldWidth() { return worldWidth; }

function render() {
  renderer.clear();
  renderer.render(scene, camera);
  // Second pass: overlay scene renders on top without clearing
  renderer.clearDepth();
  renderer.render(overlayScene, overlayCamera);
}

function screenToWorld(sx, sy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((sx - rect.left) / rect.width) * 2 - 1;
  const ny = -((sy - rect.top) / rect.height) * 2 + 1;
  const hw = worldWidth / 2;
  const hh = WORLD_HEIGHT / 2;
  return { x: nx * hw, y: ny * hh };
}


// === src/background.js ===
// ============================================================
// src/background.js — Environment bands for reversed layout
// Sky strip at top, sea from spawn to wall, city ground at bottom.
// All boundaries derived from gameplay constants.
// ============================================================




// Colours (all below 22% luminance)
const COL_SKY = 0x0a1520;
const COL_DEEP_SEA = 0x12303F;
const COL_SHALLOW_SEA = 0x1A4257;
const COL_GROUND = 0x2E2419;

let seaMesh = null;
let seaTexture = null;
let reduceMotion = false;

function initBackground() {
  const scene = getScene();
  const ww = getWorldWidth();
  const hh = WORLD_HEIGHT / 2;

  if (typeof window.matchMedia === 'function') {
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // Band boundaries derived from layout constants:
  // Sky: top of world to SHIP_SPAWN_Y (thin strip above ships)
  // Sea: SHIP_SPAWN_Y down to WALL_Y (where ships travel)
  // Ground: WALL_Y down to bottom of world (city, mirrors, player area)
  const skyTop = hh;
  const skyBot = SHIP_SPAWN_Y + 2;
  const seaTop = skyBot;
  const seaBot = WALL_Y;
  const groundTop = WALL_Y;
  const groundBot = -hh;

  // --- 1. Sky strip (very top, above ships) ---
  const skyH = skyTop - skyBot;
  if (skyH > 0) {
    const skyGeo = new THREE.PlaneGeometry(ww + 2, skyH);
    const skyMat = new THREE.MeshBasicMaterial({ color: COL_SKY, depthWrite: false });
    const skyMeshObj = new THREE.Mesh(skyGeo, skyMat);
    skyMeshObj.position.set(0, skyBot + skyH / 2, -10);
    scene.add(skyMeshObj);
  }

  // --- 2. Sea (from ship spawn down to wall — where ships sail) ---
  const seaH = seaTop - seaBot;
  const seaGeo = new THREE.PlaneGeometry(ww + 2, seaH);
  const seaMat = new THREE.MeshBasicMaterial({ color: COL_DEEP_SEA, depthWrite: false });
  const seaBgMesh = new THREE.Mesh(seaGeo, seaMat);
  seaBgMesh.position.set(0, seaBot + seaH / 2, -10);
  scene.add(seaBgMesh);

  // Sea wave texture overlay
  const seaCanvas = document.createElement('canvas');
  seaCanvas.width = 32;
  seaCanvas.height = 256;
  const ctx = seaCanvas.getContext('2d');
  drawSeaTexture(ctx, 32, 256);
  seaTexture = new THREE.CanvasTexture(seaCanvas);
  seaTexture.wrapS = THREE.RepeatWrapping;
  seaTexture.wrapT = THREE.RepeatWrapping;
  seaTexture.minFilter = THREE.LinearFilter;
  const seaOverGeo = new THREE.PlaneGeometry(ww + 2, seaH);
  const seaOverMat = new THREE.MeshBasicMaterial({ map: seaTexture, transparent: true, opacity: 0.4, depthWrite: false });
  seaMesh = new THREE.Mesh(seaOverGeo, seaOverMat);
  seaMesh.position.set(0, seaBot + seaH / 2, -9.5);
  scene.add(seaMesh);

  // --- 3. City ground (bottom — wall, mirrors, player area) ---
  const groundH = groundTop - groundBot;
  const groundGeo = new THREE.PlaneGeometry(ww + 2, groundH);
  const groundMat = new THREE.MeshBasicMaterial({ color: COL_GROUND, depthWrite: false });
  const groundMeshObj = new THREE.Mesh(groundGeo, groundMat);
  groundMeshObj.position.set(0, groundBot + groundH / 2, -10);
  scene.add(groundMeshObj);

  // Wall line (visible breach boundary)
  const wallGeo = new THREE.PlaneGeometry(ww + 2, 0.8);
  const wallMat = new THREE.MeshBasicMaterial({ color: 0xcc3333, transparent: true, opacity: 0.6, depthWrite: false });
  const wallMesh = new THREE.Mesh(wallGeo, wallMat);
  wallMesh.position.set(0, WALL_Y, -9.2);
  scene.add(wallMesh);
}

function updateBackground(dt) {
  if (seaTexture && !reduceMotion) {
    seaTexture.offset.y += dt * 0.015;
  }
}

function drawSeaTexture(ctx, w, h) {
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, '#1A4257');
  gradient.addColorStop(1, '#12303F');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(30, 60, 80, 0.2)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const y = 40 + i * 55;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
      ctx.lineTo(x, y + Math.sin(x * 0.5 + i * 2) * 2);
    }
    ctx.stroke();
  }
}


// === src/beam.js ===
// ============================================================
// src/beam.js — Iterative raycast beam solver with resonance detection
// ============================================================


// Segment: { start, end, colour, intensity, bounces, preSplit }
let segments = [];
let dirty = true;
// Diagnostics — read by debug overlay
let maxBouncesUsed = 0;
let hitBounceCap = false;
function markDirty() { dirty = true; }
function isDirty() { return dirty; }
function getSegments() { return segments; }
function getBeamDiag() { return { maxBouncesUsed, hitBounceCap }; }
// Resonance: detected when 3+ bounces occur between the same mirror pair
let resonanceActive = false;
let resonanceMirrors = null; // [mirrorA, mirrorB] if resonance detected
function getResonanceActive() { return resonanceActive; }
function getResonanceMirrors() { return resonanceMirrors; }
// Called by main loop when dirty
function solve(sourceX, sourceY, mirrors, prisms, worldWidth, foundryColliders) {
  segments = [];
  maxBouncesUsed = 0;
  hitBounceCap = false;
  resonanceActive = false;
  resonanceMirrors = null;
  mirrorHitSequence = [];
  const dir = { x: 0, y: -1 };
  traceBeam(
    { x: sourceX, y: sourceY },
    dir,
    COLOUR_WHITE,
    1.0,
    mirrors,
    prisms,
    [], // foundries are pass-through, not colliders
    worldWidth,
    MAX_BOUNCES,
    null,
    0,
    true // preSplit: this is the raw sun beam before hitting prism
  );
  dirty = false;
  // Post-solve: detect resonance (3+ bounces between same mirror pair)
  detectResonance();
}
let mirrorHitSequence = [];
function detectResonance() {
  if (mirrorHitSequence.length < RESONANCE_MIN_BOUNCES) return;
  for (let i = 0; i <= mirrorHitSequence.length - RESONANCE_MIN_BOUNCES; i++) {
    const a = mirrorHitSequence[i], b = mirrorHitSequence[i + 1];
    if (!a || !b || a === b) continue;
    let count = 2;
    for (let j = i + 2; j < mirrorHitSequence.length; j++) {
      if (mirrorHitSequence[j] === ((j - i) % 2 === 0 ? a : b)) count++; else break;
    }

// ============================================================
// src/beam-render.js — Quad mesh pool for beam segment rendering
//
// Each segment is a textured quad with additive blending.
// A second wider quad behind provides soft glow.
// Pool is pre-allocated; unused meshes are hidden.
//
// Width encodes power: thicker = stronger beam.
// Gold band renders thinner and pulses slowly.
// ============================================================




const meshes = [];      // { core: Mesh, glow: Mesh }
let poolReady = false;
let pulseTime = 0;

// Gold is rendered at 60% width of other bands to be visually distinct
const GOLD_WIDTH_FACTOR = 0.6;

function initBeamRenderer() {
  const scene = getScene();
  for (let i = 0; i < BEAM_SEGMENT_POOL_SIZE; i++) {
    const core = createQuadMesh(1.0);
    const glow = createQuadMesh(0.35);
    core.visible = false;
    glow.visible = false;
    // Beams render behind objects (z < 0)
    glow.position.z = -0.5;
    core.position.z = -0.3;
    scene.add(glow);
    scene.add(core);
    meshes.push({ core, glow });
  }
  poolReady = true;
}

function updateBeamPulse(dt) {
  pulseTime += dt;
}

function rebuildBeams(segments) {
  if (!poolReady) return;

  for (let i = 0; i < BEAM_SEGMENT_POOL_SIZE; i++) {
    const entry = meshes[i];
    if (i < segments.length) {
      const seg = segments[i];

      // Width proportional to intensity: full=1.0, halved sub-ray=0.5
      let widthMult = seg.intensity;
      // Gold is thinner
      if (seg.colour === COLOUR_GOLD) widthMult *= GOLD_WIDTH_FACTOR;
      // Gold pulses: opacity oscillates 0.7–1.0
      let opacityMult = 1.0;
      if (seg.colour === COLOUR_GOLD) {
        opacityMult = 0.7 + 0.3 * Math.sin(pulseTime * 2.5);
      }

      const coreW = BEAM_WIDTH * widthMult;
      const glowW = BEAM_GLOW_WIDTH * widthMult;

      // Edge fade: reduce opacity if segment ends near world boundary
      const hh = WORLD_HEIGHT / 2;
      const edgeMargin = 4; // fade starts this many units from edge
      const endDistFromEdge = Math.min(
        Math.abs(seg.end.x) < 28 ? 99 : 28 - Math.abs(seg.end.x) + edgeMargin,
        hh - Math.abs(seg.end.y) + edgeMargin
      );
      const edgeFade = Math.min(1, Math.max(0.1, endDistFromEdge / edgeMargin));
      const finalOpacity = opacityMult * edgeFade;

      positionQuad(entry.core, seg.start, seg.end, coreW);
      positionQuad(entry.glow, seg.start, seg.end, glowW);
      setQuadColour(entry.core, seg.colour, seg.intensity * finalOpacity);
      setQuadColour(entry.glow, seg.colour, seg.intensity * 0.35 * finalOpacity);
      entry.core.visible = true;
      entry.glow.visible = true;
    } else {
      entry.core.visible = false;
      entry.glow.visible = false;
    }
  }
}

function createQuadMesh(opacity) {
  const geo = new THREE.PlaneGeometry(1, 1);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  return new THREE.Mesh(geo, mat);
}

function positionQuad(mesh, start, end, width) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);

  mesh.position.x = (start.x + end.x) / 2;
  mesh.position.y = (start.y + end.y) / 2;

  mesh.scale.x = length;
  mesh.scale.y = width;

  mesh.rotation.z = angle;
}

function setQuadColour(mesh, colour, intensity) {
  mesh.material.color.setHex(colour);
  mesh.material.opacity = Math.min(1.0, intensity);
}

// Hide/show all beam geometry (for game-over screen)
function setBeamsVisible(visible) {
  for (let i = 0; i < meshes.length; i++) {
    meshes[i].core.visible = visible && meshes[i].core.visible;
    meshes[i].glow.visible = visible && meshes[i].glow.visible;
  }
  if (!visible) {
    for (let i = 0; i < meshes.length; i++) {
      meshes[i].core.visible = false;
      meshes[i].glow.visible = false;
    }
  }
}

// src/mirror.js — Mirror objects, generic socket system, tweens

const sockets = [];
const mirrors = [];

const MIRROR_THICKNESS = 1;

// Active tweens: { mirror, fromX, fromY, toX, toY, elapsed, duration }
const tweens = [];

function initSockets() {
  sockets.length = 0;
  for (let i = 0; i < SOCKET_POSITIONS.length; i++) {
    sockets.push({ type: null, objectRef: null });
  }
}

function getSockets() { return sockets; }
function getSocketPositions() { return SOCKET_POSITIONS; }
function getMirrors() { return mirrors; }

function initMirrors() {
  const scene = getScene();
  mirrors.length = 0;
  tweens.length = 0;
  mirrorMeshGroup = new THREE.Group();
  scene.add(mirrorMeshGroup);

  for (let i = 0; i < MIRROR_COUNT_START; i++) {
    const socketIdx = DEFAULT_MIRROR_SOCKETS[i];
    const mirror = createMirror(socketIdx);
    // Default angles: flank mirrors horizontal (aim bands into ship lanes),
    // centre mirror vertical (needs player rotation to be useful)
    if (i === 1) {
      // Centre mirror (socket 4 at x=0): vertical, beam goes sideways
      mirror.angle = Math.PI / 2;
    } else {
      // Flank mirrors (sockets 3,5 at x=±15): horizontal, beam goes up
      mirror.angle = 0;
    }
    updateMirrorGeometry(mirror);
    mirrors.push(mirror);
    sockets[socketIdx].type = 'mirror';
    sockets[socketIdx].objectRef = mirror;
  }

  // Socket indicators: hidden when FREE_PLACEMENT is true
  if (!FREE_PLACEMENT) {
    for (let i = 0; i < SOCKET_POSITIONS.length; i++) {
      const [sx, sy] = SOCKET_POSITIONS[i];
      const indicator = new THREE.Mesh(
        new THREE.RingGeometry(1.5, 1.8, 16),
        new THREE.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.5 })
      );
      indicator.position.set(sx, sy, -1.0);
      mirrorMeshGroup.add(indicator);
    }
  }
}

function createMirror(socketIndex) {
  const [sx, sy] = SOCKET_POSITIONS[socketIndex];
  const angle = 0; // default, overridden in initMirrors per-mirror

  const geo = new THREE.PlaneGeometry(MIRROR_LENGTH, MIRROR_THICKNESS);
  const mat = new THREE.MeshBasicMaterial({ color: 0x8888cc });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(sx, sy, 0);
  mesh.rotation.z = angle;
  mirrorMeshGroup.add(mesh);

  return {
    id: socketIndex,
    socketIndex,
    angle,
    hits: 0,
    shattered: false,
    reinforced: false,
    anchored: false,
    freeX: sx,
    freeY: sy,
    mesh,
    p1: { x: 0, y: 0 },
    p2: { x: 0, y: 0 },
    normal: { x: 0, y: 0 },
    length: MIRROR_LENGTH,
  };
}

function updateMirrorGeometry(mirror) {
  let sx, sy;
  if (FREE_PLACEMENT && mirror.freeX !== undefined) {
    sx = mirror.freeX;
    sy = mirror.freeY;
  } else {
    [sx, sy] = SOCKET_POSITIONS[mirror.socketIndex];
  }
  const halfLen = mirror.length / 2;
  const cos = Math.cos(mirror.angle);
  const sin = Math.sin(mirror.angle);

  mirror.p1 = { x: sx - halfLen * cos, y: sy - halfLen * sin };
  mirror.p2 = { x: sx + halfLen * cos, y: sy + halfLen * sin };
  mirror.normal = { x: -sin, y: cos };

  mirror.mesh.position.set(sx, sy, 0);
  mirror.mesh.rotation.z = mirror.angle;
}

// Free placement: move mirror to position, clamped to mirror field
function moveMirrorFree(mirror, x, y) {
  const ww = getWorldWidth();
  const hw = ww / 2;
  mirror.freeX = Math.max(-hw + 2, Math.min(hw - 2, x));
  mirror.freeY = Math.max(MIRROR_FIELD_BOT, Math.min(MIRROR_FIELD_TOP, y));

}

// --- Tween system ---

// Ease-out cubic: decelerates to zero
function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

// Start a tween from current visual position to target socket
function startTween(mirror, fromX, fromY) {
  const [toX, toY] = SOCKET_POSITIONS[mirror.socketIndex];
  // Remove any existing tween for this mirror
  for (let i = tweens.length - 1; i >= 0; i--) {
    if (tweens[i].mirror === mirror) tweens.splice(i, 1);
  }
  tweens.push({
    mirror,
    fromX, fromY,
    toX, toY,
    elapsed: 0,
    duration: MIRROR_TWEEN_MS / 1000
  });

// Called from main loop each frame. Returns true if any tween is active.
function updateMirrorTweens(dt) {
  let anyActive = false;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt;
    const t = Math.min(tw.elapsed / tw.duration, 1);
    const e = easeOut(t);

    const x = tw.fromX + (tw.toX - tw.fromX) * e;
    const y = tw.fromY + (tw.toY - tw.fromY) * e;
    tw.mirror.mesh.position.x = x;
    tw.mirror.mesh.position.y = y;

    // During tween, update geometry based on interpolated position
    // so beam sweeps smoothly
    const halfLen = tw.mirror.length / 2;
    const cos = Math.cos(tw.mirror.angle);
    const sin = Math.sin(tw.mirror.angle);
    tw.mirror.p1 = { x: x - halfLen * cos, y: y - halfLen * sin };
    tw.mirror.p2 = { x: x + halfLen * cos, y: y + halfLen * sin };
    tw.mirror.normal = { x: -sin, y: cos };

    const other = targetSocket.objectRef;
    sockets[oldIndex].type = targetSocket.type;
    sockets[oldIndex].objectRef = other;

      other.socketIndex = oldIndex;
      const [ox, oy] = SOCKET_POSITIONS[oldIndex];
      if (other.mesh) other.mesh.position.set(ox, oy, 0);
      if (other.p1) updateMirrorGeometry(other);
      if (other.position) {

        other.position.y = oy;

    }

    sockets[oldIndex].objectRef = null;

  sockets[newSocketIndex].objectRef = mirror;

}

function damageMirror(mirror) {

  mirror.mesh.material.opacity = 1.0;
  mirror.mesh.material.transparent = false;

}

function updateAllMirrorGeometries() {

}

// Reset all mirrors to default positions, angles, and states
function resetMirrors() {
  for (let i = 0; i < mirrors.length; i++) {

    sockets[socketIdx].objectRef = mirror;
    updateMirrorGeometry(mirror);
  }
}

// ============================================================
// src/prism.js — Prism: fixed infrastructure at (0, PRISM_Y)
// Not draggable. Splits the white sun beam into coloured bands.
// ============================================================





const prisms = [];
const PRISM_RADIUS = 2.5;
let activeTier = DEFAULT_PRISM_TIER;

function getPrisms() { return prisms; }
function getActiveTier() { return activeTier; }
function getActiveTierData() { return PRISM_TIERS[activeTier]; }

function setTier(newTier) {
  activeTier = newTier;
  markDirty();
}

function resetTier() { activeTier = DEFAULT_PRISM_TIER; }

function resetPrisms() {
  // Prism is fixed — just reset tier
  activeTier = DEFAULT_PRISM_TIER;
  markDirty();
}

function initPrisms() {
  if (prisms.length > 0) return; // already placed, don't duplicate
  const scene = getScene();
  const x = 0;
  const y = PRISM_Y;

  const r = PRISM_RADIUS;
  const group = new THREE.Group();
  group.position.set(x, y, 0.2);

  // Diamond shape: 4 facet triangles
  const verts = [
    { x: 0, y: r },
    { x: r, y: 0 },
    { x: 0, y: -r },
    { x: -r, y: 0 },
  ];
  const facetColours = [0xddeeff, 0xbbddee, 0xaaccdd, 0xccddee];
  const bottomTints = [null, null, 0xffe9a0, 0xff8c1a];
  for (let i = 0; i < 4; i++) {
    const a = verts[i];
    const b = verts[(i + 1) % 4];
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(a.x, a.y);
    shape.lineTo(b.x, b.y);
    shape.closePath();
    const geo = new THREE.ShapeGeometry(shape);
    const col = bottomTints[i] || facetColours[i];
    const mat = new THREE.MeshBasicMaterial({
      color: col, transparent: true,
      opacity: i >= 2 ? 0.7 : 0.85,
    });
    const facetMesh = new THREE.Mesh(geo, mat);
    facetMesh.position.z = 0.01 * i;
    group.add(facetMesh);
  }

  // Internal glow
  const glowGeo = new THREE.PlaneGeometry(r * 1.4, r * 1.4);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xddeeff, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const glowMesh = new THREE.Mesh(glowGeo, glowMat);
  glowMesh.position.z = -0.05;
  group.add(glowMesh);

  scene.add(group);

  const prism = {
    id: 0,
    position: { x: x, y: y },
    radius: PRISM_RADIUS,
    mesh: group,
    glowMat,
  };
  prisms.push(prism);
  markDirty();
}

// Update prism glow based on beam activity
function updatePrismGlow(segments) {
  for (const prism of prisms) {
    if (!prism.glowMat) continue;
    let lit = false;
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      const dx = seg.end.x - prism.position.x;
      const dy = seg.end.y - prism.position.y;
      if (dx * dx + dy * dy < prism.radius * prism.radius * 2) {
        lit = true;
        break;
      }
    }
    prism.glowMat.opacity = lit ? 0.5 + 0.2 * Math.sin(performance.now() * 0.005) : 0.15;
  }
}

const pool = [];
let enemyGroup = null;

function initEnemies() {

    );
    sail.position.y = 1.5;
    sail.position.z = 0.03;
    mesh.add(sail);

    mesh.visible = false;
    const mat = hull.material; // reference for colour changes

    // Burn meter bar
    const barBg = new THREE.Mesh(
      new THREE.PlaneGeometry(5, 0.8),
      new THREE.MeshBasicMaterial({ color: 0x111111 })
    );
    barBg.position.y = -2.5;
    barBg.position.z = 0.1;
    mesh.add(barBg);
    const barFill = new THREE.Mesh(
      new THREE.PlaneGeometry(5, 0.8),
      new THREE.MeshBasicMaterial({ color: 0xff4400 })
    );
    barFill.position.y = -2.5;
    barFill.position.z = 0.15;
    barFill.scale.x = 0;
    mesh.add(barFill);

    enemyGroup.add(mesh);
    pool.push({
      active: false, type: 'skiff',
      hp: 0, maxHp: 0, armour: 0, heat: 0,
      lane: 0, y: SHIP_SPAWN_Y,
      speed: 0, baseSpeed: 0,
      burn: 0, slowed: false,
      bandsHitting: 0, lastHitColour: 0,
      mesh, barFill, hullMat: mat
    });
  }
}

function getEnemyPool() { return pool; }

function spawnEnemy(type, lane, hpMultiplier) {
  const template = ENEMY_TYPES[type];
  if (!template) return null;
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) {
      e.active = true;
      e.type = type;
      e.maxHp = template.hp * hpMultiplier;
      e.hp = e.maxHp;
      e.armour = template.armour;
      e.lane = lane;
      e.y = SHIP_SPAWN_Y;
      e.speed = template.speed;
      e.baseSpeed = template.speed;
      e.burn = 0;
      e.heat = 0;
      e.slowed = false;
      e.bandsHitting = 0;
      e.lastHitColour = 0;
      e.mesh.visible = true;
      e.barFill.scale.x = 0;
      positionEnemy(e);
      updateEnemyVisual(e);
      return e;
    }
  }
  return null;
}

// Ships move DOWNWARD (negative Y)
function updateEnemies(dt) {
  let wallDamage = 0;
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;
    e.slowed = false;
    e.y -= e.speed * dt; // descend
    if (e.y <= WALL_Y) {
      // Breach: ship reached the wall
      const dmg = BREACH_DAMAGE[e.type] || 10;
      const heatFrac = Math.min(1, (e.heat || 0) / e.maxHp);
      wallDamage += dmg * Math.max(0.2, 1 - heatFrac);
      deactivateEnemy(e);
      continue;
    }
    positionEnemy(e);
    updateEnemyVisual(e);
  }
  return wallDamage;
}

function applyGoldSlow(enemy) { enemy.slowed = true; }

function applySlowStates() {
  for (let i = 0; i < pool.length; i++) {
    const e = pool[i];
    if (!e.active) continue;
    e.speed = e.slowed ? e.baseSpeed * 0.5 : e.baseSpeed;
  }
}

function deactivateEnemy(enemy) {
  enemy.active = false;
  enemy.mesh.visible = false;
}

function triggerKillEffect(enemy, reward) {
  addKillReward(reward);
  if (enemy.hullMat) enemy.hullMat.color.setHex(0xffffff);
}

function getActiveEnemies() { return pool.filter(e => e.active); }

function resetEnemies() {
  for (let i = 0; i < pool.length; i++) {
    pool[i].active = false;
    pool[i].mesh.visible = false;
  }
}

function positionEnemy(e) {
  const worldWidth = getWorldWidth();
  const laneWidth = worldWidth / ENEMY_LANE_COUNT;
  const x = -worldWidth / 2 + laneWidth * (e.lane + 0.5);
  e.mesh.position.x = x;
  e.mesh.position.y = e.y;
}

function updateEnemyVisual(e) {
  e.burn = Math.max(0, (e.heat || 0) / e.maxHp);
  e.barFill.scale.x = e.burn;
  e.barFill.position.x = -2.5 * (1 - e.burn);
  if (e.bandsHitting > 0 && e.lastHitColour !== 0) {
    const r = ((e.lastHitColour >> 16) & 0xff) / 255;
    const g = ((e.lastHitColour >> 8) & 0xff) / 255;
    const b = (e.lastHitColour & 0xff) / 255;
    const t = Math.min(0.3 + e.burn * 1.0, 1.0);
    e.hullMat.color.setRGB(0.25*(1-t)+r*t, 0.2*(1-t)+g*t, 0.2*(1-t)+b*t);
  } else if (e.slowed) {
    e.hullMat.color.setRGB(0.4, 0.5, 0.25);
  } else {
    const brightness = 0.35 + 0.15 * (1 - e.burn);
    e.hullMat.color.setRGB(brightness, brightness*0.8, brightness*0.8);
  }
  const sizes = { skiff: 2.5, trireme: 3.5, quadrireme: 4.5, flagship: 8 };
  const s = sizes[e.type] || 3;
  e.mesh.scale.set(s/3, s/3, 1);
}


// === src/enemy-spawner.js ===
// ============================================================
// src/enemy-spawner.js — Spawn schedule for 600s session
// Phase 1 (0-1:00): Skiffs. Phase 2 (1-3:00): Triremes+Quadriremes.
// Phase 3 (3-9:00): Heavy mix. Phase 4 (9-10:00): Flagship.
// ============================================================




const PHASE1_INTERVAL = 2.5;
const PHASE2_INTERVAL = 1.5;
const PHASE3_INTERVAL = 1.2;
const INITIAL_DELAY = 2.0;

let spawnTimer = 0;
let spawnerElapsed = 0;
let totalSpawns = 0;
let flagshipSpawned = false;

function getSpawnCount() { return totalSpawns; }
function getCurrentInterval() { return getInterval(); }

function updateSpawner(dt, sessionTime) {
  spawnerElapsed = sessionTime;
  spawnTimer -= dt;
  if (spawnTimer <= 0 && spawnerElapsed >= INITIAL_DELAY) {
    doSpawn();
    totalSpawns++;
    spawnTimer = getInterval();
  }
}

function resetSpawner() {
  spawnTimer = INITIAL_DELAY;
  spawnerElapsed = 0;
  totalSpawns = 0;
  flagshipSpawned = false;
}

function getInterval() {
  if (spawnerElapsed < PHASE_1_END) return PHASE1_INTERVAL;
  if (spawnerElapsed < PHASE_2_END) return PHASE2_INTERVAL;
  return PHASE3_INTERVAL;
}

function doSpawn() {
  const hpMult = 1 + (spawnerElapsed / SESSION_DURATION) * ESCALATION_HP_FACTOR;
  const lane = Math.floor(Math.random() * ENEMY_LANE_COUNT);

  if (spawnerElapsed >= PHASE_3_END && !flagshipSpawned) {
    // Flagship at 9:00
    spawnEnemy('flagship', 2, 1.0); // no escalation on boss
    flagshipSpawned = true;
    return;
  }

  if (spawnerElapsed < PHASE_1_END) {
    spawnEnemy('skiff', lane, hpMult);
  } else if (spawnerElapsed < PHASE_2_END) {
    // Heavier ships in centre lane (lane 2), lighter on edges
    const centreLane = 2;
    const edgeLane = Math.random() < 0.5 ? 0 : 4;
    const roll = Math.random();
    if (roll < 0.3) {
      // Heavy in centre
      spawnEnemy('quadrireme', centreLane, hpMult);
    } else if (roll < 0.6) {
      spawnEnemy('trireme', centreLane, hpMult);
    } else {
      // Fast skiffs on random lane
      spawnEnemy('skiff', lane, hpMult);
    }
    // Periodic paired edge waves (every 5th spawn)
    if (totalSpawns % 5 === 0) {
      spawnEnemy('skiff', 0, hpMult);
      spawnEnemy('skiff', 4, hpMult);
    }
  } else {
    // Phase 3: heavy centre + paired edges
    const centreLane = 2;
    const roll = Math.random();
    if (roll < 0.4) {
      spawnEnemy('quadrireme', centreLane, hpMult);
    } else if (roll < 0.7) {
      spawnEnemy('trireme', centreLane, hpMult);
    } else {
      spawnEnemy('skiff', lane, hpMult);
    }
    if (totalSpawns % 4 === 0) {
      spawnEnemy('trireme', 0, hpMult);
      spawnEnemy('trireme', 4, hpMult);
    }
  }
}

// ============================================================
// src/foundry.js — Beam-powered altar economy with overheat
//
// 4 altar zones on the city ground. Each requires a beam held on it
// for 80% of its rate. 20% accrues passively.
// Overheat: efficiency halves after 6s continuous, recovers over 10s.
// No beam can reach an altar AND a ship (opposite directions).
// ============================================================





let resources = { brass: 0, bronze: 0, silver: 0, gold: 0 };
let faith = 0;
let priestCount = 0;
const altars = [];

function getResources() { return resources; }
function getFaith() { return faith; }
function getPriestCount() { return priestCount; }
function addPriest() { priestCount++; }

function canAfford(cost) {
  if (!cost) return false;
  for (const key in cost) {
    if ((resources[key] || 0) < cost[key]) return false;
  }
  return true;
}

function spend(cost) {
  for (const key in cost) { resources[key] -= cost[key]; }
}

function addKillReward(reward) {
  if (!reward) return;
  for (const key in reward) { resources[key] = (resources[key] || 0) + reward[key]; }
}

function resetFoundries() {
  resources = { brass: 0, bronze: 0, silver: 0, gold: 0 };
  faith = 0;
  priestCount = 0;
  for (const a of altars) { a.litTime = 0; a.overheated = false; a.cooldown = 0; a.everLit = false; }
}

function spendFaith(amount) { faith -= amount; }

function initFoundries() {
  const scene = getScene();
  resetFoundries();
  altars.length = 0;

  for (let i = 0; i < ALTAR_POSITIONS.length; i++) {
    const def = ALTAR_POSITIONS[i];

    // --- Glow ring (attention-grabbing pulse when unlit) ---
    const glowGeo = new THREE.RingGeometry(
      Math.max(ALTAR_HW, ALTAR_HH) * 1.3,
      Math.max(ALTAR_HW, ALTAR_HH) * 1.6,
      32
    );
    const glowMat = new THREE.MeshBasicMaterial({
      color: def.colour, transparent: true, opacity: 0.0, side: THREE.DoubleSide
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    glowMesh.position.set(def.x, def.y, -0.2);
    scene.add(glowMesh);

    // --- Altar body mesh ---
    const geo = new THREE.PlaneGeometry(ALTAR_HW * 2, ALTAR_HH * 2);
    const mat = new THREE.MeshBasicMaterial({
      color: def.colour, transparent: true, opacity: 0.25
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(def.x, def.y, -0.1);
    scene.add(mesh);

    // --- Label ---
    const lCanvas = document.createElement('canvas');
    lCanvas.width = 64; lCanvas.height = 20;
    const lCtx = lCanvas.getContext('2d');
    lCtx.fillStyle = '#ffffff';
    lCtx.font = 'bold 10px monospace';
    lCtx.textAlign = 'center';
    lCtx.fillText(def.type.toUpperCase(), 32, 14);
    const lTex = new THREE.CanvasTexture(lCanvas);
    lTex.minFilter = THREE.LinearFilter;
    const lGeo = new THREE.PlaneGeometry(6, 2);
    const lMat = new THREE.MeshBasicMaterial({ map: lTex, transparent: true, depthWrite: false });
    const labelMesh = new THREE.Mesh(lGeo, lMat);
    labelMesh.position.set(def.x, def.y + ALTAR_HH + 1.5, 0.2);
    scene.add(labelMesh);

    // --- Overheat arc (RingGeometry with partial theta) ---
    const arcRadius = Math.max(ALTAR_HW, ALTAR_HH) * 1.1;
    const arcGeo = new THREE.RingGeometry(arcRadius - 0.3, arcRadius, 32, 1, 0, 0.01);
    const arcMat = new THREE.MeshBasicMaterial({
      color: 0x44cc44, transparent: true, opacity: 0.9, side: THREE.DoubleSide
    });
    const arcMesh = new THREE.Mesh(arcGeo, arcMat);
    arcMesh.position.set(def.x, def.y, 0.3);
    arcMesh.visible = false;
    scene.add(arcMesh);

    altars.push({
      type: def.type, colour: def.colour,
      x: def.x, y: def.y,
      mesh, glowMesh, arcMesh, arcRadius,
      lit: false, everLit: false,
      litTime: 0, overheated: false, cooldown: 0
    });
  }
}

function updateFoundries(dt) {
  const segments = getSegments();
  const time = performance.now() * 0.001; // seconds for animation

  for (const altar of altars) {
    // Check if any beam segment hits this altar (segment-vs-AABB)
    // Pre-split beam (raw sun column) does not power altars
    altar.lit = false;
    for (let s = 0; s < segments.length; s++) {
      if (segments[s].preSplit) continue;
      if (segHitsBox(segments[s], altar.x, altar.y, ALTAR_HW, ALTAR_HH)) {
        altar.lit = true;
        break;
      }
    }
    if (altar.lit) altar.everLit = true;

    // Overheat logic
    if (altar.lit) {
      altar.litTime += dt;
      altar.cooldown = 0;
    } else {
      altar.litTime = 0;
      if (altar.overheated) {
        altar.cooldown += dt;
        if (altar.cooldown >= ALTAR_RECOVER_TIME) {
          altar.overheated = false;
          altar.cooldown = 0;
        }
      }
    }
    if (altar.litTime >= ALTAR_OVERHEAT_TIME && !altar.overheated) {
      altar.overheated = true;
    }

    // Compute efficiency
    let efficiency = 1.0;
    if (altar.overheated) efficiency = 0.5;

    // Resource accumulation
    const rates = ALTAR_RATES[altar.type];
    const passiveRate = rates.passive;
    const litRate = altar.lit ? rates.lit : 0;
    const totalRate = (passiveRate + litRate) * efficiency;
    resources[altar.type] += totalRate * dt;

    // --- VISUAL FEEDBACK ---

    // 1. Body mesh opacity
    if (altar.lit) {
      altar.mesh.material.opacity = altar.overheated ? 0.55 : 0.8;
    } else {
      // Unlit: gentle pulse if never lit (attract attention)
      if (!altar.everLit) {
        const pulse = 0.2 + 0.15 * Math.sin(time * 2.5 + altar.x * 0.5);
        altar.mesh.material.opacity = pulse;
      } else {
        altar.mesh.material.opacity = 0.25;
      }
    }

    // 2. Glow ring
    if (altar.lit) {
      // Steady bright glow matching metal colour
      altar.glowMesh.material.opacity = altar.overheated ? 0.2 : 0.5;
    } else if (!altar.everLit) {
      // Attention pulse — gentle breathing glow
      const gPulse = 0.1 + 0.2 * Math.abs(Math.sin(time * 1.8 + altar.x * 0.3));
      altar.glowMesh.material.opacity = gPulse;
    } else {
      altar.glowMesh.material.opacity = 0.0;
    }

    // 3. Overheat arc
    const heatFrac = Math.min(1, altar.litTime / ALTAR_OVERHEAT_TIME);
    const coolFrac = altar.overheated ? (1 - altar.cooldown / ALTAR_RECOVER_TIME) : 0;
    const arcFrac = altar.lit ? heatFrac : coolFrac;

    if (arcFrac > 0.01) {
      altar.arcMesh.visible = true;
      // Rebuild arc geometry with new theta length
      const theta = arcFrac * Math.PI * 2;
      altar.arcMesh.geometry.dispose();
      altar.arcMesh.geometry = new THREE.RingGeometry(
        altar.arcRadius - 0.3, altar.arcRadius, 32, 1,
        Math.PI * 0.5, // start at top
        theta
      );
      // Color: green → yellow → red
      if (arcFrac < 0.5) altar.arcMesh.material.color.setHex(0x44cc44);
      else if (arcFrac < 0.8) altar.arcMesh.material.color.setHex(0xcccc44);
      else altar.arcMesh.material.color.setHex(0xcc4444);
      if (altar.overheated) altar.arcMesh.material.color.setHex(0xcc4444);
    } else {
      altar.arcMesh.visible = false;
    }
  }

  // Priests generate faith
  faith += priestCount * dt;
}

// Segment-vs-AABB intersection test
function segHitsBox(seg, cx, cy, hw, hh) {
  const sx = seg.start.x, sy = seg.start.y;
  const ex = seg.end.x, ey = seg.end.y;
  const dx = ex - sx, dy = ey - sy;
  const xmin = cx - hw, xmax = cx + hw;
  const ymin = cy - hh, ymax = cy + hh;
  let tmin = 0, tmax = 1;
  if (Math.abs(dx) < 1e-8) {
    if (sx < xmin || sx > xmax) return false;
  } else {
    let t1 = (xmin - sx) / dx, t2 = (xmax - sx) / dx;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }
  if (Math.abs(dy) < 1e-8) {
    if (sy < ymin || sy > ymax) return false;
  } else {
    let t1 = (ymin - sy) / dy, t2 = (ymax - sy) / dy;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return false;
  }
  return true;
}

// Legacy compatibility
function getSlag() { return resources.brass; }
function getInsight() { return resources.bronze; }
function getRecombination() { return 0; }
function getInsightLog() { return []; }
function spendSlag() {}
function spendInsight() {}
function addSlagDirect(amount) { resources.brass += amount; }
function getFoundryColliders() { return []; }
function getAltarAudioState() {
  let litCount = 0;
  let anyOverheated = false;
  for (const a of altars) {
    if (a.lit) litCount++;
    if (a.overheated) anyOverheated = true;
  }
  return { litCount, anyOverheated };
}

  { id: 'prism6', label: '6-Prism', getCost: () => SHOP.prism6 },
  { id: 'priest', label: 'Priest', getCost: () => SHOP.priest },
  { id: 'zeus',   label: 'Zeus', getCost: () => ({ faith: GOD_ABILITIES.zeus.faith, gold: GOD_ABILITIES.zeus.gold }) },
];

function getFocusMultiplier() { return 1 + focusCount * 0.15; }

function initCrafting() {
  const oScene = getOverlayScene();
  const worldWidth = getWorldWidth();
  mirrorsBought = 0;
  activeTier = 3;
  focusCount = 0;

  trayWidth = worldWidth * 0.95;
  trayY = -WORLD_HEIGHT / 2 + 3;

  trayCanvas = document.createElement('canvas');
  trayCanvas.width = 512;
  trayCanvas.height = 40;
  trayCtx = trayCanvas.getContext('2d');

  trayTexture = new THREE.CanvasTexture(trayCanvas);
  trayTexture.minFilter = THREE.LinearFilter;

  const geo = new THREE.PlaneGeometry(trayWidth, trayHeight);
  const mat = new THREE.MeshBasicMaterial({ map: trayTexture, transparent: true, depthWrite: false });
  trayMesh = new THREE.Mesh(geo, mat);
  trayMesh.position.set(0, trayY, 0);
  oScene.add(trayMesh);
}

function updateCraftingTray() {
  if (!trayCtx) return;
  const res = getResources();
  const faith = getFaith();

  trayCtx.clearRect(0, 0, 512, 40);
  trayCtx.fillStyle = 'rgba(0,0,0,0.7)';
  trayCtx.fillRect(0, 0, 512, 40);

  const btnW = 512 / SHOP_ITEMS.length;
  for (let i = 0; i < SHOP_ITEMS.length; i++) {
    const item = SHOP_ITEMS[i];
    const cost = item.getCost();
    const affordable = canAffordCombined(cost, res, faith);
    const x = i * btnW;

    // Detect affordability crossing → trigger 300ms pulse
    if (prevAffordable[i] === false && affordable) {
      pulseTimes[i] = 0.3;
    }
    prevAffordable[i] = affordable;
    if (pulseTimes[i] > 0) pulseTimes[i] -= 0.016; // approx 1 frame

    const pulsing = pulseTimes[i] > 0;
    const bgColour = affordable ? (pulsing ? 'rgba(130,130,200,1)' : 'rgba(70,70,120,0.9)') : 'rgba(40,40,50,0.6)';
    const borderCol = affordable ? (pulsing ? '#ffffff' : '#9999cc') : 'rgba(60,60,80,0.4)';

    trayCtx.fillStyle = bgColour;
    trayCtx.fillRect(x + 1, 1, btnW - 2, 38);
    // Border
    trayCtx.strokeStyle = borderCol;
    trayCtx.lineWidth = pulsing ? 2.5 : (affordable ? 1.5 : 0.5);
    trayCtx.strokeRect(x + 1, 1, btnW - 2, 38);

    trayCtx.fillStyle = affordable ? '#ffffff' : '#777777';
    trayCtx.font = 'bold 9px monospace';
    trayCtx.textAlign = 'center';
    trayCtx.fillText(item.label, x + btnW / 2, 14);

    trayCtx.font = '7px monospace';
    trayCtx.fillStyle = affordable ? '#cccccc' : '#555555';
    trayCtx.fillText(costStr(cost), x + btnW / 2, 28);
  }
  trayTexture.needsUpdate = true;
}

function handleCraftTap(worldX, worldY) {
  const halfW = trayWidth / 2;
  const halfH = trayHeight / 2;
  if (worldY < trayY - halfH || worldY > trayY + halfH) return false;
  if (worldX < -halfW || worldX > halfW) return false;

  const normX = (worldX + halfW) / trayWidth;
  const btnIndex = Math.floor(normX * SHOP_ITEMS.length);
  if (btnIndex < 0 || btnIndex >= SHOP_ITEMS.length) return false;

  return attemptPurchase(SHOP_ITEMS[btnIndex]);
}

function resetCrafting() {
  mirrorsBought = 0;
  focusCount = 0;
  if (typeof resetTier === 'function') resetTier();
}

function attemptPurchase(item) {
  const res = getResources();
  const faith = getFaith();
  const cost = item.getCost();
  if (!canAffordCombined(cost, res, faith)) return false;

  // Spend resources
  const resCost = {};
  for (const k in cost) {
    if (k === 'faith') { spendFaith(cost[k]); }
    else { resCost[k] = cost[k]; }
  }
  if (Object.keys(resCost).length > 0) spend(resCost);

  switch (item.id) {
    case 'mirror': mirrorsBought++; break;
    case 'prism4': setTier(4); markDirty(); break;
    case 'prism5': setTier(5); markDirty(); break;
    case 'prism6': setTier(6); markDirty(); break;
    case 'priest': addPriest(); break;
    case 'zeus': triggerGodAbility('zeus'); break;
  }
  return true;
}

function triggerGodAbility(god) {
  // TODO: implement god ability effects
  console.log('[God] ' + god + ' activated!');
}

function canAffordCombined(cost, res, faith) {
  for (const k in cost) {
    if (k === 'faith') { if (faith < cost[k]) return false; }
    else { if ((res[k] || 0) < cost[k]) return false; }
  }
  return true;
}

function costStr(cost) {
  const parts = [];
  for (const k in cost) {
    parts.push(cost[k] + k[0].toUpperCase());
  }
  return parts.join(' ');
}

// ============================================================
// src/effects.js — Contact glow, sparks, destruction sequence, audio
// Pooled sprites, no per-frame allocation.
// ============================================================



// --- Contact glow pool (beam hitting enemy) ---
const GLOW_POOL_SIZE = 8;
const glowPool = [];

// --- Spark pool (short-lived particles on damage) ---
const SPARK_POOL_SIZE = 24;
const sparkPool = [];

// --- Debris pool (destruction particles) ---
const DEBRIS_POOL_SIZE = 16;
const debrisPool = [];

// --- WebAudio context (created on first user interaction) ---
let audioCtx = null;

function initEffects() {
  const scene = getScene();
  // Contact glows
  for (let i = 0; i < GLOW_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(3, 3);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.4;
    scene.add(mesh);
    glowPool.push({ mesh, life: 0, colour: 0xffffff, scale: 1 });
  }
  // Sparks
  for (let i = 0; i < SPARK_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(0.6, 0.6);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffcc00, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.5;
    scene.add(mesh);
    sparkPool.push({ mesh, life: 0, vx: 0, vy: 0 });
  }
  // Debris
  for (let i = 0; i < DEBRIS_POOL_SIZE; i++) {
    const geo = new THREE.PlaneGeometry(1.2, 1.2);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x886644, transparent: true, opacity: 0, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.position.z = 0.3;
    scene.add(mesh);
    debrisPool.push({ mesh, life: 0, vx: 0, vy: 0, gravity: 0 });
  }
}

function updateEffects(dt) {
  // Glows: fade out
  for (const g of glowPool) {
    if (g.life > 0) {
      g.life -= dt;
      g.mesh.material.opacity = Math.max(0, g.life * 2);
      g.mesh.scale.set(g.scale * (1 + (1 - g.life) * 0.5), g.scale * (1 + (1 - g.life) * 0.5), 1);
      if (g.life <= 0) g.mesh.visible = false;
    }
  }
  // Sparks: move + fade
  for (const s of sparkPool) {
    if (s.life > 0) {
      s.life -= dt;
      s.mesh.position.x += s.vx * dt;
      s.mesh.position.y += s.vy * dt;
      s.vy -= 30 * dt; // gravity
      s.mesh.material.opacity = Math.max(0, s.life * 3);
      if (s.life <= 0) s.mesh.visible = false;
    }
  }
  // Debris: move + gravity + fade
  for (const d of debrisPool) {
    if (d.life > 0) {
      d.life -= dt;
      d.mesh.position.x += d.vx * dt;
      d.mesh.position.y += d.vy * dt;
      d.vy -= d.gravity * dt;
      d.mesh.material.opacity = Math.max(0, d.life / 1.5);
      d.mesh.rotation.z += 3 * dt;
      if (d.life <= 0) d.mesh.visible = false;
    }
  }
}

// Spawn a contact glow at position, scaled by DPS
function spawnContactGlow(x, y, colour, dps) {
  for (const g of glowPool) {
    if (g.life <= 0) {
      g.mesh.position.x = x;
      g.mesh.position.y = y;
      g.mesh.material.color.setHex(colour);
      g.mesh.material.opacity = 0.6;
      g.mesh.visible = true;
      g.life = 0.15;
      g.scale = 0.5 + Math.min(dps / 50, 2);
      g.colour = colour;
      return;
    }
  }
}

// Spawn sparks at position
function spawnSparks(x, y, colour, count) {
  for (let n = 0; n < count; n++) {
    for (const s of sparkPool) {
      if (s.life <= 0) {
        s.mesh.position.x = x;
        s.mesh.position.y = y;
        s.mesh.material.color.setHex(colour);
        s.mesh.material.opacity = 1;
        s.mesh.visible = true;
        s.life = 0.2 + Math.random() * 0.2;
        s.vx = (Math.random() - 0.5) * 30;
        s.vy = Math.random() * 20;
        break;
      }
    }
  }
}

// Destruction sequence: flash + debris + audio
function spawnDestruction(x, y) {
  // Flash (large bright glow)
  spawnContactGlow(x, y, 0xffffff, 100);
  // Debris particles
  for (let i = 0; i < 8; i++) {
    for (const d of debrisPool) {
      if (d.life <= 0) {
        d.mesh.position.x = x;
        d.mesh.position.y = y;
        d.mesh.material.opacity = 1;
        d.mesh.visible = true;
        d.life = 0.8 + Math.random() * 0.7; // 0.8-1.5s
        d.vx = (Math.random() - 0.5) * 25;
        d.vy = Math.random() * 15 + 5;
        d.gravity = 20 + Math.random() * 10;
        d.mesh.rotation.z = Math.random() * 6.28;
        break;
      }
    }
  }
  // Audio: wood crack + thump
  playDestructionSound();
}

// --- WebAudio synthesis ---
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return audioCtx;
}

function playDestructionSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  // Wood crack: short noise burst
  const noiseLen = 0.08;
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * noiseLen, ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, now + noiseLen);
  noise.connect(noiseGain).connect(ctx.destination);
  noise.start(now);
  // Low thump: sine at 60Hz
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(60, now);
  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.4, now);
  oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(oscGain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

function resetEffects() {
  for (const g of glowPool) { g.life = 0; g.mesh.visible = false; }
  for (const s of sparkPool) { s.life = 0; s.mesh.visible = false; }
  for (const d of debrisPool) { d.life = 0; d.mesh.visible = false; }
}
